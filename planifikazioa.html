    }));
  }
  function setCatMod(catId, moduloId){
    props.setData(Object.assign({}, d, {categorias: d.categorias.map(function(c){ return c.id===catId ? Object.assign({}, c, {moduloId:moduloId}) : c; })}));
  }
  function expo(){
    var aoa=[["Categoría","Módulo","Unidades","Docente","No docente","P. educativo","Funcionamiento","RIR","TOTAL","Vía pago delegado","Entra en caja"]];
    R.filas.forEach(function(f){ aoa.push([nombreDe(f.cat), f.mod.nombre, f.unidades, r2(f.doc), r2(f.noDoc), r2(f.educ), r2(f.func), r2(f.rir), r2(f.total), r2(f.pd), r2(f.caja)]); });
    aoa.push(["TOTAL","","",r2(T.doc),r2(T.noDoc),r2(T.educ),r2(T.func),r2(T.rir),r2(T.total),r2(T.pd),r2(T.caja)]);
    descargarTabla("ingresos_GV_"+d.curso, [{nombre:"Ingresos GV", aoa:aoa}]);
  }
  var sinModulo = d.categorias.filter(function(c){ return !c.moduloId && num(c.unidades)>0; });
  var card = {padding:"14px 16px"};

  var SV = d.subvenciones || [];
  var ST = subvTotales(d);
  function setSub2(id, campo, val){
    props.setData(Object.assign({}, d, {subvenciones: SV.map(function(x){ if(x.id!==id) return x; var nx=Object.assign({}, x); nx[campo]=(campo==="previsto"||campo==="confirmado")?num(val):val; return nx; })}));
  }
  function addSub(){ props.setData(Object.assign({}, d, {subvenciones: SV.concat([{id:uid("sub"), nombre:"", fuenteId:"", previsto:0, confirmado:0, estado:"prevista", cuando:"", justificar:"", notas:""}])})); }
  function delSub(id){ props.setData(Object.assign({}, d, {subvenciones: SV.filter(function(x){ return x.id!==id; })})); }
  function expoSub(){
    var aoa=[["Subvención","Proyecto / fuente","Estado","Previsto €","Confirmado €","Cuenta €","Riesgo €","Cuándo llega","Justificar","Notas"]];
    SV.forEach(function(x){
      var pv=num(x.previsto), cf=num(x.confirmado);
      var vale=(x.estado==="confirmada"&&cf>0)?cf:pv;
      var ri=(x.estado==="confirmada"&&cf>0&&pv>cf)?(pv-cf):0;
      var f=d.fuentes.filter(function(z){ return z.id===x.fuenteId; })[0];
      aoa.push([x.nombre, f?nombreDe(f):"", x.estado, r2(pv), r2(cf), r2(vale), r2(ri), x.cuando, x.justificar, x.notas]);
    });
    aoa.push(["TOTAL","","",r2(ST.previsto),r2(ST.confirmado),r2(ST.cuenta),r2(ST.riesgo),"","",""]);
    descargarTabla("subvenciones_"+d.curso, [{nombre:"Subvenciones", aoa:aoa}]);
  }

  var RP = d.repartoIngresos;
  var RC = repartoCalc(RP, T.caja);
  function setRP(patch){ props.setData(Object.assign({}, d, {repartoIngresos:Object.assign({}, RP, patch)})); }
  function setPart(id, campo, val){ setRP({partidas: RP.partidas.map(function(x){ if(x.id!==id) return x; var nx=Object.assign({}, x); nx[campo]=(campo==="nombre")?val:num(val); return nx; })}); }
  function addPart(){ setRP({partidas: RP.partidas.concat([{id:uid("rp"), nombre:"", valor:0}])}); }
  function delPart(id){ setRP({partidas: RP.partidas.filter(function(x){ return x.id!==id; })}); }
  function igualar(){
    var n = RP.partidas.length; if(!n) return;
    var v = (RP.modo==="pesos") ? 1 : Math.round(10000/n)/100;
    setRP({partidas: RP.partidas.map(function(x){ return Object.assign({}, x, {valor:v}); })});
  }

  var d = props.data;
  var [tab, setTab] = useState("plantilla");
  var hoy = hoyISO();
  var anioHoy = parseInt(hoy.slice(0,4), 10);
  var mesHoy = parseInt(hoy.slice(5,7), 10);
  var cursoIni = (mesHoy >= 9) ? anioHoy : (anioHoy - 1);
  var [tipoPer, setTipoPer] = useState("curso");
  var [anioPer, setAnioPer] = useState(cursoIni);
  var [desde, setDesde] = useState(cursoIni+"-09-01");
  var [hasta, setHasta] = useState((cursoIni+1)+"-08-31");
  function aplicarPeriodo(tipo, anio){
    setTipoPer(tipo); setAnioPer(anio);
    if(tipo==="curso"){ setDesde(anio+"-09-01"); setHasta((anio+1)+"-08-31"); }
    else if(tipo==="natural"){ setDesde(anio+"-01-01"); setHasta(anio+"-12-31"); }
  }
  var anios = [];
  for(var ai = anioHoy-3; ai <= anioHoy+2; ai++) anios.push(ai);
  var etiquetaPer = (tipoPer==="curso") ? ("Curso " + anioPer + "-" + (anioPer+1))
                  : (tipoPer==="natural") ? ("Año natural " + anioPer)
                  : ("Periodo " + desde + " a " + hasta);
  function nomP(p){ return (p.apellidos+", "+p.nombre).replace(/^, |, $/,""); }
  function meses(a,b){
    if(!a||!b) return 12;
    var A=new Date(a), B=new Date(b);
    if(isNaN(A.getTime())||isNaN(B.getTime())) return 12;
    var m = (B.getFullYear()-A.getFullYear())*12 + (B.getMonth()-A.getMonth()) + 1;
    return Math.max(1, m);
  }
  var nMeses = meses(desde, hasta);

  /* Coste de cada persona a la fecha de inicio del rango */
  function costes(){
    return d.personas.map(function(p){
      var N = nominaCompleta(d, p, {});
      var incAbierta = (d.incidencias||[]).filter(function(x){
        return x.personaId===p.id && (x.abierta || (x.desde && x.desde<=hasta && (!x.hasta || x.hasta>=desde)));
      })[0] || null;
      var incSust = (d.incidencias||[]).filter(function(x){ return x.sustitutoId===p.id && x.aplicada; })[0] || null;
      var esSustituto = !!incSust;
      var sustCentro = incSust ? ((incSust.quienPaga||"pd")==="centro") : false;
      var hc = horasContrato(p, desde);
      var activo = hc !== null && hc > 0;
      return {p:p, N:N, activo:activo, horas:hc, inc:incAbierta, esSustituto:esSustituto, sustCentro:sustCentro};
    });
  }
  var L = costes();
  var conCat = L.filter(function(x){ return x.N; });
  var activos = conCat.filter(function(x){ return x.activo; });
  var sinCat = d.personas.length - conCat.length;

  var TT = {bruto:0, pd:0, ajuste:0, sust:0};
  activos.forEach(function(x){
    TT.bruto += x.N.brutaTotal * nMeses;
    TT.pd    += x.N.pd * nMeses;
    TT.ajuste += x.N.costeCentro * nMeses;
    if(x.esSustituto && x.sustCentro){ TT.sust += x.N.brutaTotal * nMeses; TT.ajuste += (x.N.brutaTotal - x.N.costeCentro) * nMeses; }
    else if(x.esSustituto){ TT.sust += x.N.costeCentro * nMeses; }
  });

  /* Imputación por tramos: reparte el coste de cada persona entre sus categorías / fuentes */
  function imputar(clave){
    var acc = {};
    conCat.forEach(function(x){
      var ts = d.tramos.filter(function(t){ return t.personaId===x.p.id; });
      var tot = ts.reduce(function(a,t){ return a+num(t.porcentaje); }, 0);
      if(tot <= 0) return;
      ts.forEach(function(t){
        var k = (clave==="fuente") ? (t.fuenteId||"(sin fuente)") : t.categoriaId;
        var frac = num(t.porcentaje)/tot;
        if(!acc[k]) acc[k] = {k:k, bruto:0, pd:0, centro:0, personas:[]};
        acc[k].bruto  += x.N.brutaTotal * frac * nMeses;
        acc[k].pd     += x.N.pd * frac * nMeses;
        acc[k].centro += x.N.costeCentro * frac * nMeses;
        acc[k].personas.push({p:x.p, pct:num(t.porcentaje), frac:frac,
          bruto:x.N.brutaTotal*frac*nMeses, centro:x.N.costeCentro*frac*nMeses, cat:x.N.cat.nombre});
      });
    });
    return Object.keys(acc).map(function(k){ return acc[k]; }).sort(function(a,b){ return b.bruto-a.bruto; });
  }
  function nomCat(id){ var c=d.categorias.filter(function(x){ return x.id===id; })[0]; return c?nombreDe(c):"(sin categoría)"; }
  function nomFue(id){ var f=d.fuentes.filter(function(x){ return x.id===id; })[0]; return f?nombreDe(f):"(sin fuente)"; }

  var nVersiones = (d.versiones||[]).length;
  var avisoHist = nVersiones===0 ? "Sin versiones guardadas: el periodo pasado se proyecta con los datos de HOY, no es un dato objetivo." : null;

  var barra = (
    <div className="no-print" style={{marginBottom:14, padding:"10px 12px", background:C.superficie, border:"1px solid "+C.borde, borderRadius:10}}>
      <div style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"center", marginBottom:10}}>
        <Segmented options={[{id:"curso", label:"Año académico"}, {id:"natural", label:"Año natural"}, {id:"libre", label:"A medida"}]}
          value={tipoPer} onChange={function(v){ aplicarPeriodo(v, anioPer); }} />
        {tipoPer!=="libre" ? (
          <select style={Object.assign({}, S.input, {width:150})} value={anioPer} onChange={function(e){ aplicarPeriodo(tipoPer, parseInt(e.target.value,10)); }}>
            {anios.map(function(a2){ return <option key={a2} value={a2}>{tipoPer==="curso" ? (a2+"-"+(a2+1)) : a2}</option>; })}
          </select>
        ) : null}
        <div style={{fontSize:J, color:C.secundario}}>
          {tipoPer==="curso" ? "1 sep → 31 ago · para proyectos y Consejo Escolar" : (tipoPer==="natural" ? "1 ene → 31 dic · para contabilidad" : "Rango libre")}
        </div>
      </div>
      <div style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"flex-end"}}>
        <div style={{width:150}}><label style={Object.assign({}, S.label,{marginBottom:2})}>Desde</label><input type="date" style={S.input} value={desde} onChange={function(e){ setDesde(e.target.value); setTipoPer("libre"); }} /></div>
        <div style={{width:150}}><label style={Object.assign({}, S.label,{marginBottom:2})}>Hasta</label><input type="date" style={S.input} value={hasta} onChange={function(e){ setHasta(e.target.value); setTipoPer("libre"); }} /></div>
        <div style={{fontSize:J, color:C.secundario, paddingBottom:8}}><b style={{color:C.titulo}}>{nMeses}</b> mes(es)</div>
        <div style={{flex:1}} />
        <button style={S.btnPri} onClick={function(){ window.print(); }}>Imprimir / PDF</button>
      </div>
    </div>
  );

  return (
    <div>
      <div className="no-print" style={{marginBottom:14}}>
        <Segmented options={[{id:"plantilla",label:"Plantilla"},{id:"grupo",label:"Por grupo"},{id:"fuente",label:"Por proyecto"},{id:"presupuesto",label:"Presupuesto"},{id:"finiquito",label:"Finiquito"}]} value={tab} onChange={setTab} />
      </div>

      {tab!=="finiquito" ? barra : null}
      {(tab!=="finiquito" && sinCat>0) ? <div className="no-print" style={{fontSize:J, color:C.avisoText, marginBottom:10}}>⚠ {sinCat} persona(s) sin categoría de convenio: no entran en los importes. Ruta: Configuración → Personas → ficha → Convenio y antigüedad.</div> : null}
      {(tab!=="finiquito" && avisoHist) ? <div className="no-print" style={{fontSize:J, color:C.avisoText, marginBottom:10}}>⚠ {avisoHist}</div> : null}

      {tab==="plantilla" ? (
        <div>
          <h4 style={{fontSize:14, color:C.secundario, textTransform:"uppercase", letterSpacing:".04em", marginBottom:4}}>
            Plantilla y coste del periodo <InfoBtn info={INFO.plantilla} vigencia={"tablas de convenio y pago delegado " + d.convenio.anio} />
          </h4>
          <div style={{fontSize:13, color:C.azul, fontWeight:700, marginBottom:12}}>{etiquetaPer}</div>
          <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(180px,1fr))", gap:12, marginBottom:16}}>
            <div style={Object.assign({}, S.card, {padding:"12px 15px"})}>
              <div style={{fontSize:12, color:C.secundario, fontWeight:700}}>En activo</div>
              <div style={{fontSize:P, fontWeight:700, color:C.titulo, fontFamily:"'Source Serif 4',serif"}}>{activos.length}</div>
              <div style={{fontSize:I, color:C.secundario}}>{activos.filter(function(x){ return x.inc; }).length} con incidencia</div>
            </div>
            <div style={Object.assign({}, S.card, {padding:"12px 15px"})}>
              <div style={{fontSize:12, color:C.secundario, fontWeight:700}}>Gasto total del periodo</div>
              <div style={{fontSize:20, fontWeight:700, color:C.titulo, fontFamily:"'Source Serif 4',serif"}}>{r2(TT.bruto)} €</div>
            </div>
            <div style={Object.assign({}, S.card, {padding:"12px 15px"})}>
              <div style={{fontSize:12, color:C.secundario, fontWeight:700}}>Cubre pago delegado</div>
              <div style={{fontSize:20, fontWeight:700, color:C.okText, fontFamily:"'Source Serif 4',serif"}}>{r2(TT.pd)} €</div>
            </div>
            <div style={Object.assign({}, S.card, {padding:"12px 15px", borderColor:C.azul})}>
              <div style={{fontSize:12, color:C.azul, fontWeight:700}}>Ajuste del centro</div>
              <div style={{fontSize:20, fontWeight:700, color:C.azul, fontFamily:"'Source Serif 4',serif"}}>{r2(TT.ajuste)} €</div>
              <div style={{fontSize:I, color:C.secundario}}>de ello, sustituciones: {r2(TT.sust)} €</div>
            </div>
            {(function(){
              var conc = ingresosGV(d).tot.caja * (nMeses/12);
              var margen = conc - TT.ajuste;
              var alerta = margen < 0;
              return (
                <div style={Object.assign({}, S.card, {padding:"12px 15px", borderColor: alerta?C.peligro:C.ok})}>
                  <div style={{fontSize:12, color: alerta?C.peligro:C.ok, fontWeight:700}}>{alerta?"⚠ Ajuste vs concierto":"Concierto − ajuste"}</div>
                  <div style={{fontSize:20, fontWeight:700, color: alerta?C.peligro:C.ok, fontFamily:"'Source Serif 4',serif"}}>{margen<0?"−":""}{r2(Math.abs(margen))} €</div>
                  <div style={{fontSize:I, color:C.secundario}}>{alerta?"el ajuste supera el concierto":"margen sobre el concierto ("+r2(conc)+" €)"}</div>
                </div>
              );
            })()}
          </div>
          <div className="print-area">
            <div className="ficha" style={Object.assign({}, S.card, {padding:0, overflow:"hidden"})}>
              <div className="tabla-scroll"><table style={{fontSize:12}}>
                <thead><tr><th>Persona</th><th>Categoría convenio</th><th className="num">Horas</th><th>Estado</th><th className="num">Bruto periodo</th><th className="num">Cubre PD</th><th className="num">Ajuste centro</th></tr></thead>
                <tbody>
                  {activos.map(function(x){ return (
                    <tr key={x.p.id}>
                      <td style={{fontWeight:600, color:C.titulo}}>{nomP(x.p)}</td>
                      <td style={{color:C.secundario}}>{x.N.cat.nombre}</td>
                      <td className="num">{r2(x.horas)}</td>
                      <td style={{fontSize:I}}>
                        {x.inc ? <span style={{color:C.avisoText, fontWeight:600}}>{x.inc.tipo}{x.inc.sustitutoId?(" · le sustituye "+nomPersona(d, x.inc.sustitutoId)):""}</span>
                               : (x.esSustituto ? <span style={{color:CALM, fontWeight:600}}>sustituto/a</span> : <span style={{color:C.okText}}>activo</span>)}
                      </td>
                      <td className="num">{r2(x.N.brutaTotal*nMeses)}</td>
                      <td className="num" style={{color:C.okText}}>{x.N.esPD?r2(x.N.pd*nMeses):"—"}</td>
                      <td className="num" style={{fontWeight:700, color:C.azul}}>{r2(x.N.costeCentro*nMeses)}</td>
                    </tr>
                  ); })}
                  <tr style={{borderTop:"2px solid "+C.borde}}>
                    <td colSpan="4" style={{fontWeight:700, color:C.titulo}}>TOTAL ({activos.length})</td>
                    <td className="num" style={{fontWeight:700}}>{r2(TT.bruto)}</td>
                    <td className="num" style={{fontWeight:700, color:C.okText}}>{r2(TT.pd)}</td>
                    <td className="num" style={{fontWeight:700, color:C.azul}}>{r2(TT.ajuste)}</td>
                  </tr>
                </tbody>
              </table></div>
            </div>
          </div>
        </div>
      ) : null}

      {(tab==="grupo" || tab==="fuente") ? (function(){
        var esF = tab==="fuente";
        var filas = imputar(esF ? "fuente" : "cat");
        var nom = esF ? nomFue : nomCat;
        var Tb=0, Tp=0, Tc=0;
        filas.forEach(function(f){ Tb+=f.bruto; Tp+=f.pd; Tc+=f.centro; });
        function expo(){
          var aoa=[[esF?"Proyecto / fuente":"Categoría","Personas","Bruto periodo","Cubre PD","Coste centro"]];
          filas.forEach(function(f){ aoa.push([nom(f.k), f.personas.length, r2(f.bruto), r2(f.pd), r2(f.centro)]); });
          aoa.push(["TOTAL","",r2(Tb),r2(Tp),r2(Tc)]);
          var nomi=[["Persona","Categoría convenio",esF?"Fuente":"Categoría","% jornada","Bruto imputado","Coste centro"]];
          filas.forEach(function(f){ f.personas.forEach(function(pp){ nomi.push([ (pp.p.apellidos+", "+pp.p.nombre), pp.cat, nom(f.k), r2(pp.pct), r2(pp.bruto), r2(pp.centro)]); }); });
          descargarTabla((esF?"coste_proyecto_":"coste_grupo_")+d.curso, [{nombre:"Resumen", aoa:aoa},{nombre:"Nominal", aoa:nomi}]);
        }
        return (
          <div>
            <h4 style={{fontSize:14, color:C.secundario, textTransform:"uppercase", letterSpacing:".04em", marginBottom:4}}>
              {esF ? "Coste por proyecto / fuente" : "Coste por grupo o categoría"} <InfoBtn info={esF?INFO.porFuente:INFO.porGrupo} vigencia={"tablas de convenio " + d.convenio.anio} />
            </h4>
            <div style={{fontSize:13, color:C.azul, fontWeight:700, marginBottom:12}}>{etiquetaPer}</div>
            <div className="no-print" style={{marginBottom:12}}><button style={S.btn} onClick={expo}>Descargar Excel (resumen + nominal)</button></div>
            <div className="print-area">
              <div className="ficha" style={Object.assign({}, S.card, {padding:0, overflow:"hidden", marginBottom:16})}>
                <div className="tabla-scroll"><table>
                  <thead><tr><th>{esF?"Proyecto / fuente":"Categoría"}</th><th className="num">Personas</th><th className="num">Bruto periodo</th><th className="num">Cubre PD</th><th className="num">Coste centro</th>{esF ? <th className="num">Subvención</th> : null}{esF ? <th className="num">Diferencia</th> : null}</tr></thead>
                  <tbody>
                    {filas.map(function(f){
                      var sv = esF ? (d.subvenciones||[]).filter(function(x){ return x.fuenteId===f.k; }) : [];
                      var ing = sv.reduce(function(a2,x){ var pv=num(x.previsto), cf=num(x.confirmado); return a2 + (((x.estado==="confirmada")&&cf>0)?cf:pv); }, 0) * (nMeses/12);
                      var dif2 = ing - f.centro;
                      return (
                      <tr key={f.k}>
                        <td style={{fontWeight:600, color:C.titulo}}>{nom(f.k)}</td>
                        <td className="num">{f.personas.length}</td>
                        <td className="num">{r2(f.bruto)}</td>
                        <td className="num" style={{color:C.okText}}>{r2(f.pd)}</td>
                        <td className="num" style={{fontWeight:700, color:C.azul}}>{r2(f.centro)}</td>
                        {esF ? <td className="num" style={{color: ing>0?C.ok:C.secundario}}>{ing>0?r2(ing):"—"}</td> : null}
                        {esF ? <td className="num" style={{fontWeight:700, color: ing<=0?C.secundario:(dif2>=0?C.ok:C.aviso)}}>{ing>0?((dif2>=0?"+":"")+r2(dif2)):"—"}</td> : null}
                      </tr>
                    ); })}
                    <tr style={{borderTop:"2px solid "+C.borde}}>
                      <td style={{fontWeight:700, color:C.titulo}}>TOTAL</td><td></td>
                      <td className="num" style={{fontWeight:700}}>{r2(Tb)}</td>
                      <td className="num" style={{fontWeight:700, color:C.okText}}>{r2(Tp)}</td>
                      <td className="num" style={{fontWeight:700, color:C.azul}}>{r2(Tc)}</td>
                      {esF ? <td className="num" style={{fontWeight:700, color:C.okText}}>{r2(subvTotales(d).cuenta*(nMeses/12))}</td> : null}
                      {esF ? <td></td> : null}
                    </tr>
                  </tbody>
                </table></div>
              </div>
              {filas.map(function(f){ return (
                <div key={f.k} className="ficha" style={Object.assign({}, S.card, {padding:"14px 16px", marginBottom:12})}>
                  <div style={{fontWeight:700, color:C.titulo, fontSize:14, marginBottom:6}}>{nom(f.k)} <span style={{fontWeight:400, color:C.secundario, fontSize:J}}>· {r2(f.bruto)} € en el periodo</span></div>
                  <div className="tabla-scroll"><table style={{fontSize:12}}>
                    <thead><tr><th>Persona</th><th>Categoría convenio</th><th className="num">% jornada</th><th className="num">Bruto imputado</th><th className="num">Coste centro</th></tr></thead>
                    <tbody>
                      {f.personas.map(function(pp, i){ return (
                        <tr key={i}>
                          <td style={{fontWeight:600}}>{nomP(pp.p)}</td>
                          <td style={{color:C.secundario}}>{pp.cat}</td>
                          <td className="num">{r2(pp.pct)}%</td>
                          <td className="num">{r2(pp.bruto)}</td>
                          <td className="num" style={{fontWeight:700, color:C.azul}}>{r2(pp.centro)}</td>
                        </tr>
                      ); })}
                    </tbody>
                  </table></div>
                </div>
              ); })}
            </div>
          </div>
        );
      })() : null}

      {tab==="presupuesto" ? (function(){
        var G = ingresosGV(d);
        var ST2 = subvTotales(d);
        var ingPD = G.tot.pd * (nMeses/12);
        var ingCaja = G.tot.caja * (nMeses/12);
        var ingSub = ST2.cuenta * (nMeses/12);
        var gasto = TT.bruto;
        var dif = (ingPD + ingCaja + ingSub) - gasto;
        function f(label, val, opts){
          var o=opts||{};
          return (
            <tr style={o.top?{borderTop:"2px solid "+C.borde}:null}>
              <td style={{color:o.fuerte?C.titulo:C.secundario, fontWeight:o.fuerte?700:500, fontSize:K}}>{label}</td>
              <td className="num" style={{fontWeight:o.fuerte?700:600, color:o.color||C.titulo, fontSize:o.fuerte?15:13.5, whiteSpace:"nowrap"}}>{val<0?"−":""}{r2(Math.abs(val))} €</td>
            </tr>
          );
        }
        return (
          <div>
            <h4 style={{fontSize:14, color:C.secundario, textTransform:"uppercase", letterSpacing:".04em", marginBottom:4}}>
              Presupuesto de personal <InfoBtn info={INFO.costeCentro} vigencia={"convenio " + d.convenio.anio + " · módulos " + d.modulos.anio} />
            </h4>
            <div style={{fontSize:13, color:C.azul, fontWeight:700, marginBottom:12}}>{etiquetaPer}</div>
            <div className="print-area">
              <div className="ficha" style={Object.assign({}, S.card, {padding:"20px 22px", maxWidth:600})}>
                <CabeceraPapel titulo={"Presupuesto de personal · " + etiquetaPer} curso={d.curso} />
                <div className="tabla-scroll"><table>
                  <tbody>
                    {f("Gasto de personal (bruto)", gasto)}
                    {f("+ SS a cargo del centro (estimada)", TT.ajuste - (TT.bruto - TT.pd) > 0 ? (TT.ajuste - (TT.bruto - TT.pd)) : 0)}
                    {f("GASTO TOTAL", gasto, {fuerte:true, top:true})}
                    {f("Ingreso · pago delegado", ingPD, {color:C.okText})}
                    {f("Ingreso · concierto (a caja)", ingCaja, {color:C.okText})}
                    {f("Ingreso · subvenciones (" + (ST2.confirmado>0?"parte confirmada":"previstas") + ")", ingSub, {color:C.okText})}
                    {f("INGRESO TOTAL", ingPD+ingCaja+ingSub, {fuerte:true, top:true, color:C.okText})}
                    {f(dif>=0 ? "SUPERÁVIT" : "LO QUE PONE EL CENTRO", dif, {fuerte:true, top:true, color: dif>=0 ? C.ok : C.aviso})}
                    {ST2.riesgo>0 ? f("(riesgo: subvención concedida por debajo de lo previsto)", ST2.riesgo*(nMeses/12), {color:C.avisoText}) : null}
                  </tbody>
                </table></div>
                <div style={{marginTop:16, paddingTop:14, borderTop:"1px solid "+C.borde}}>
                  <div style={{fontSize:12, fontWeight:700, color:C.secundario, textTransform:"uppercase", letterSpacing:".04em", marginBottom:8}}>Control: ajuste frente al concierto</div>
                  {(function(){
                    var ajuste = TT.ajuste;
                    var concierto = ingCaja;
                    var margen = concierto - ajuste;
                    var alerta = margen < 0;
                    return (
                      <div style={{padding:"11px 14px", background: alerta?C.peligroBg:C.okBg, border:"1px solid "+(alerta?C.peligro:C.ok), borderRadius:8}}>
                        <div style={{display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:3}}><span style={{color:C.secundario}}>Ajuste que pone el centro (personal)</span><b style={{color:C.titulo}}>{r2(ajuste)} €</b></div>
                        <div style={{display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:3}}><span style={{color:C.secundario}}>Concierto que entra a caja</span><b style={{color:C.titulo}}>{r2(concierto)} €</b></div>
                        <div style={{display:"flex", justifyContent:"space-between", fontSize:K, fontWeight:700, paddingTop:5, borderTop:"1px solid "+(alerta?C.peligroBgBorde:C.okBgBorde)}}>
                          <span style={{color: alerta?C.peligro:C.ok}}>{alerta?"⚠ El ajuste supera el concierto":"Margen disponible"}</span>
                          <span style={{color: alerta?C.peligro:C.ok}}>{margen<0?"−":""}{r2(Math.abs(margen))} €</span>
                        </div>
                      </div>
                    );
                  })()}
                  <p style={{fontSize:11, color:C.secundario, marginTop:8}}>El ajuste de personal no debería superar el dinero de concierto que entra a caja; si lo hace, esa parte sale de otros ingresos o genera déficit.</p>

            </div>
          </div>
        );
      })() : null}

      {tab==="finiquito" ? <FiniquitoTab data={d} setData={props.setData} toast={props.toast} /> : null}

function FiniquitoTab(props){
  var d = props.data;
  var [pid, setPid] = useState("");
  var [fecha, setFecha] = useState(hoyISO());
  var [supuesto, setSupuesto] = useState("fin");
  var [vacDias, setVacDias] = useState(0);
  var SUP = [
    {id:"fin", nombre:"Fin de contrato temporal", dias:12},
    {id:"objetivo", nombre:"Despido objetivo", dias:20},
    {id:"improcedente", nombre:"Despido improcedente", dias:33},
    {id:"voluntaria", nombre:"Baja voluntaria", dias:0}
  ];
  function nomP(p){ return (p.apellidos+", "+p.nombre).replace(/^, |, $/,""); }
  var personas = d.personas.slice().sort(cmpPersona);
  var p = d.personas.filter(function(x){ return x.id===pid; })[0] || null;
  var N = p ? nominaCompleta(d, p, {}) : null;
  var sup = SUP.filter(function(x){ return x.id===supuesto; })[0] || SUP[0];

  var R = null;
  if(N && fecha){
    var mensual = N.brutaTotal;
    var diario = mensual/30;
    var dd = parseInt(fecha.slice(8,10), 10) || 0;
    var diasMes = mensual/30*dd;
    /* paga semestral: días desde la última (1 ene o 1 jul) × sueldo mensual / 180 */
    var mes = parseInt(fecha.slice(5,7), 10);
    var ini = (mes<=6) ? (fecha.slice(0,4)+"-01-01") : (fecha.slice(0,4)+"-07-01");
    var dias = Math.max(0, Math.round((new Date(fecha) - new Date(ini))/(1000*60*60*24)));
    var pagaExtra = dias * mensual / 180;
    var vacaciones = diario * num(vacDias);
    var finiquito = diasMes + pagaExtra + vacaciones;
    /* antigüedad en años */
    var ant = (p.fechaAntiguedad || p.fechaInicio) || "";
    var anios = 0;
    if(ant){ var A=new Date(ant), B=new Date(fecha); if(!isNaN(A.getTime())&&!isNaN(B.getTime())) anios = Math.max(0, (B-A)/(1000*60*60*24*365.25)); }
    var indem = diario * num(sup.dias) * anios;
    R = {mensual:mensual, diario:diario, dd:dd, diasMes:diasMes, dias:dias, pagaExtra:pagaExtra, vacaciones:vacaciones,
      finiquito:finiquito, anios:anios, indem:indem, total:finiquito+indem};
  }
  function f(label, val, opts){
    var o=opts||{};
    return (
      <tr style={o.top?{borderTop:"2px solid "+C.borde}:null}>
        <td style={{color:o.fuerte?C.titulo:C.secundario, fontWeight:o.fuerte?700:500, fontSize:13}}>{label}</td>
        <td className="num" style={{fontWeight:o.fuerte?700:600, color:o.color||C.titulo, fontSize:o.fuerte?14:13, whiteSpace:"nowrap"}}>{r2(val)} €</td>
      </tr>
    );
  }
  return (
    <div>
      <h4 style={{fontSize:14, color:C.secundario, textTransform:"uppercase", letterSpacing:".04em", marginBottom:10}}>
        Finiquito e indemnización <InfoBtn info={INFO.finiquito} vigencia={"tablas de convenio " + d.convenio.anio} />
      </h4>
      <div className="no-print" style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"flex-end", marginBottom:16}}>
        <div style={{flex:"1 1 240px", maxWidth:300}}>
          <label style={S.label}>Persona</label>
          <select style={S.input} value={pid} onChange={function(e){ setPid(e.target.value); }}>
            <option value="">— elegir —</option>
            {personas.map(function(x){ return <option key={x.id} value={x.id}>{nomP(x)}</option>; })}
          </select>
        </div>
        <div style={{width:150}}><label style={S.label}>Fecha de baja</label><input type="date" style={S.input} value={fecha} onChange={function(e){ setFecha(e.target.value); }} /></div>
        <div style={{flex:"1 1 220px", maxWidth:260}}>
          <label style={S.label}>Supuesto</label>
          <select style={S.input} value={supuesto} onChange={function(e){ setSupuesto(e.target.value); }}>
            {SUP.map(function(x){ return <option key={x.id} value={x.id}>{x.nombre} ({x.dias} días/año)</option>; })}
          </select>
        </div>
        <div style={{width:130}}><label style={S.label}>Vacaciones (días)</label><NumInput value={vacDias} style={S.input} onCommit={function(v){ setVacDias(num(v)); }} /></div>
        {R ? <button style={S.btnPri} onClick={function(){ window.print(); }}>Imprimir / PDF</button> : null}
      </div>

      {!p ? <div style={Object.assign({}, S.card, {padding:24, color:C.secundario})}>Elige una persona.</div>
       : !N ? <div style={Object.assign({}, S.card, {padding:24, color:C.avisoText})}><b>{nomP(p)}</b> no tiene categoría de convenio. Ruta: Configuración → Personas → ficha → Convenio y antigüedad.</div>
       : (
        <div className="print-area">
          <div className="ficha" style={Object.assign({}, S.card, {padding:"20px 22px", maxWidth:620})}>
            <CabeceraPapel titulo={"Finiquito · " + nomP(p)} sigla={siglaDe(p)} sigcolor={colorCatLab(d, p)} curso={d.curso} />
            <div style={{background:C.avisoBg, border:"1px solid "+C.aviso, borderRadius:8, padding:"9px 12px", marginBottom:14, fontSize:12, color:C.avisoText}}>
              <b>Borrador orientativo.</b> La calificación del despido (y por tanto la indemnización) la decide tu asesoría, no este aplicativo. Valídalo antes de comunicar nada.
            </div>
            <div style={{fontSize:J, color:C.secundario, marginBottom:12, lineHeight:1.7}}>
              <b style={{color:C.titulo}}>{N.cat.nombre}</b> · baja el <b style={{color:C.titulo}}>{fecha}</b> · bruto mensual <b style={{color:C.titulo}}>{r2(R.mensual)} €</b> · antigüedad <b style={{color:C.titulo}}>{r2(R.anios)}</b> año(s)
            </div>
            <div className="tabla-scroll"><table>
              <tbody>
                {f("Días trabajados del mes (" + R.dd + " días)", R.diasMes)}
                {f("Paga extra prorrateada (" + R.dias + " días ÷ 180)", R.pagaExtra)}
                {f("Vacaciones no disfrutadas (" + r2(vacDias) + " días · a cargo del centro)", R.vacaciones)}
                {f("FINIQUITO", R.finiquito, {fuerte:true, top:true, color:C.titulo})}
                {f("Indemnización · " + sup.nombre + " (" + sup.dias + " días/año × " + r2(R.anios) + " años)", R.indem, {color:C.avisoText})}
                {f("TOTAL A PERCIBIR", R.total, {fuerte:true, top:true, color:C.azul})}
              </tbody>
            </table></div>
            <p style={{fontSize:11, color:C.secundario, marginTop:12}}>Las vacaciones las asume el centro: el pago delegado abona agosto como un mes más, no en proporción al tiempo trabajado (circular de funcionamiento del pago delegado, apartado de liquidación).</p>
            {R.premioLiq>0 ? <p style={{fontSize:11, color:C.okText, marginTop:6}}>Cumple los requisitos del premio de continuidad (art. 72) y no consta cobrado: se incluye en la liquidación de cese.</p> : (R.premio && !R.premio.derecho && !R.premio.sinDatos ? <p style={{fontSize:11, color:C.secundario, marginTop:6}}>No cumple aún el premio de continuidad{R.premio.faltaEdad>0?(" · le faltan "+r2(R.premio.faltaEdad)+" años de edad"):""}{R.premio.faltaServicio>0?(" · le faltan "+r2(R.premio.faltaServicio)+" años de servicio"):""}.</p> : (R.premio && R.premio.sinDatos ? <p style={{fontSize:11, color:C.avisoText, marginTop:6}}>Sin fecha de nacimiento no puedo comprobar el premio de continuidad. Añádela en la ficha.</p> : null))}
          </div>
        </div>
      )}
    </div>
  );
}

/* Exporta el RPT a Excel (una hoja, agrupado por etapas) */
function exportarRPTExcel(d, grupos){
  try{
    var filas=[];
    filas.push(["RELACIÓN DE PUESTOS DE TRABAJO — "+(d.cursoNombre||d.curso||"")]);
    filas.push([]);
    grupos.forEach(function(g){
      if(!g.filas.length) return;
      filas.push([g.etapa.nombre]);
      filas.push([" ","SITUACIÓN ACTUAL","","","","","","","EVOLUCIÓN PRÓXIMOS DOS CURSOS","","","","",""]);
      filas.push(["#","Materia","Curso","% Jornada","Titulación","Trabajador/a","Perfil lingüístico","","Materia","Curso","% Jornada","Titulación deseada","Perfil objetivo","Conocimientos / metodologías"]);
      g.filas.forEach(function(f, i){
        var ev = rptExtraDe(d, f.persona.id);
        filas.push([i+1, f.materia, f.curso, f.pct, f.titulacion, (f.persona.apellidos+", "+f.persona.nombre).replace(/^, |, $/,""), f.perfil, "", ev.evMateria||"", ev.evCurso||"", ev.evPct||"", ev.evTitulacion||"", ev.evPerfil||"", ev.evConocimientos||""]);
      });
      filas.push([]);
    });
    if(typeof XLSX!=="undefined"){
      var ws=XLSX.utils.aoa_to_sheet(filas);
      var wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "RPT");
      XLSX.writeFile(wb, "RPT_"+(d.cursoNombre||d.curso||"curso")+".xlsx");
    } else {
      /* respaldo CSV si la librería no cargó */
      var csv=filas.map(function(r){ return r.map(function(c){ return '"'+String(c==null?"":c).replace(/"/g,'""')+'"'; }).join(","); }).join("\n");
      var blob=new Blob([csv],{type:"text/csv"});
      var url=URL.createObjectURL(blob); var a=document.createElement("a");
      a.href=url; a.download="RPT_"+(d.cursoNombre||d.curso||"curso")+".csv";
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }
  }catch(e){ alert("No se pudo exportar el RPT"); }
}

      {sub==="conceptos" ? (

            <div style={{fontSize:13, color:C.texto, lineHeight:1.65}}>Las ideas que hacen falta para entender el aplicativo. Están agrupadas: primero cómo funciona por dentro, luego las formas de guardar, después el vocabulario informático, y al final los conceptos del negocio (convenio, financiación…). Pulsa cada título.</div>
          </div>

          <Plegable titulo="Cómo funciona la aplicación por dentro" icono="🧠" abierta={true}>
            <p style={{fontSize:13, color:C.texto, lineHeight:1.65, marginBottom:10}}>Entender esto de una vez ahorra muchas dudas después.</p>
            <Instr opcion="Es una web que funciona en tu navegador">Todo el cálculo ocurre en tu propio ordenador, dentro del navegador. No hay una empresa detrás guardando tus datos ni haciendo cuentas. Por eso funciona sin internet (en modo archivo) y por eso tus datos no salen de tu equipo salvo que tú los exportes.</Instr>
            <Instr opcion="Los datos viven en la memoria del navegador">Cada vez que tocas algo, la aplicación lo apunta en un pequeño almacén que el navegador reserva para esta web (se llama almacenamiento local). Ese almacén está atado a <b>ese</b> navegador y <b>ese</b> ordenador: si abres la web en otro equipo, no verás esos datos hasta que importes tu archivo.</Instr>
            <Instr opcion="Por eso hay que hacer copias">Como los datos viven en el navegador, si alguien borra el historial del navegador, formatea el ordenador o cambia de equipo, esos datos se van con él. La copia de seguridad (tu archivo exportado) es lo que sobrevive a todo eso. No es un extra: es la red de seguridad principal.</Instr>
            <Instr opcion="Qué NO hace la aplicación">No envía nada por internet, no comparte datos, no se actualiza sola. Si sale una versión nueva del programa, hay que abrirla e importar tus datos encima; los datos no se pierden porque están en tu archivo.</Instr>
          </Plegable>

          <Plegable titulo="Las tres formas de guardar (y cuándo usar cada una)" icono="💾">
            <p style={{fontSize:13, color:C.texto, lineHeight:1.65, marginBottom:12}}>Hay tres cosas que suenan parecido pero sirven para cosas distintas. Esta es la confusión más habitual, así que vamos con calma y con ejemplos.</p>

            <Instr opcion="0. El guardado automático (no haces nada)">Cada cambio que haces —un contrato, un ratio, una hora del reparto— se guarda <b>solo</b>, al instante, en el navegador. No hay botón de "guardar" para el trabajo del día a día, y no existe "salir sin guardar". <b>Respuesta a la duda típica:</b> no, no tienes que guardar cada cambio de contrato o de ratio a mano; ya se guarda. Este guardado vive solo en tu navegador.</Instr>

            <Instr opcion="1. Copia de seguridad — tu red de seguridad">Es exportar <b>todo</b> a un archivo que se descarga a tu ordenador. Sirve para no perder el trabajo si el navegador se borra, para llevarlo a otro equipo, o para pasárselo a otra persona. <b>Cuándo:</b> al terminar una sesión de trabajo importante, antes de tocar algo gordo, y como norma de higiene una vez por semana o al mes. <b>Ejemplo:</b> has pasado la tarde ajustando la plantilla → al acabar, exporta una copia. Si mañana el navegador falla, la recuperas.</Instr>

            <Instr opcion="2. Guardar versión — una foto fechada para el futuro">Es una "foto" del estado actual que se queda <b>dentro</b> del aplicativo, con su fecha. No se descarga. Sirve para poder mirar en el futuro cómo estaba todo en un momento dado. <b>Cuándo:</b> cuando cierras un cambio importante que quizá tengas que justificar o comparar después. <b>Ejemplo:</b> presentas un proyecto con una plantilla concreta → guarda una versión "solicitud proyecto X". Dentro de un año, si te piden justificar cómo estaba la plantilla entonces, la tienes. Sin la foto, solo podrías estimarlo, no probarlo.</Instr>

            <Instr opcion="3. Cerrar curso — archivar un año entero">Es archivar un curso académico completo como histórico y empezar el siguiente. No es "guardar", es cambiar de etapa. El curso cerrado queda intacto y de solo lectura; el nuevo arranca copiando la plantilla. <b>Cuándo:</b> una o dos veces al año, al terminar la planificación de un curso. <b>Ejemplo:</b> acabas de cuadrar 2026-2027 y empiezas a preparar 2027-2028 → cierras el 26-27 (te pide una copia de seguridad antes) y abres el 27-28. El 26-27 se conserva entero por si lo necesitas.</Instr>

            <div style={{background:C.okBg, border:"1px solid "+C.okBgBorde, borderRadius:8, padding:"10px 14px", fontSize:J, color:C.texto, marginTop:4}}>
              <b>En una frase:</b> la <b>copia de seguridad</b> te protege de perder datos · la <b>versión</b> te deja mirar el pasado dentro del aplicativo · <b>cerrar curso</b> archiva un año y empieza otro. El día a día se guarda solo.
            </div>
          </Plegable>

          <Plegable titulo="Vocabulario informático (sin tecnicismos)" icono="📖">
            <p style={{fontSize:13, color:C.texto, lineHeight:1.65, marginBottom:12}}>Palabras que aparecen por el aplicativo, explicadas en cristiano.</p>
            <Instr opcion="Navegador">El programa con el que entras a internet: Chrome, Edge, Firefox, Safari. Esta aplicación funciona dentro de él.</Instr>
            <Instr opcion="Archivo HTML (el programa)">Es el archivo que contiene la aplicación en sí, el "motor". Termina en <code>.html</code>. Al abrirlo, el navegador lo convierte en la pantalla que ves. No contiene tus datos, solo el programa.</Instr>
            <Instr opcion="Archivo JSON (tus datos)">Es el archivo donde está tu información real: personas, categorías, importes. Termina en <code>.json</code>. Es como una hoja de datos que el programa lee y escribe. Cuando haces una copia de seguridad, se genera uno de estos. Es lo que hay que guardar bien.</Instr>
            <Instr opcion="Importar / Exportar">Exportar = sacar tus datos a un archivo (.json) que se descarga. Importar = meter ese archivo de vuelta en la aplicación. Es la forma de mover tus datos entre ordenadores o de recuperarlos.</Instr>
            <Instr opcion="Almacenamiento local (o caché del navegador)">El pequeño espacio que el navegador reserva para guardar los datos de esta web en tu ordenador. Es donde va el guardado automático. Si "borras los datos de navegación", esto también se borra.</Instr>
            <Instr opcion="Servidor">Un ordenador de internet que guarda una web para que otros la abran. En el modo web, el programa está en un servidor (por ejemplo GitHub); tú entras con el navegador.</Instr>
            <Instr opcion="GitHub / GitHub Pages">Un sitio de internet, gratuito, que puede alojar una web sencilla como esta. "Pages" es su función de publicar páginas. Es una opción para tener el aplicativo en línea, pero podría ser cualquier otro servidor del centro.</Instr>
            <Instr opcion="Repositorio público / privado">En GitHub, un repositorio es la carpeta donde vive el proyecto. Público = cualquiera lo ve. Privado = solo quien tú autorices. <b>Importante:</b> si el aplicativo lleva datos personales (DNIs), el sitio donde se aloje no debe ser público.</Instr>
            <Instr opcion="PDF / Excel">Formatos de archivo para los informes. PDF = para imprimir o enviar tal cual (no se edita). Excel = una hoja de cálculo que sí puedes manipular. Los informes se pueden sacar en los dos.</Instr>
            <Instr opcion="Sesión">El rato que tienes la aplicación abierta sin cerrar la pestaña. El deshacer/rehacer funciona dentro de una sesión; al cerrar, se reinicia (pero tus datos siguen guardados).</Instr>
          </Plegable>

          <Plegable titulo="El convenio y la jornada" icono="📋">
            <p style={{fontSize:13, color:C.texto, lineHeight:1.65, marginBottom:12}}>Estos conceptos son estables, pero <b>los números concretos cambian</b> con cada convenio. Por eso aquí explicamos la idea y te decimos dónde está el dato actualizado, en vez de poner cifras que caducan.</p>
            <Instr opcion="Horas de contrato ≠ horas lectivas">No son lo mismo. Las lectivas son las que se dan en el aula; el contrato cuenta las horas totales (lectivas + complementarias). Una persona a jornada completa tiene menos horas lectivas que horas de contrato. Las cifras exactas de cada etapa están en <R>Configuración → Tablas y parámetros → Tipos de jornada</R>, y hay que revisarlas cuando cambie el convenio o el acuerdo del centro.</Instr>
            <Instr opcion="Trabajo personal y complementarias">El convenio divide la jornada en lectivas y complementarias, y dentro de las complementarias reserva una parte a trabajo personal (preparación individual), y el resto a coordinación, reuniones y formación. El reparto exacto de esas horas está en las tablas del aplicativo, no aquí, porque puede cambiar.</Instr>
            <Instr opcion="Puestos sin horas lectivas">Algunos puestos (como EAE, o el personal no docente) no se miden en lectivas sino en jornada completa. Cuántas horas es su jornada, y cómo se computa, está definido en <R>Tipos de jornada</R> y se ajusta si cambia el convenio.</Instr>
            <Instr opcion="Dónde está el dato vivo">Regla general: si necesitas el número exacto de horas, sueldo, o porcentaje de una categoría, míralo en <R>Configuración → Tablas y parámetros</R>. Eso es lo que usa el aplicativo para calcular, y es lo que hay que mantener al día. La ayuda no repite esos números para no quedar desfasada.</Instr>
          </Plegable>

          <Plegable titulo="La financiación" icono="💶">
            <Instr opcion="Pago delegado vs. lo que cuesta al centro">El pago delegado lo abona el Gobierno Vasco directamente al personal; no pasa por la cuenta del centro, pero contablemente es gasto suyo (con su ingreso correlativo). El ajuste es la diferencia entre lo que cobra la persona por convenio y lo que cubre el pago delegado: eso lo pone el centro.</Instr>
            <Instr opcion="Módulos económicos">Cada categoría concertada tiene asignado un módulo (un importe por unidad) que publica el Gobierno Vasco cada año. El importe concreto de cada módulo está en <R>Economía → Ingresos GV</R> y se actualiza cuando sale la orden anual; no lo fijamos aquí porque cambia.</Instr>
            <Instr opcion="Módulos que ya vienen partidos">Algunos módulos (los de ciertos puestos de apoyo) vienen ya divididos en el documento oficial: una unidad concedida equivale a media persona. El aplicativo lo tiene en cuenta; no hay que volver a dividir. Si cambia la normativa, se revisa en las tablas.</Instr>
            <Instr opcion="Previsto vs. confirmado (subvenciones)">Mientras no se publica la orden, una subvención es una estimación (previsto). Cuando sale, pones el importe confirmado. Si conceden menos de lo previsto, la diferencia la asume el centro, y el aplicativo la marca como riesgo.</Instr>
            <Instr opcion="Quién paga cada sustitución">Depende del momento y del tipo de baja. Una baja puede estar cubierta por pago delegado, pero ciertos periodos posteriores los paga el centro. Por eso cada incidencia te deja elegir quién la financia, y cada cambio se registra por separado.</Instr>
          </Plegable>
        </div>
      ) : null}
    </div>
  );
}

function AsesoriaView(props){
  var d = props.data;
  var per = periodoCurso(d);
  var [desde, setDesde] = useState(per.desde);
  var [hasta, setHasta] = useState(per.hasta);
  function nomP(pid){ var pp=(d.personas||[]).filter(function(z){ return z.id===pid; })[0]; return pp?(pp.apellidos+", "+pp.nombre).replace(/^, |, $/,""):"—"; }
  function enRango(f){ if(!f) return false; return (!desde || f>=desde) && (!hasta || f<=hasta); }

  /* 1) Contratos nuevos: líneas de contrato cuya fecha de inicio cae en el rango */
  var contratosNuevos = [];
  (d.personas||[]).forEach(function(pp){
    (pp.contratos||[]).forEach(function(k){
      if(enRango(k.desde)){
        contratosNuevos.push({ persona:pp, k:k });
      }
    });
  });
  contratosNuevos.sort(function(a,b){ return String(a.k.desde).localeCompare(String(b.k.desde)); });

  /* 2) Incidencias cuyo inicio cae en el rango (o abiertas que solapan) */
  var incidencias = (d.incidencias||[]).filter(function(x){
    if(enRango(x.desde)) return true;
    /* abiertas o con fin: que solapen el rango */
    var ini=x.desde||"", fin=x.hasta||"";
    if(ini && ini<=hasta && (!fin || fin>=desde)) return true;
    return false;
  }).slice().sort(function(a,b){ return String(a.desde).localeCompare(String(b.desde)); });

  /* 3) Cambios registrados en el diario cuya fecha cae en el rango */
  function descCambio(c){
    var quien = c.personaId ? nomP(c.personaId) : (c.persona||"");
    var cat = c.categoria || "";
    var mov = (c.de!==undefined && c.a!==undefined) ? (r2(c.de)+" \u2192 "+r2(c.a)+(c.unidad==="horas"?" h":"%")) : "";
    var partes = [quien, cat, mov, c.motivo||""].filter(function(x){ return x && String(x).trim(); });
    return partes.join(" \u00b7 ");
  }
  var cambios = (d.cambios||[]).filter(function(c){
    var f=(c.fecha||"").slice(0,10);
    return enRango(f);
  }).slice().sort(function(a,b){ return String(b.fecha).localeCompare(String(a.fecha)); });

  function tipoContratoLabel(k){ return k.incidenciaId ? "Sustitución" : (k.tipo||"Contrato"); }

  function exportar(){
    var aoaC=[["Desde","Hasta","Persona","Tipo","Horas","Nota"]];
    contratosNuevos.forEach(function(r){ aoaC.push([r.k.desde||"", r.k.hasta||"", nomP(r.persona.id), tipoContratoLabel(r.k), num(r.k.horas), r.k.nota||""]); });
    var aoaI=[["Desde","Hasta","Persona","Tipo","Cantidad","Sustituye/sustituido por"]];
    incidencias.forEach(function(x){ aoaI.push([x.desde||"", x.abierta?"(abierta)":(x.hasta||""), nomP(x.personaId), x.tipo, (num(x.cantidad)>0?(r2(x.cantidad)+(x.unidad==="horas"?" h":"%")):""), x.sustitutoId?("le sustituye "+nomP(x.sustitutoId)):""]); });
    var aoaCa=[["Fecha","Descripción"]];
    cambios.forEach(function(c){ aoaCa.push([(c.fecha||"").slice(0,10), descCambio(c)]); });
    descargarTabla("asesoria_"+desde+"_a_"+hasta, [
      {nombre:"Contratos nuevos", aoa:aoaC},
      {nombre:"Incidencias", aoa:aoaI},
      {nombre:"Cambios", aoa:aoaCa}
    ]);
  }

  var ths = {textAlign:"left", padding:"7px 10px", fontSize:11, color:C.secundario, textTransform:"uppercase", letterSpacing:".03em", borderBottom:"2px solid "+C.borde, whiteSpace:"nowrap"};
  var tds = {padding:"7px 10px", fontSize:J, color:C.texto, borderBottom:"1px solid "+C.borde};

  return (
    <div style={{maxWidth:1100, margin:"0 auto", padding:"0 4px"}}>
      <div className="no-print" style={{display:"flex", gap:14, alignItems:"flex-end", flexWrap:"wrap", marginBottom:16}}>
        <div>
          <h2 style={{fontFamily:"'Source Serif 4',serif", color:C.titulo, margin:"0 0 2px"}}>Gestión para la asesoría</h2>
          <p style={{fontSize:J, color:C.secundario, margin:0}}>Contratos nuevos, incidencias y cambios de un periodo, para tramitar.</p>
        </div>
        <div style={{marginLeft:"auto", display:"flex", gap:10, alignItems:"flex-end", flexWrap:"wrap"}}>
          <div><label style={{fontSize:10, color:C.secundario, display:"block"}}>Desde</label><input type="date" value={desde} onChange={function(e){ setDesde(e.target.value); }} style={S.input} /></div>
          <div><label style={{fontSize:10, color:C.secundario, display:"block"}}>Hasta</label><input type="date" value={hasta} onChange={function(e){ setHasta(e.target.value); }} style={S.input} /></div>
          <button style={S.btn} onClick={function(){ setDesde(per.desde); setHasta(per.hasta); }}>Curso completo</button>
          <button style={S.btn} onClick={function(){ window.print(); }}>Imprimir</button>
          <button style={S.btnPri} onClick={exportar}>Excel</button>
        </div>
      </div>

      <div style={{fontSize:H, color:C.secundario, marginBottom:14}}>Periodo: <b style={{color:C.titulo}}>{desde}</b> a <b style={{color:C.titulo}}>{hasta}</b></div>

      <div style={{marginBottom:22}}>
        <div style={{fontFamily:"'Source Serif 4',serif", fontWeight:700, color:C.titulo, fontSize:O, marginBottom:6}}>Contratos nuevos <span style={{fontSize:J, color:C.secundario, fontWeight:400}}>({contratosNuevos.length})</span></div>
        <div className="tabla-scroll"><table style={{width:"100%", borderCollapse:"collapse"}}>
          <thead><tr><th style={ths}>Desde</th><th style={ths}>Hasta</th><th style={ths}>Persona</th><th style={ths}>Tipo</th><th style={Object.assign({}, ths,{textAlign:"right"})}>Horas</th><th style={ths}>Nota</th></tr></thead>
          <tbody>
            {contratosNuevos.map(function(r,i){ return (
              <tr key={i}>
                <td style={Object.assign({}, tds,{whiteSpace:"nowrap", fontWeight:600})}>{r.k.desde||"—"}</td>
                <td style={Object.assign({}, tds,{whiteSpace:"nowrap", color:r.k.hasta?C.texto:C.secundario})}>{r.k.hasta||"indefinido"}</td>
                <td style={Object.assign({}, tds,{fontWeight:600, color:C.titulo})}>{nomP(r.persona.id)}</td>
                <td style={tds}>{tipoContratoLabel(r.k)}</td>
                <td style={Object.assign({}, tds,{textAlign:"right"})}>{r2(r.k.horas)} h</td>
                <td style={Object.assign({}, tds,{color:C.secundario})}>{r.k.nota||""}</td>
              </tr>
            ); })}
            {contratosNuevos.length===0 ? <tr><td colSpan="6" style={Object.assign({}, tds,{color:C.secundario})}>Sin contratos nuevos en el periodo.</td></tr> : null}
          </tbody>
        </table></div>
      </div>

      <div style={{marginBottom:22}}>
        <div style={{fontFamily:"'Source Serif 4',serif", fontWeight:700, color:C.titulo, fontSize:O, marginBottom:6}}>Incidencias <span style={{fontSize:J, color:C.secundario, fontWeight:400}}>({incidencias.length})</span></div>
        <div className="tabla-scroll"><table style={{width:"100%", borderCollapse:"collapse"}}>
          <thead><tr><th style={ths}>Desde</th><th style={ths}>Hasta</th><th style={ths}>Persona</th><th style={ths}>Tipo</th><th style={Object.assign({}, ths,{textAlign:"right"})}>Cantidad</th><th style={ths}>Sustituto/a</th></tr></thead>
          <tbody>
            {incidencias.map(function(x){ return (
              <tr key={x.id}>
                <td style={Object.assign({}, tds,{whiteSpace:"nowrap", fontWeight:600})}>{x.desde||"—"}</td>
                <td style={Object.assign({}, tds,{whiteSpace:"nowrap", color:x.hasta?C.texto:C.secundario})}>{x.abierta?"hasta reincorp.":(x.hasta||"—")}</td>
                <td style={Object.assign({}, tds,{fontWeight:600, color:C.titulo})}>{nomP(x.personaId)}</td>
                <td style={tds}>{x.tipo}</td>
                <td style={Object.assign({}, tds,{textAlign:"right"})}>{num(x.cantidad)>0?(r2(x.cantidad)+(x.unidad==="horas"?" h":"%")):"—"}</td>
                <td style={Object.assign({}, tds,{color:C.secundario})}>{x.sustitutoId?nomP(x.sustitutoId):"—"}</td>
              </tr>
            ); })}
            {incidencias.length===0 ? <tr><td colSpan="6" style={Object.assign({}, tds,{color:C.secundario})}>Sin incidencias en el periodo.</td></tr> : null}
          </tbody>
        </table></div>
      </div>

      <div style={{marginBottom:22}}>
        <div style={{fontFamily:"'Source Serif 4',serif", fontWeight:700, color:C.titulo, fontSize:O, marginBottom:6}}>Cambios registrados <span style={{fontSize:J, color:C.secundario, fontWeight:400}}>({cambios.length})</span></div>
        <div className="tabla-scroll"><table style={{width:"100%", borderCollapse:"collapse"}}>
          <thead><tr><th style={ths}>Fecha</th><th style={ths}>Descripción</th></tr></thead>
          <tbody>
            {cambios.map(function(c,i){ return (
              <tr key={i}>
                <td style={Object.assign({}, tds,{whiteSpace:"nowrap", fontWeight:600})}>{(c.fecha||"").slice(0,10)}</td>
                <td style={tds}>{descCambio(c)}</td>
              </tr>
            ); })}
            {cambios.length===0 ? <tr><td colSpan="2" style={Object.assign({}, tds,{color:C.secundario})}>Sin cambios registrados en el periodo.</td></tr> : null}
          </tbody>
        </table></div>
      </div>
    </div>
  );
}


function RevisionView(props){
  var d = props.data;
  var [detalle, setDetalle] = useState(null);
  var [notaDesc, setNotaDesc] = useState("");
  var [verResueltos, setVerResueltos] = useState(false);
  var items = detectarIncongruencias(d);
  var resueltos = detectarIncongruencias(d, true).filter(function(x){ return x.descartado; });

  function descartar(aviso){
    if(!notaDesc.trim()){ if(props.toast) props.toast("Escribe una anotación para descartarlo","aviso"); return; }
    var lst = (d.avisosDescartados||[]).slice();
    lst.push({firma:aviso.firma, titulo:aviso.titulo, persona:aviso.persona, nota:notaDesc.trim(), fecha:hoyISO()});
    props.setData(Object.assign({}, d, {avisosDescartados:lst}));
    setDetalle(null); setNotaDesc("");
    if(props.toast) props.toast("Aviso descartado con anotación","ok");
  }
  function restaurar(firma){
    var lst = (d.avisosDescartados||[]).filter(function(x){ return x.firma!==firma; });
    props.setData(Object.assign({}, d, {avisosDescartados:lst}));
    if(props.toast) props.toast("Aviso restaurado","info");
  }
  var N1 = items.filter(function(x){ return x.nivel==="error"; });
  var N2 = items.filter(function(x){ return x.nivel==="revisable"; });
  var N3 = items.filter(function(x){ return x.nivel==="gestion"; });
  var meta = {
    error:{col:C.peligro, bg:C.peligroBg, t:"Errores objetivos", sub:"Están mal seguro. Hay que corregirlos."},
    revisable:{col:C.aviso, bg:C.avisoBg, t:"Revisables o justificables", sub:"Probablemente mal, pero podría ser correcto según el caso."},
    gestion:{col:CALM, bg:C.infoBg, t:"Avisos de gestión", sub:"Ni bien ni mal, pero conviene mirarlos a tiempo."}
  };
  function navegar(ruta){
    /* mapear ruta textual al bloque + sub-pestaña */
    var f = "config";
    if(ruta.indexOf("Reparto de jornadas")>=0) f="reparto";
    else if(ruta.indexOf("Personas")>=0 || ruta.indexOf("Incidencias")>=0) f="personas";
    else if(ruta.indexOf("Economía")>=0 || ruta.indexOf("Ingresos")>=0) f="economia";
    else f="config";
    if(props.onNav) props.onNav(f);
    setDetalle(null);
  }
  function Grupo(props2){
    var lst=props2.items, m=meta[props2.nivel];
    if(!lst.length) return null;
    return (
      <div style={{marginBottom:22}}>
        <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:8}}>
          <span style={{width:12, height:12, borderRadius:"50%", background:m.col, display:"inline-block"}}></span>
          <span style={{fontWeight:700, color:C.titulo, fontSize:15, fontFamily:"'Source Serif 4',serif"}}>{m.t}</span>
          <span style={{background:m.col, color:"#fff", borderRadius:10, padding:"1px 9px", fontSize:12, fontWeight:700}}>{lst.length}</span>
        </div>
        <p style={{fontSize:12, color:C.secundario, margin:"0 0 10px"}}>{m.sub}</p>
        <div style={Object.assign({}, S.card, {padding:0, overflow:"hidden"})}>
          <div className="tabla-scroll"><table><tbody>
            {lst.map(function(x, i){
              return (
                <tr key={i} style={{cursor:"pointer"}} onClick={function(){ setDetalle(x); }}>
                  <td style={{width:6, background:m.col, padding:0}}></td>
                  <td style={{fontSize:13, fontWeight:600, color:C.titulo}}>{x.titulo}{x.persona?<span style={{fontWeight:400, color:C.secundario}}> · {x.persona}</span>:null}</td>
                  <td style={{fontSize:12, color:C.azul, textAlign:"right"}}>ver ›</td>
                </tr>
              );
            })}
          </tbody></table></div>
        </div>
      </div>
    );
  }
  return (
    <div>
      <div style={{display:"flex", gap:12, marginBottom:20, flexWrap:"wrap"}}>
        {["error","revisable","gestion"].map(function(nv){
          var m=meta[nv], n=(nv==="error"?N1:(nv==="revisable"?N2:N3)).length;
          return (
            <div key={nv} style={Object.assign({}, S.card, {padding:"12px 18px", borderColor: n?m.col:C.borde, minWidth:150})}>
              <div style={{fontSize:26, fontWeight:700, color:m.col, fontFamily:"'Source Serif 4',serif"}}>{n}</div>
              <div style={{fontSize:12, color:C.secundario, fontWeight:600}}>{m.t.toLowerCase()}</div>
            </div>
          );
        })}
      </div>

      {items.length===0 ? (
        <div style={{padding:"18px 20px", background:C.okBg, border:"1px solid "+C.ok, borderRadius:10, color:C.okText, fontWeight:600}}>✓ Sin incongruencias activas. Todo cuadra.</div>
      ) : (
        <div>
          <Grupo nivel="error" items={N1} />
          <Grupo nivel="revisable" items={N2} />
          <Grupo nivel="gestion" items={N3} />
        </div>
      )}

      {resueltos.length ? (
        <div style={{marginTop:14}}>
          <button className="no-print" onClick={function(){ setVerResueltos(!verResueltos); }} style={{display:"inline-flex", alignItems:"center", gap:8, border:"1px solid "+C.borde, background:C.blanco, borderRadius:9, padding:"7px 12px", cursor:"pointer", fontSize:12, color:C.secundario, fontWeight:600}}>
            {verResueltos?"▼":"▶"} Resueltos / descartados ({resueltos.length})
          </button>
          {verResueltos ? (
            <div style={Object.assign({}, S.card, {padding:0, overflow:"hidden", marginTop:8})}>
              <div className="tabla-scroll"><table><tbody>
                {resueltos.map(function(x, i){
                  return (

              <input style={Object.assign({}, S.input, {width:"100%", marginBottom:8})} placeholder="Anotación (por qué es correcto)…" value={notaDesc} onChange={function(e){ setNotaDesc(e.target.value); }} />

            </div>

      ) : null}

  );
}
