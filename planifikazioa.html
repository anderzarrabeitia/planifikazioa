function GitHubModal(props){
  var [c, setC] = useState(Object.assign({owner:"", repo:"", token:"", dir:"datuak"}, props.cfg));
  var [probando, setProbando] = useState(false);
  var [resultado, setResultado] = useState(null);
  var [verVers, setVerVers] = useState("");     /* curso cuyas versiones se muestran */
  var [vers, setVers] = useState([]);
  function set(k, v){ var o=Object.assign({}, c); o[k]=v; setC(o); }
  function probar(){
    setProbando(true); setResultado(null);
    props.onProbar(c).then(function(ys){ setProbando(false); setResultado({ok:true, n:ys.length, cursos:ys}); })
      .catch(function(e){ setProbando(false); setResultado({ok:false, msg:e.message}); });
  }
  function cargarVersiones(izena){
    setVerVers(izena); setVers([]);
    props.getCurso(izena).then(function(res){ if(res && res.edukia && res.edukia.versiones){ setVers(res.edukia.versiones.slice().reverse()); } });
  }
  var ov={position:"fixed", inset:0, background:"rgba(30,25,20,.5)", zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", padding:20};
  var card={background:"#fff", borderRadius:14, padding:"22px 24px", maxWidth:640, width:"100%", maxHeight:"88vh", overflow:"auto", boxShadow:"0 10px 40px rgba(0,0,0,.2)"};
  var lbl={fontSize:11, color:C.secundario, display:"block", marginBottom:3, fontWeight:600};
  var inp={width:"100%", border:"1px solid "+C.borde, borderRadius:8, padding:"8px 10px", fontSize:14, boxSizing:"border-box"};
  return (
    <div style={ov} onClick={props.onClose}>
      <div style={card} onClick={function(e){ e.stopPropagation(); }}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6}}>
          <h3 style={{margin:0, fontFamily:"'Source Serif 4',serif", color:C.titulo}}>Nube (GitHub) · versiones</h3>
          <button onClick={props.onClose} style={{border:"none", background:"transparent", fontSize:22, color:C.secundario, cursor:"pointer", lineHeight:1}}>×</button>
        </div>
        <p style={{fontSize:12.5, color:C.secundario, margin:"0 0 16px", lineHeight:1.5}}>
          Los datos se guardan como un archivo JSON por curso en un repositorio <b>privado</b> de GitHub, con historial de versiones. El token se guarda solo en este navegador, nunca en el archivo. Como el repositorio es privado, el token hace falta tanto para leer como para escribir.
        </p>

        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:12}}>
          <div><label style={lbl}>Owner (usuario u organización)</label><input value={c.owner} onChange={function(e){ set("owner", e.target.value.trim()); }} placeholder="ej. anderzarra" style={inp} /></div>
          <div><label style={lbl}>Repositorio</label><input value={c.repo} onChange={function(e){ set("repo", e.target.value.trim()); }} placeholder="ej. planifikazioa-datos" style={inp} /></div>
          <div><label style={lbl}>Carpeta</label><input value={c.dir} onChange={function(e){ set("dir", e.target.value.trim()); }} placeholder="datuak" style={inp} /></div>
          <div><label style={lbl}>Token personal (Contents: Read and write)</label><input type="password" value={c.token} onChange={function(e){ set("token", e.target.value.trim()); }} placeholder="ghp_… o github_pat_…" style={inp} /></div>
        </div>

        <div style={{display:"flex", gap:8, flexWrap:"wrap", marginBottom:8}}>
          <button onClick={function(){ props.onSave(c); }} style={{border:"none", background:C.azul, color:"#fff", borderRadius:8, padding:"8px 14px", cursor:"pointer", fontWeight:600, fontSize:13}}>Guardar ajustes</button>
          <button onClick={probar} disabled={!c.owner||!c.repo||probando} style={{border:"1px solid "+C.borde, background:"#fff", color:C.titulo, borderRadius:8, padding:"8px 14px", cursor:(!c.owner||!c.repo)?"not-allowed":"pointer", fontSize:13}}>{probando?"Probando…":"Probar conexión"}</button>
          {c.token ? <button onClick={function(){ var n=Object.assign({}, c, {token:""}); setC(n); props.onSave(n); }} style={{border:"1px solid "+C.peligroBgBorde, background:"#fff", color:C.peligroText, borderRadius:8, padding:"8px 14px", cursor:"pointer", fontSize:13}}>Olvidar token</button> : null}
        </div>

        {resultado ? (
          <div style={{fontSize:13, padding:"8px 12px", borderRadius:8, marginBottom:8,
            background: resultado.ok?C.okBg:C.peligroBg, color: resultado.ok?C.okText:C.peligroText, border:"1px solid "+(resultado.ok?C.ok:C.peligro)}}>
            {resultado.ok ? ("Conexión correcta. "+resultado.n+" curso(s) en la nube: "+(resultado.cursos.join(", ")||"ninguno todavía")) : ("Error: "+resultado.msg)}
          </div>
        ) : null}

        <div style={{borderTop:"1px solid "+C.borde, marginTop:14, paddingTop:14}}>
          <div style={{fontSize:13, fontWeight:700, color:C.titulo, marginBottom:8}}>Historial de versiones</div>
          {(props.cursos||[]).length===0 ? <div style={{fontSize:12.5, color:C.secundario}}>No hay cursos en la nube todavía. Conéctate y usa "Crear este curso en la nube".</div> : (
            <div style={{display:"flex", gap:8, flexWrap:"wrap", marginBottom:10}}>
              {props.cursos.map(function(y){
                return <button key={y} onClick={function(){ cargarVersiones(y); }} style={{border:"1px solid "+(verVers===y?C.azul:C.borde), background: verVers===y?C.infoBg:"#fff", color: verVers===y?C.azul:C.titulo, borderRadius:8, padding:"5px 11px", cursor:"pointer", fontSize:13, fontWeight:600}}>{y}</button>;
              })}
            </div>
          )}
          {verVers && vers.length>0 ? (
            <div className="tabla-scroll"><table style={{width:"100%", borderCollapse:"collapse", fontSize:13}}>
              <thead><tr>
                <th style={{textAlign:"left", padding:"5px 8px", borderBottom:"2px solid "+C.borde, fontSize:11, color:C.secundario}}>Versión</th>
                <th style={{textAlign:"left", padding:"5px 8px", borderBottom:"2px solid "+C.borde, fontSize:11, color:C.secundario}}>Fecha</th>
                <th style={{textAlign:"left", padding:"5px 8px", borderBottom:"2px solid "+C.borde, fontSize:11, color:C.secundario}}>Nota</th>
                <th style={{borderBottom:"2px solid "+C.borde}}></th>
              </tr></thead>
              <tbody>
                {vers.map(function(b){
                  return <tr key={b.v}>
                    <td style={{padding:"5px 8px", borderBottom:"1px solid "+C.borde, fontWeight:700}}>v{b.v}</td>
                    <td style={{padding:"5px 8px", borderBottom:"1px solid "+C.borde, whiteSpace:"nowrap", color:C.secundario}}>{b.data}</td>
                    <td style={{padding:"5px 8px", borderBottom:"1px solid "+C.borde, color:C.texto}}>{b.nota||""}</td>
                    <td style={{padding:"5px 8px", borderBottom:"1px solid "+C.borde, textAlign:"right"}}>
                      <button onClick={function(){ props.onAbrirVersion(verVers, b.v); }} style={{border:"1px solid "+C.azul, background:"#fff", color:C.azul, borderRadius:7, padding:"3px 10px", cursor:"pointer", fontSize:12, fontWeight:600}}>Abrir</button>
                    </td>
                  </tr>;
                })}
              </tbody>
            </table></div>
          ) : (verVers ? <div style={{fontSize:12.5, color:C.secundario}}>Cargando versiones…</div> : null)}
        </div>

        <div style={{borderTop:"1px solid "+C.borde, marginTop:14, paddingTop:12, fontSize:11.5, color:C.secundario, lineHeight:1.5}}>
          <b>Cómo crear el token:</b> GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens → repositorio concreto → permiso "Contents: Read and write". Pégalo aquí; se guarda solo en tu navegador.
        </div>
      </div>
    </div>
  );
}


function App(){
  var [data, setDataRaw] = useState(function(){
    var l = loadLocal();
    return normalize(l || makeSeed());
  });
  var [fase, setFase] = useState("config");
  var [hist, setHist] = useState(false);
  var [toast, setToast] = useState({msg:"", tipo:"ok"});
  var toastTimer = useRef(null);

  /* ----- Motor de deshacer / rehacer (dentro de la sesión, máx. 20 pasos) ----- */
  var MAX_UNDO = 20;
  var undoStack = useRef([]);
  var redoStack = useRef([]);
  var [undoN, setUndoN] = useState(0);   /* solo para refrescar el botón */
  var [redoN, setRedoN] = useState(0);
  function snap(d){ return JSON.stringify(d); }
  function refrescarContadores(){ setUndoN(undoStack.current.length); setRedoN(redoStack.current.length); }

  function setData(d){
    if(d && d.cursoCerrado){
      showToast("Curso cerrado: no se puede modificar","error");
      return;
    }
    if(d && Array.isArray(d.cursos)){ d = recogerCurso(d); }
    /* si cambia el curso activo (cerrar/abrir curso), el historial NO aplica: reiniciar */
    if(d && data && d.cursoActivo !== data.cursoActivo){
      undoStack.current = []; redoStack.current = [];
      refrescarContadores();
      setDataRaw(d);
      return;
    }
    /* guardar el estado ANTERIOR en la pila de deshacer */
    undoStack.current.push(snap(data));
    if(undoStack.current.length > MAX_UNDO) undoStack.current.shift();
    redoStack.current = [];   /* un cambio nuevo invalida el rehacer */
    refrescarContadores();
    setDataRaw(d);
  }
  function deshacer(){
    if(!undoStack.current.length) return;
    var anterior = undoStack.current.pop();
    redoStack.current.push(snap(data));
    if(redoStack.current.length > MAX_UNDO) redoStack.current.shift();
    var d = normalize(JSON.parse(anterior));
    refrescarContadores();
    setDataRaw(d);
    showToast("Deshecho","info");
  }
  function rehacer(){
    if(!redoStack.current.length) return;
    var siguiente = redoStack.current.pop();
    undoStack.current.push(snap(data));
    var d = normalize(JSON.parse(siguiente));
    refrescarContadores();
    setDataRaw(d);
    showToast("Rehecho","info");
  }
  function cambiarCurso(cursoId){
    /* cambiar de curso NO entra en el historial de deshacer (es navegación) */
    var d = Object.assign({}, data);
    if(!d.cursoCerrado) d = recogerCurso(d);
    d.cursoActivo = cursoId;
    d = proyectarCurso(d);
    undoStack.current = []; redoStack.current = [];  /* al cambiar de curso, se reinicia el historial */
    refrescarContadores();
    setDataRaw(d);
    showToast("Curso: " + d.cursoNombre, "ok");
  }
  function showToast(msg, tipo){
    setToast({msg:msg, tipo:tipo||"ok"});
    if(toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(function(){ setToast({msg:"", tipo:"ok"}); }, 2200);
  }

  /* ===== Estado y acciones de la nube (GitHub) ===== */
  var [ghCfg, setGhCfg] = useState(ghLoadCfg());
  var [ghCursos, setGhCursos] = useState([]);      /* nombres de archivos-curso en el repo */
  var [ghCurrent, setGhCurrent] = useState("");    /* archivo-curso abierto ahora */
  var [ghSha, setGhSha] = useState(null);
  var [ghBusy, setGhBusy] = useState(false);
  var [ghOpen, setGhOpen] = useState(false);       /* modal de ajustes/versiones */
  var ghReady = !!(ghCfg.owner && ghCfg.repo);
  function ghClone(x){ return JSON.parse(JSON.stringify(x)); }
  function nombreCursoActual(){ var c=cursoActivoDe(data); return (c && (c.nombre||c.id)) || "curso"; }

  function ghCargarLista(){
    if(!ghReady) return;
    setGhBusy(true);
    ghListCursos(ghCfg).then(function(ys){ setGhCursos(ys); setGhBusy(false); }).catch(function(e){ setGhBusy(false); showToast("Error al listar: "+e.message,"error"); });
  }
  /* al conectar o cambiar de repo, refrescar la lista */
  useEffect(function(){ if(ghReady) ghCargarLista(); /* eslint-disable-next-line */ }, [ghCfg.owner, ghCfg.repo, ghCfg.dir]);

  /* abrir un curso de la nube: carga su ÚLTIMA versión */
  function ghAbrir(izena){
    setGhBusy(true);
    ghGetCurso(ghCfg, izena).then(function(res){
      setGhBusy(false);
      if(!res){ showToast("No encontrado","error"); return; }
      var vers=(res.edukia.versiones||[]);
      var ultima=vers.length?vers[vers.length-1]:null;
      if(!ultima){ showToast("El curso no tiene versiones","error"); return; }
      setDataRaw(normalize(ultima.edukia));
      setGhCurrent(izena); setGhSha(res.sha);
      showToast(izena+" · v"+ultima.v+" cargada","ok");
    }).catch(function(e){ setGhBusy(false); showToast("Error: "+e.message,"error"); });
  }
  /* abrir una versión concreta */
  function ghAbrirVersion(izena, v){
    setGhBusy(true);
    ghGetCurso(ghCfg, izena).then(function(res){
      setGhBusy(false);
      if(!res) return;
      var b=(res.edukia.versiones||[]).filter(function(x){ return x.v===v; })[0];
      if(b){ setDataRaw(normalize(b.edukia)); setGhCurrent(izena); setGhSha(res.sha); showToast(izena+" · v"+v+" cargada","ok"); }
    }).catch(function(e){ setGhBusy(false); showToast("Error: "+e.message,"error"); });
  }
  /* guardar una versión nueva del curso abierto */
  function ghGuardarVersion(nota){
    if(!ghCfg.token){ showToast("Hace falta el token para guardar","error"); setGhOpen(true); return; }
    var izena = ghCurrent || nombreCursoActual();
    setGhBusy(true);
    ghGetCurso(ghCfg, izena).then(function(res){
      var obj = res ? res.edukia : {curso:izena, versiones:[]};
      var sha = res ? res.sha : null;
      var vers = obj.versiones || [];
      var nextV = vers.length ? (vers[vers.length-1].v + 1) : 1;
      vers.push({v:nextV, data:new Date().toISOString().substring(0,16).replace("T"," "), nota:nota||"", edukia:ghClone(data)});
      obj.versiones = vers; obj.curso = izena;
      return ghPutCurso(ghCfg, izena, obj, sha, "v"+nextV+" · "+izena+(nota?(" · "+nota):"")).then(function(newSha){
        setGhSha(newSha); setGhCurrent(izena); setGhBusy(false); ghCargarLista(); showToast("v"+nextV+" guardada online","ok");
      });
    }).catch(function(e){ setGhBusy(false); showToast("Error al guardar: "+e.message,"error"); });
  }
  /* crear en la nube un archivo nuevo para el curso activo (si no existe) */
  function ghCrearCursoNube(){
    if(!ghCfg.token){ showToast("Hace falta el token para guardar","error"); setGhOpen(true); return; }
    var izena = nombreCursoActual();
    if(ghCursos.indexOf(izena)>=0){ if(!window.confirm("'"+izena+"' ya existe en la nube. ¿Abrirlo en su lugar?")) return; ghAbrir(izena); return; }
    var obj = {curso:izena, versiones:[{v:1, data:new Date().toISOString().substring(0,16).replace("T"," "), nota:"Versión inicial", edukia:ghClone(data)}]};
    setGhBusy(true);
    ghPutCurso(ghCfg, izena, obj, null, "Crear "+izena).then(function(newSha){
      setGhBusy(false); setGhCurrent(izena); setGhSha(newSha); ghCargarLista(); showToast(izena+" creado en la nube · v1","ok");
    }).catch(function(e){ setGhBusy(false); showToast("Error al crear: "+e.message,"error"); });
  }

  useEffect(function(){
    var ok = saveLocal(data);
    if(!ok){ showToast("No se pudo autoguardar (almacenamiento lleno)","error"); }
  }, [data]);

  /* Atajos de teclado: Ctrl/Cmd+Z deshacer, Ctrl/Cmd+Shift+Z o Ctrl+Y rehacer */
  useEffect(function(){
    function onKey(e){
      var meta = e.ctrlKey || e.metaKey;
      if(!meta) return;
      var k = (e.key||"").toLowerCase();
      if(k==="z" && !e.shiftKey){ e.preventDefault(); deshacer(); }
      else if((k==="z" && e.shiftKey) || k==="y"){ e.preventDefault(); rehacer(); }
    }
    window.addEventListener("keydown", onKey);
    return function(){ window.removeEventListener("keydown", onKey); };
  }, [data]);

  var fases = [
    {id:"config", label:"Configuración"},
    {id:"personas", label:"Personas"},
    {id:"reparto", label:"Reparto de jornadas"},
    {id:"economia", label:"Economía"},
    {id:"rpt", label:"RPT"},
    {id:"revision", label:"Revisión"},
    {id:"asesoria", label:"Asesoría"},
    {id:"ayuda", label:"Ayuda"}
  ];
  var nErroresObj = detectarIncongruencias(data).filter(function(x){ return x.nivel==="error"; }).length;

  return (
    <div style={{minHeight:"100vh"}}>
      {/* barra superior */}
      <div style={{background:C.contenido, borderBottom:"1px solid "+C.borde, padding:"12px 22px",
        display:"flex", alignItems:"center", gap:16, flexWrap:"wrap", position:"sticky", top:0, zIndex:100}}>
        <div style={{display:"flex", alignItems:"center", gap:11}}>
          <div style={{width:38, height:38, borderRadius:10, background:C.azul, color:"#fff",
            display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"'Source Serif 4',serif",
            fontWeight:700, fontSize:17, letterSpacing:".02em"}}>AM</div>
          <div>
            <div style={{fontFamily:"'Source Serif 4',serif", fontWeight:700, color:C.titulo, fontSize:17, lineHeight:1.1}}>Planifikazioa</div>
            <div style={{fontSize:12, color:C.secundario}}>Plantilla y financiación</div>
          </div>
          <div style={{marginLeft:14, paddingLeft:14, borderLeft:"1px solid "+C.borde}}>
            <label style={{fontSize:10, color:C.secundario, textTransform:"uppercase", letterSpacing:".05em", display:"block", marginBottom:2}}>Curso</label>
            <select value={data.cursoActivo||""} onChange={function(e){ cambiarCurso(e.target.value); }}
              style={{border:"1px solid "+C.borde, borderRadius:8, padding:"5px 10px", fontSize:K, fontWeight:700, color:C.titulo, background:"#fff", cursor:"pointer", fontFamily:"'Source Serif 4',serif"}}>
              {(data.cursos||[]).map(function(cu){ return <option key={cu.id} value={cu.id}>{cu.nombre}{cu.estado==="cerrado"?" (cerrado)":""}</option>; })}
            </select>
          </div>
        </div>
        <div style={{flex:1}} />
        <div style={{display:"flex", alignItems:"center", gap:10, flexWrap:"wrap"}}>
          {!data.cursoCerrado ? (
            <div style={{display:"flex", gap:4}}>
              <button title="Deshacer" disabled={undoN===0} onClick={deshacer}
                style={{border:"1px solid "+C.borde, background: undoN>0?"#fff":C.crema, color: undoN>0?C.titulo:C.desactivado, borderRadius:9, padding:"7px 10px", cursor: undoN>0?"pointer":"not-allowed", fontSize:15, lineHeight:1}}>↩</button>
              <button title="Rehacer" disabled={redoN===0} onClick={rehacer}
                style={{border:"1px solid "+C.borde, background: redoN>0?"#fff":C.crema, color: redoN>0?C.titulo:C.desactivado, borderRadius:9, padding:"7px 10px", cursor: redoN>0?"pointer":"not-allowed", fontSize:15, lineHeight:1}}>↪</button>
            </div>
          ) : null}
          <Segmented options={fases.map(function(f){ return (f.id==="revision" && nErroresObj>0) ? Object.assign({}, f, {label:"Revisión ⬤"+nErroresObj}) : f; })} value={fase} onChange={setFase} />
          <Segmented options={[{id:"horas",label:"Horas"},{id:"pct",label:"%"}]} value={(data.unidad==="pct")?"pct":"horas"} onChange={function(v){ setData(Object.assign({}, data, {unidad:v})); }} />
        </div>
      </div>

      {/* barra de la nube (GitHub) */}
      <div className="no-print" style={{background: ghReady?C.infoBg:"#fbfaf8", borderBottom:"1px solid "+C.borde, padding:"7px 22px", display:"flex", alignItems:"center", gap:10, flexWrap:"wrap"}}>
        <button onClick={function(){ setGhOpen(true); }} style={{border:"1px solid "+(ghReady?C.azul:C.borde), background: ghReady?"#fff":"#fff", color: ghReady?C.azul:C.secundario, borderRadius:8, padding:"5px 11px", cursor:"pointer", fontSize:K, fontWeight:600}}>
          {ghReady ? "☁ En la nube" : "☁ Conectar a la nube"}
        </button>
        {ghReady ? (
          <React.Fragment>
            <span style={{fontSize:12, color:C.secundario}}>{ghCfg.owner}/{ghCfg.repo}</span>
            <select value={ghCurrent||""} onChange={function(e){ if(e.target.value) ghAbrir(e.target.value); }}
              style={{border:"1px solid "+C.borde, borderRadius:8, padding:"5px 9px", fontSize:K, background:"#fff", cursor:"pointer"}}>
              <option value="">— Abrir curso de la nube —</option>
              {ghCursos.map(function(y){ return <option key={y} value={y}>{y}</option>; })}
            </select>
            {ghCurrent ? <span style={{fontSize:12, fontWeight:700, color:C.titulo}}>{ghCurrent}</span> : null}
            {ghCursos.indexOf(nombreCursoActual())<0 ? (
              <button disabled={ghBusy} onClick={ghCrearCursoNube}
                style={{border:"none", background:C.ok, color:"#fff", borderRadius:8, padding:"5px 11px", cursor: ghBusy?"wait":"pointer", fontSize:K, fontWeight:600}}>+ Crear este curso en la nube</button>
            ) : (
              <button disabled={ghBusy} onClick={function(){ var o=window.prompt("Nota de la versión (opcional):",""); if(o!==null) ghGuardarVersion(o); }}
                style={{border:"none", background:C.azul, color:"#fff", borderRadius:8, padding:"5px 11px", cursor: ghBusy?"wait":"pointer", fontSize:K, fontWeight:600}}>+ Guardar versión</button>
            )}
            <button disabled={ghBusy} onClick={function(){ setGhOpen(true); }}
              style={{border:"1px solid "+C.borde, background:"#fff", color:C.titulo, borderRadius:8, padding:"5px 11px", cursor:"pointer", fontSize:K}}>Versiones / Ajustes</button>
            {ghBusy ? <span style={{fontSize:12, color:C.secundario}}>⏳ trabajando…</span> : null}
          </React.Fragment>
        ) : (
          <span style={{fontSize:12, color:C.secundario}}>Trabaja con versiones guardadas en un repositorio privado de GitHub. También puedes seguir usando Importar/Exportar JSON.</span>
        )}
      </div>

      {data.cursoCerrado ? (
        <div className="no-print" style={{background:C.avisoBg, borderBottom:"1px solid "+C.aviso, padding:"8px 22px", display:"flex", alignItems:"center", gap:10, fontSize:13, color:C.avisoText}}>
          <span style={{fontWeight:700}}>🔒 Curso {data.cursoNombre} cerrado — solo lectura.</span>
          <span>Puedes consultarlo todo, pero no modificarlo. Para reabrirlo: Configuración → Cursos.</span>
        </div>
      ) : null}
      {(function(){
        var act = cursoActivoDe(data);
        if(!act || !act.revisarPlantilla || data.cursoCerrado) return null;
        return (
          <div className="no-print" style={{background:C.infoBg, borderBottom:"1px solid "+C.azul, padding:"8px 22px", display:"flex", alignItems:"center", gap:10, fontSize:13, color:C.titulo}}>
            <span style={{fontWeight:700}}>Curso {data.cursoNombre} recién abierto.</span>
            <span>Tienes pendiente revisar altas y bajas de la plantilla.</span>
            <button style={Object.assign({}, S.btn, {marginLeft:"auto"})} onClick={function(){ setFase("personas"); }}>Ir a Altas y bajas →</button>
          </div>
        );
      })()}

      {/* cuerpo */}
      <div style={{maxWidth:1180, margin:"0 auto", padding:"24px 22px 80px"}}>
        {fase==="config" && <ConfigView data={data} setData={setData} toast={showToast} cambiarCurso={cambiarCurso} />}
        {fase==="personas" && <PersonasBloque data={data} setData={setData} toast={showToast} />}
        {fase==="reparto" && <MontajeView data={data} setData={setData} toast={showToast} />}
        {fase==="economia" && <EconomiaBloque data={data} setData={setData} toast={showToast} />}
        {fase==="rpt" && <RPTView data={data} setData={setData} toast={showToast} />}
        {fase==="revision" && <RevisionView data={data} onNav={function(f){ setFase(f); }} toast={showToast} />}
        {fase==="asesoria" && <AsesoriaView data={data} toast={showToast} />}
        {fase==="ayuda" && <AyudaView data={data} setData={setData} toast={showToast} />}
      </div>

      {hist ? (
        <div className="no-print" onClick={function(){ setHist(false); }}
          style={{position:"fixed", inset:0, background:"rgba(30,25,20,.45)", zIndex:210, display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"40px 20px", overflowY:"auto"}}>
          <div onClick={function(e){ e.stopPropagation(); }}
            style={{background:C.crema, borderRadius:12, maxWidth:1000, width:"100%", padding:"20px 22px", boxShadow:"0 18px 50px rgba(0,0,0,.3)"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
              <h3 style={{margin:0, fontFamily:"'Source Serif 4',serif", color:C.titulo, fontSize:P}}>Historial</h3>
              <button style={S.btn} onClick={function(){ setHist(false); }}>Cerrar</button>
            </div>
            <VersionesView data={data} setData={setData} toast={showToast} />
          </div>
        </div>
      ) : null}

      <Toast msg={toast.msg} tipo={toast.tipo} />
      {ghOpen ? <GitHubModal cfg={ghCfg} busy={ghBusy} ghCurrent={ghCurrent} cursos={ghCursos}
        onClose={function(){ setGhOpen(false); }}
        onSave={function(c){ ghSaveCfg(c); setGhCfg(c); showToast("Ajustes guardados","ok"); }}
        onProbar={function(c){ setGhBusy(true); return ghListCursos(c).then(function(ys){ setGhBusy(false); return ys; }).catch(function(e){ setGhBusy(false); throw e; }); }}
        getCurso={function(izena){ return ghGetCurso(ghCfg, izena); }}
        onAbrirVersion={function(izena, v){ ghAbrirVersion(izena, v); setGhOpen(false); }} /> : null}
      <CalcFlotante data={data} toast={showToast} onHistorial={function(){ setHist(true); }} onAyuda={function(){ setFase("ayuda"); }} onNavegar={function(f){ setFase(f); }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>

<script>
(function(){
  var tries = 0;
  function showErr(msg, file, line, err){
    var box = document.getElementById("err");
    var stack = (err && err.stack) ? ("\n\n" + err.stack) : "";
    box.style.display = "block";
    box.innerHTML = "";
    var b = document.createElement("b");
    b.textContent = "No se ha podido cargar la aplicación";
    box.appendChild(b);
    box.appendChild(document.createTextNode(
      (msg||"Error desconocido") + (line ? ("  ·  línea " + line) : "") + (file ? ("  ·  " + file) : "") + stack
    ));
  }
  window.addEventListener("error", function(ev){ showErr(ev.message, ev.filename, ev.lineno, ev.error); });
  function boot(){
    if(!window.React || !window.ReactDOM || !window.Babel){
      tries++;
      if(tries > 120){ showErr("No se han cargado las librerías (React / ReactDOM / Babel). Revisa la conexión a internet o vuelve a abrir el archivo.", "", 0); return; }
      setTimeout(boot, 50);
      return;
    }
    try{
      var src = document.getElementById("app-source").textContent;
      var out = Babel.transform(src, {presets:["react"]}).code;
      new Function(out)();
    }catch(e){
      showErr(e.message, "app-source", (e.lineNumber || 0), e);
    }
  }
  boot();
})();
</script>
</body>
</html>
