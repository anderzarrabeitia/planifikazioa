const {useState, useEffect, useRef, useMemo} = React;

function uid(p){ return p + "_" + Date.now() + "_" + Math.floor(Math.random()*1000000); }
/* Comparación alfabética correcta para español: las vocales con tilde (á, é, í, ó, ú) y la ñ
   se ordenan como su letra base, no al final del abecedario. Se usa en TODAS las ordenaciones de nombres. */
function cmpTexto(a, b){
  return String(a||"").localeCompare(String(b||""), "es", {sensitivity:"base", numeric:true});
}
function cmpPersona(a, b){
  var r = cmpTexto((a&&a.apellidos)||"", (b&&b.apellidos)||"");
  if(r!==0) return r;
  return cmpTexto((a&&a.nombre)||"", (b&&b.nombre)||"");
}
function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }

/* ===== Capa GitHub (versiones en la nube · un archivo JSON por curso) ===== */
var GH_KEY = "eami_planifikazioa_github";
function ghLoadCfg(){ try{ var s=localStorage.getItem(GH_KEY); return s?JSON.parse(s):{owner:"",repo:"",token:"",dir:"datuak"}; }catch(e){ return {owner:"",repo:"",token:"",dir:"datuak"}; } }
function ghSaveCfg(cfg){ try{ localStorage.setItem(GH_KEY, JSON.stringify(cfg)); return true; }catch(e){ return false; } }
function ghDir(cfg){ return (cfg.dir||"datuak").replace(/^\/+|\/+$/g, ""); }
function b64encode(str){ try{ return btoa(unescape(encodeURIComponent(str))); }catch(e){ return btoa(str); } }
function b64decode(str){ try{ return decodeURIComponent(escape(atob(str.replace(/\s/g, "")))); }catch(e){ return atob(str.replace(/\s/g, "")); } }
function ghHeaders(cfg, withAuth){ var h={"Accept":"application/vnd.github+json"}; if(withAuth && cfg.token) h["Authorization"]="Bearer "+cfg.token; return h; }
/* lista de archivos-curso del repo */
function ghListCursos(cfg){
  var url="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+ghDir(cfg);
  return fetch(url, {headers:ghHeaders(cfg, !!cfg.token)}).then(function(r){
    if(r.status===404) return [];
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(arr){
    if(!Array.isArray(arr)) return [];
    return arr.filter(function(f){ return f.type==="file" && /\.json$/.test(f.name); }).map(function(f){ return f.name.replace(/\.json$/, ""); }).sort();
  });
}
/* contenido + sha de un archivo-curso */
function ghGetCurso(cfg, izena){
  var base="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo;
  var url=base+"/contents/"+ghDir(cfg)+"/"+encodeURIComponent(izena)+".json";
  return fetch(url, {headers:ghHeaders(cfg, !!cfg.token), cache:"no-store"}).then(function(r){
    if(r.status===404) return null;
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){
    if(!j) return null;
    if(j.content && j.content.replace(/\s/g, "")!==""){ return {sha:j.sha, edukia:JSON.parse(b64decode(j.content))}; }
    /* archivos >1MB: contents API no manda el contenido, usar blob API */
    return fetch(base+"/git/blobs/"+j.sha, {headers:ghHeaders(cfg, !!cfg.token), cache:"no-store"}).then(function(rb){
      if(!rb.ok) throw new Error("HTTP "+rb.status);
      return rb.json();
    }).then(function(bl){ return {sha:j.sha, edukia:JSON.parse(b64decode(bl.content))}; });
  });
}
/* escribir un archivo-curso (requiere token) */
function ghPutCurso(cfg, izena, obj, sha, mensaje){
  var url="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+ghDir(cfg)+"/"+encodeURIComponent(izena)+".json";
  var body={message:mensaje||("Actualización: "+izena), content:b64encode(JSON.stringify(obj, null, 2))};
  if(sha) body.sha=sha;
  return fetch(url, {method:"PUT", headers:Object.assign({"Content-Type":"application/json"}, ghHeaders(cfg, true)), body:JSON.stringify(body)}).then(function(r){
    return r.json().then(function(j){
      if(!r.ok){ var e=new Error((j&&j.message)?j.message:("HTTP "+r.status)); e.status=r.status; throw e; }
      return j.content.sha;
    });
  });
}
var MESES_PRL = ["Septiembre","Octubre","Noviembre","Diciembre","Enero","Febrero","Marzo","Abril","Mayo","Junio"];
function makePrl(){
  return {
    diasMes:30, horasBase:32, comptoHoras:5, comptoMult:4.5, pagaExtraMeses:2, ssEmp:31.9,
    ari:1485, becarios:0.733, coef:1, prorrateo:95,
    perfiles:{ eso:{dia:94.44, ssTrab:6.45, irpf:18}, prim:{dia:81.26, ssTrab:6.52, irpf:16} },
    meses: MESES_PRL.map(function(m){ return {nombre:m, alumEP:0, alumES:0, horasEP:0, horasES:0}; })
  };
}
function prlCoste(perfil, cfg){
  var dia=num(perfil.dia);
  var base=dia*num(cfg.diasMes);
  var compto=(num(cfg.horasBase)>0 ? (dia*num(cfg.comptoHoras)/num(cfg.horasBase)) : 0) * num(cfg.comptoMult);
  var bruta=base+compto+num(perfil.antig)+num(perfil.cargo)+num(perfil.ajuste);
  var pagaExtra=bruta*num(cfg.pagaExtraMeses)/12;
  var retSS=(bruta+pagaExtra)*num(perfil.ssTrab)/100;
  var retIRPF=bruta*num(perfil.irpf)/100;
  var ssEmp=(bruta+pagaExtra)*num(cfg.ssEmp)/100;
  var costeMes=bruta+ssEmp;
  return {base:base, compto:compto, bruta:bruta, pagaExtra:pagaExtra, retSS:retSS, retIRPF:retIRPF, liquido:bruta-retSS-retIRPF, ssEmp:ssEmp, costeMes:costeMes, costeAnio:costeMes*14};
}
/* ---- Balance PRL: presupuesto conservador (media meses con datos × 10 × prorrateo) vs coste de las asignaciones ---- */
function prlBalance(d){
  var P = d.prl || {}; 
  var caPrim = prlCoste((P.perfiles||{}).prim||{}, P).costeAnio;
  var caEso  = prlCoste((P.perfiles||{}).eso||{},  P).costeAnio;
  var hb = num(P.horasBase);
  /* 1) presupuesto: media de los meses CON datos (alumnos>0) del importe ARI YA PRORRATEADO.
     La fórmula alumnos×ARI×(becarios+coef) ya es el importe ANUAL; se promedian los meses rellenos
     (más conservador, porque la matrícula suele crecer) y se aplica el prorrateo por mes. */
  var meses = P.meses || [];
  var sumaProrr = 0, nMesesConDatos = 0;
  meses.forEach(function(m){
    var alum = num(m.alumEP)+num(m.alumES);
    if(alum>0){
      var presupMes = alum*num(P.ari)*(num(P.becarios)+num(P.coef));
      sumaProrr += presupMes * num(P.prorrateo)/100;
      nMesesConDatos++;
    }
  });
  var presupProrrateado = nMesesConDatos>0 ? sumaProrr/nMesesConDatos : 0;   /* media de meses prorrateados */
  var presupAnual = num(P.prorrateo)>0 ? presupProrrateado/(num(P.prorrateo)/100) : 0;  /* el mismo, sin prorrateo (informativo) */
  /* 2) coste: personas asignadas a PRL EP (cat_15) y PRL ES (cat_16) en el reparto, coste-año × su % */
  var cats={}; (d.categorias||[]).forEach(function(c){ cats[c.id]=c; });
  var costeEP=0, costeES=0;
  (d.tramos||[]).forEach(function(t){
    var c = cats[t.categoriaId]; if(!c) return;
    var nom = (c.nombreEs||"")+" "+(c.nombreEu||"");
    if(/PRL/i.test(nom)){
      if(c.etapaReparto==="secundaria") costeES += num(t.porcentaje)/100 * caEso;
      else costeEP += num(t.porcentaje)/100 * caPrim;
    }
  });
  var costeTotal = costeEP+costeES;
  return {
    presupProrrateado: presupProrrateado, presupAnual: presupAnual,
    nMesesConDatos: nMesesConDatos, prorrateo: num(P.prorrateo),
    costeEP: costeEP, costeES: costeES, costeTotal: costeTotal,
    margen: presupProrrateado - costeTotal,
    sePasa: costeTotal > presupProrrateado + 0.01
  };
}

function premioContinuidad(d, p, fechaRef){
  var CV = d.convenio || {};
  var pc = CV.premio || {edadMin:55, aniosMin:20, pagasBase:4, aniosBase:20, quinquenio:5, pagaQuinquenio:1};
  var ref = fechaRef || hoyISO();
  var fNac = p && p.fechaNacimiento;
  var fAnt = fechaAntiguedadEfectiva(p);
  function aniosEntre(a2, b2){ var A=new Date(a2), B=new Date(b2); if(isNaN(A.getTime())||isNaN(B.getTime())) return null; return (B-A)/(1000*60*60*24*365.25); }
  var edad = fNac ? aniosEntre(fNac, ref) : null;
  var servicio = fAnt ? aniosEntre(fAnt, ref) : null;
  var N = nominaDe(d, p, fechaRef);
  var mensualidad = N ? N.bruta : 0;   /* una gratificación extra = una mensualidad ordinaria */
  var cumpleEdad = edad!==null && edad >= num(pc.edadMin);
  var cumpleServicio = servicio!==null && servicio >= num(pc.aniosMin);
  var pagas = 0, importe = 0;
  if(servicio!==null && servicio >= num(pc.aniosBase)){
    var extra = num(pc.quinquenio)>0 ? Math.floor((servicio - num(pc.aniosBase)) / num(pc.quinquenio)) : 0;
    pagas = num(pc.pagasBase) + extra * num(pc.pagaQuinquenio);
    importe = pagas * mensualidad;
  }
  /* quién lo paga: docente en pago delegado -> pago delegado; resto -> centro */
  var lopaga = (N && N.esPD) ? "pd" : "centro";
  /* cuándo le corresponde: cuando cumpla AMBOS requisitos */
  var faltaEdad = (edad!==null) ? Math.max(0, num(pc.edadMin)-edad) : null;
  var faltaServicio = (servicio!==null) ? Math.max(0, num(pc.aniosMin)-servicio) : null;
  var derecho = cumpleEdad && cumpleServicio;
  return {edad:edad, servicio:servicio, cumpleEdad:cumpleEdad, cumpleServicio:cumpleServicio, derecho:derecho,
    pagas:pagas, mensualidad:mensualidad, importe:importe, lopaga:lopaga, faltaEdad:faltaEdad, faltaServicio:faltaServicio,
    sinDatos:(fNac?false:true)};
}
function makeConvenio(){
  /* base/antig = convenio (lo que cobra) · pdBase/pdAntig = pago delegado (lo que cubre el GV) · pd = ¿es categoría de pago delegado? */
  function c(id, nombre, base, antig, jor, pdBase, pdAntig, pd){ return {id:id, nombre:nombre, base:base, antig:antig, jornada:jor, pdBase:pdBase||0, pdAntig:pdAntig||0, pd:pd===true}; }
  return {
    anio:"2026",
    computoActivo:false, computoHoras:5, computoMult:4.5, computoBase:32,
    ssTrab:6.45, irpf:16, ssEmp:31.9, pagasExtra:2, tutoria:0,
    premio:{edadMin:55, aniosMin:20, pagasBase:4, aniosBase:20, quinquenio:5, pagaQuinquenio:1},
    categorias:[
      c("cv_inf2","Infantil 2 años",2941.98,52.79,32, 2941.98,49.49, true),
      c("cv_inf","Infantil 2º ciclo",2941.98,52.79,32, 2941.98,49.49, true),
      c("cv_pri","Primaria",2941.98,52.79,32, 2941.98,49.49, true),
      c("cv_esom","ESO · maestro",3402.62,64.86,32, 3124.99,49.49, true),
      c("cv_esol","ESO · licenciado",3402.62,64.86,32, 3402.61,59.16, true),
      c("cv_bach","Bachillerato",3402.62,64.86,32, 3402.61,59.16, true),
      c("cv_eae","EAE",2321.50,41.56,35, 2321.50,37.69, true),
      c("cv_teji","TEJI",2233.58,43.98,35, 2233.58,43.98, true),
      c("cv_tnd","Titulado no docente",3402.62,64.86,38, 0,0, false),
      c("cv_jefneg","Jefe de negociado",2209.05,44.32,38, 0,0, false),
      c("cv_ofcont","Oficial contable",2209.05,44.32,38, 0,0, false),
      c("cv_jefadm","Jefe de administración",2425.58,51.91,38, 0,0, false),
      c("cv_auxadm","Auxiliar de administración",2194.14,43.82,38, 0,0, false),
      c("cv_instr","Instructor",2326.13,42.52,38, 0,0, false),
      c("cv_of1","Oficial de 1ª",2302.65,43.82,38, 0,0, false),
      c("cv_of2","Oficial de 2ª",2043.34,43.82,38, 0,0, false),
      c("cv_cuid","Cuidador",1899.70,43.82,38, 0,0, false),
      c("cv_port","Portero",2050.97,43.82,38, 0,0, false),
      c("cv_limp","Empleado de limpieza",1914.14,43.82,38, 0,0, false),
      c("cv_mant","Empleado de mantenimiento",1899.70,43.82,38, 0,0, false)
    ],
    /* Pluses de cargo del pago delegado (mensuales) */
    cargos:[
      {id:"cc_dir_m", nombre:"Director (maestro)", plus:511.76, trienio:21.90},
      {id:"cc_dir_l", nombre:"Director (licenciado)", plus:755.10, trienio:32.04},
      {id:"cc_sub_m", nombre:"Subdirector (maestro)", plus:473.56, trienio:19.25},
      {id:"cc_sub_l", nombre:"Subdirector / J. Estudios (licenciado)", plus:639.46, trienio:28.14},
      {id:"cc_jef_m", nombre:"Jefe de Estudios (maestro)", plus:414.97, trienio:18.25},
      {id:"cc_dpt_m", nombre:"Jefe de Departamento (maestro)", plus:378.92, trienio:16.22},
      {id:"cc_dpt_l", nombre:"Jefe de Departamento (licenciado)", plus:533.69, trienio:22.83}
    ]
  };
}
/* Trienios cumplidos a fecha ref, desde la antigüedad de la persona */
function fechaContratoBase(p){
  var lst = (p && p.contratos) ? p.contratos : [];
  var base = lst.filter(function(k){ return (k.tipo||"")==="Contrato base" && k.desde; })
                .sort(function(a,b){ return String(a.desde).localeCompare(String(b.desde)); })[0];
  if(base) return base.desde;
  var ord = lst.filter(function(k){ return k.desde; }).sort(function(a,b){ return String(a.desde).localeCompare(String(b.desde)); })[0];
  return ord ? ord.desde : "";
}
function fechaAntiguedadEfectiva(p){
  if(p && p.fechaAntiguedad) return p.fechaAntiguedad;
  var fb = fechaContratoBase(p);
  if(fb) return fb;
  return (p && p.fechaInicio) || "";
}
function trieniosDe(p, fechaRef){
  if(p && num(p.trienios) > 0) return num(p.trienios);
  var ini = fechaAntiguedadEfectiva(p);
  if(!ini) return 0;
  var a = new Date(ini), b = new Date(fechaRef || hoyISO());
  if(isNaN(a.getTime()) || isNaN(b.getTime())) return 0;
  var anios = (b - a) / (1000*60*60*24*365.25);
  return Math.max(0, Math.floor(anios/3));
}
/* Nómina de una persona según convenio, prorrateada por sus horas de contrato */
function nominaDe(d, p, fechaRef){
  var CV = d.convenio;
  var cat = (CV.categorias||[]).filter(function(c){ return c.id === (p && p.categoriaConvenio); })[0];
  if(!cat) return null;
  var jor = num(cat.jornada) > 0 ? num(cat.jornada) : 32;
  var horas = horasContrato(p, fechaRef);
  if(horas === null) horas = jor;
  var frac = jor > 0 ? horas/jor : 1;
  var tri = trieniosDe(p, fechaRef);
  var base = num(cat.base) * frac;
  var antig = num(cat.antig) * tri * frac;
  var computo = 0;
  if(CV.computoActivo && num(CV.computoBase) > 0){
    computo = (num(cat.base)/num(CV.computoBase)) * num(CV.computoHoras) * num(CV.computoMult) * frac;
  }
  /* plus de cargo (pago delegado) */
  var cc = (CV.cargos||[]).filter(function(x){ return x.id === (p && p.cargoConvenio); })[0];
  var plusCargo = cc ? (num(cc.plus) + num(cc.trienio)*tri) : 0;
  var bruta = base + antig + computo + plusCargo;
  /* pago delegado: lo que cubre el GV; el ajuste lo paga el centro */
  var pdBase = cat.pd ? num(cat.pdBase)*frac : 0;
  var pdAntig = cat.pd ? num(cat.pdAntig)*tri*frac : 0;
  var pdCargo = cat.pd ? plusCargo : 0;
  var pd = pdBase + pdAntig + pdCargo;
  var ajuste = Math.max(0, bruta - pd);
  return { cat:cat, jornada:jor, horas:horas, frac:frac, trienios:tri, base:base, antig:antig, computo:computo,
    plusCargo:plusCargo, cargoConv:cc, bruta:bruta, pd:pd, pdBase:pdBase, pdAntig:pdAntig, ajuste:ajuste, esPD:cat.pd===true };
}
/* Plus de dirección de una persona, desde la calculadora de Pluses */
function plusDirDe(d, p){
  if(!p || !p.cargoDirectivo || !d.pluses || !Array.isArray(d.pluses.cargos)) return 0;
  var cd = (d.cargosDirectivos||[]).filter(function(o){ return o.id===p.cargoDirectivo; })[0];
  if(!cd) return 0;
  var nomCargo = nombreDe(cd).toLowerCase();
  var R = plusesCalc(d.pluses);
  var val = 0;
  d.pluses.cargos.forEach(function(cg, ci){
    if(val) return;
    var nom = (cg.nombre||"").toLowerCase();
    var car = (cg.cargo||"").toLowerCase();
    var coincideNombre = nom && ((p.apellidos||"").toLowerCase() && nom.indexOf((p.apellidos||"").toLowerCase())>=0);
    var coincideCargo = car && nomCargo && (car===nomCargo || car.indexOf(nomCargo)>=0 || nomCargo.indexOf(car)>=0);
    if((coincideNombre || coincideCargo) && R.rows[ci]) val = R.rows[ci].total;
  });
  return val;
}
/* Nómina completa: convenio + complementos - retenciones, y coste para el centro */
function nominaCompleta(d, p, extra){
  var n = nominaDe(d, p);
  if(!n) return null;
  var CV = d.convenio;
  var ex = extra || {};
  var tutoria = (p.tutor && !ex.sinTutoria) ? num(CV.tutoria) : 0;
  var plusDir = (ex.plusDir !== undefined) ? num(ex.plusDir) : plusDirDe(d, p);
  var otros = num(ex.otros);
  var bruta = n.bruta + tutoria + plusDir + otros;
  var pagaExtra = bruta * num(CV.pagasExtra) / 12;
  var irpfPct = (num(p.irpfPersonal) > 0) ? num(p.irpfPersonal) : num(CV.irpf);
  var retSS = (bruta + pagaExtra) * num(CV.ssTrab) / 100;
  var retIRPF = bruta * irpfPct / 100;
  var liquido = bruta - retSS - retIRPF;
  var ssEmp = (bruta + pagaExtra) * num(CV.ssEmp) / 100;
  var costeMes = bruta + ssEmp;
  /* Coste REAL del centro: lo que no cubre el pago delegado (+ complementos propios), con su SS */
  var propioBruto = n.ajuste + tutoria + plusDir + otros;
  var propioSS = propioBruto * (1 + num(CV.pagasExtra)/12) * num(CV.ssEmp) / 100;
  var costeCentro = propioBruto + propioSS;
  return Object.assign({}, n, {tutoria:tutoria, plusDir:plusDir, otros:otros, brutaTotal:bruta, pagaExtra:pagaExtra,
    irpfPct:irpfPct, retSS:retSS, retIRPF:retIRPF, liquido:liquido, ssEmp:ssEmp, costeMes:costeMes, costeAnio:costeMes*14,
    propioBruto:propioBruto, propioSS:propioSS, costeCentro:costeCentro, costeCentroAnio:costeCentro*14});
}

/* Ingresos del GV: unidades concertadas × módulo de cada nivel */
function ingresosGV(d){
  var MO = d.modulos;
  var byId = {}; (MO.lista||[]).forEach(function(m){ byId[m.id]=m; });
  var filas = [];
  var T = {doc:0, noDoc:0, educ:0, func:0, rir:0, total:0, pd:0, caja:0};
  (d.categorias||[]).forEach(function(c){
    var m = byId[c.moduloId];
    if(!m) return;
    var u = num(c.unidades);
    if(u <= 0) return;
    var f = {cat:c, mod:m, unidades:u,
      doc:num(m.doc)*u, noDoc:num(m.noDoc)*u, educ:num(m.educ)*u, func:num(m.func)*u, rir:num(m.rir)*u};
    f.total = f.doc + f.noDoc + f.educ + f.func + f.rir;
    var des = MO.destino;
    f.pd = (des.doc==="pd"?f.doc:0) + (des.noDoc==="pd"?f.noDoc:0) + (des.educ==="pd"?f.educ:0) + (des.func==="pd"?f.func:0) + (des.rir==="pd"?f.rir:0);
    f.caja = f.total - f.pd;
    ["doc","noDoc","educ","func","rir","total","pd","caja"].forEach(function(k){ T[k] += f[k]; });
    filas.push(f);
  });
  return {filas:filas, tot:T};
}

/* Totales de subvenciones: lo que se cuenta es lo confirmado si lo hay; si no, lo previsto */
function subvTotales(d){
  var lst = d.subvenciones || [];
  var T = {previsto:0, confirmado:0, cuenta:0, riesgo:0};
  lst.forEach(function(s){

    T.previsto += pv;

/* Dado un tipo de jornada y un % de contrato, desglosa las horas */
function tipoJornadaDe(d, cat){
  if(!cat) return null;
  var J = d.jornadas; if(!J) return null;
  var jid = cat.jornadaId;
  if(!jid){
    /* fallback: por la categoría de convenio mapeada, o por etapa */
    return null;
  }
  return (J.tipos||[]).filter(function(t){ return t.id===jid; })[0] || null;
}
/* Horas "base" de una categoría = la unidad con la que se mide un tramo.
   Docente -> lectivas del tipo · EAE/PAS/TEJI -> jornada del tipo. Deriva del tipo de jornada; si no hay, usa horasBase literal (retrocompat). */
function horasBaseDe(d, cat){
  if(!cat) return 0;
  var tj = tipoJornadaDe(d, cat);
  if(tj){
    return (tj.modo==="docente") ? num(tj.lectivas) : num(tj.jornada);
  }
  return num(cat.horasBase);
}
function desgloseJornada(tj, pct){
  var p = num(pct)/100;
  if(!tj) return {modo:"?", jornada:0, lectivas:0, comple:0, personal:0, coord:0, total:0};
  if(tj.modo==="docente"){
    var lect = num(tj.lectivas)*p;
    var jorn = num(tj.jornada)*p;
    var comple = jorn - lect;
    var pers = num(tj.personal)*p;
    return {modo:"docente", jornada:jorn, lectivas:lect, comple:comple, personal:pers, coord:comple-pers, total:jorn,
      lectivasBase:num(tj.lectivas), refPct:p};
  }
  if(tj.modo==="apoyo"){
    var jorn2 = num(tj.jornada)*p;
    var completa = p>=0.999;
    var pers2 = completa ? num(tj.personalCompleta) : num(tj.personalParcial);
    return {modo:"apoyo", jornada:jorn2, lectivas:0, comple:0, personal:pers2, coord:0, total:jorn2, completa:completa};
  }
  var jorn3 = num(tj.jornada)*p;
  var pers3 = num(tj.personal||0)*p;
  return {modo:"simple", jornada:jorn3, lectivas:0, comple:0, personal:pers3, coord:0, total:jorn3};
}
/* Semáforo docente: compara lectivas asignadas con el máximo del convenio (en proporción) */
function semaforoLectivas(asignadas, maximo){
  if(maximo<=0) return {color:"", txt:""};
  var dif = asignadas - maximo;
  if(dif > 0.01) return {color:"peligro", txt:"Se pasa del convenio (+"+r2(dif)+" h)"};
  if(dif < -0.01) return {color:"ok", txt:"Por debajo del convenio ("+r2(dif)+" h)"};
  return {color:"aviso", txt:"Ajustado al convenio"};
}

/* Reparte un importe entre las partidas, por % o por pesos */
function repartoCalc(rep, importe){
  var ps = (rep && rep.partidas) ? rep.partidas : [];
  var sumaPeso = ps.reduce(function(a,p){ return a + num(p.valor); }, 0);
  var filas = ps.map(function(p){
    var pct = (rep.modo === "pesos")
      ? (sumaPeso > 0 ? num(p.valor)/sumaPeso*100 : 0)
      : num(p.valor);
    return {id:p.id, nombre:p.nombre, valor:num(p.valor), pct:pct, anio:importe*pct/100, mes:importe*pct/100/12};
  });
  var sumaPct = filas.reduce(function(a,f){ return a + f.pct; }, 0);
  var asignado = filas.reduce(function(a,f){ return a + f.anio; }, 0);
  return { filas:filas, sumaPct:sumaPct, asignado:asignado, resto:importe - asignado };
}

function plusesCalc(pl){
  var totEt = pl.etapas.map(function(e){ return num(e.unidades)*num(e.euros); });
  var grand = totEt.reduce(function(a,b){ return a+b; }, 0);
  var denom = pl.etapas.map(function(e, ei){ return pl.cargos.reduce(function(a,c){ return a + num((c.pres||[])[ei])*num(c.n); }, 0); });
  var rows = pl.cargos.map(function(c){
    var eu = pl.etapas.map(function(e, ei){ var dd=denom[ei]; return dd>0 ? totEt[ei]*(num(c.n)*num((c.pres||[])[ei]))/dd : 0; });
    var total = eu.reduce(function(a,b){ return a+b; }, 0);
    var acuerdo = grand*num(c.n)/100;
    return { eu:eu, total:total, acuerdo:acuerdo, dif:total-acuerdo };
  });
  var sumEt = pl.etapas.map(function(e, ei){ return rows.reduce(function(a,r){ return a+r.eu[ei]; }, 0); });
  return { totEt:totEt, grand:grand, denom:denom, rows:rows, sumEt:sumEt };
}

/* ===== SISTEMA DE CURSOS ACADÉMICOS ===== */
var CLAVES_CURSO = ["personas","tramos","incidencias","subvenciones","versiones","cambios","rptExtra"];
function migrarACursos(d){
  if(Array.isArray(d.cursos) && d.cursos.length) return d; /* ya migrado */
  /* extraer unidades de las categorías -> tabla del curso */
  var unidades = {};
  (d.categorias||[]).forEach(function(c){ if(num(c.unidades)!==0) unidades[c.id]=num(c.unidades); });
  var curso = {
    id: "curso_" + (d.curso||"2026-2027").replace(/[^0-9]/g,"_"),
    nombre: d.curso || "2026-2027",
    estado: "abierto",
    creado: hoyISO(),
    unidades: unidades,
    personas: d.personas||[], tramos: d.tramos||[], incidencias: d.incidencias||[],
    subvenciones: d.subvenciones||[], versiones: d.versiones||[], cambios: d.cambios||[],
    reaperturas: []
  };
  d.cursos = [curso];
  d.cursoActivo = curso.id;
  return d;
}
function cursoActivoDe(d){
  var lst = d.cursos || [];
  var c = lst.filter(function(x){ return x.id===d.cursoActivo; })[0];
  return c || lst[0] || null;
}
/* Proyecta el curso activo a las claves de primer nivel que espera el resto del código */
function proyectarCurso(d){
  var c = cursoActivoDe(d);
  if(!c) return d;
  CLAVES_CURSO.forEach(function(k){ d[k] = c[k] || []; });
  /* unidades: reinyectar en las categorías para que el montaje las vea */
  var un = c.unidades || {};
  (d.categorias||[]).forEach(function(cat){ cat.unidades = num(un[cat.id]||0); });
  d.cursoCerrado = (c.estado === "cerrado");
  d.cursoNombre = c.nombre;
  return d;
}
/* Recoge los cambios de las claves proyectadas de vuelta al curso activo (antes de guardar) */
function recogerCurso(d){
  var c = cursoActivoDe(d);
  if(!c) return d;
  CLAVES_CURSO.forEach(function(k){ c[k] = d[k] || []; });
  /* recoger unidades desde las categorías */
  var un = {};
  (d.categorias||[]).forEach(function(cat){ if(num(cat.unidades)!==0) un[cat.id]=num(cat.unidades); });
  c.unidades = un;
  return d;
}

function siglaAuto(p){

/* Etapas del RPT en su orden OFICIAL fijo */
var RPT_ETAPAS = [
  {id:"EI1", nombre:"EDUCACIÓN INFANTIL I"},
  {id:"EI2", nombre:"EDUCACIÓN INFANTIL II"},
  {id:"EP",  nombre:"EDUCACIÓN PRIMARIA"},
  {id:"ESO", nombre:"EDUCACIÓN SECUNDARIA"},
  {id:"PAS", nombre:"PAS"},
  {id:"EAE", nombre:"EAE"}
];
/* Clasifica una categoría en una etapa del RPT */
function etapaDeCategoria(c){
  if(!c) return "PAS";
  var n=(c.nombreEs||"")+" "+(c.nombreEu||"");
  var g=c.grupoCuadre||"";
  /* TEJI = Infantil I (técnicas de jardín de infancia) */
  if(/TEJI|jard[ií]n/i.test(n)) return "EI1";
  /* Aulas de infantil (2 años, E.I., HH…) = Infantil II */
  if(g==="EAE") return "EAE";
  if(g==="EI") return "EI2";
  if(g==="EP") return "EP";
  if(g==="ESO") return "ESO";
  if(g==="EE"){ if(/HH|infantil|EI/i.test(n)) return "EI2"; return (c.etapaReparto==="secundaria")?"ESO":"EP"; }
  if(g==="OTROS"){ if(/HH|infantil/i.test(n)) return "EI2"; return (c.etapaReparto==="secundaria")?"ESO":"EP"; }
  if(g==="RESTO"){ if(/TEJI/i.test(n)) return "EI1"; if(/PAS/i.test(n)) return "PAS"; return (c.etapaReparto==="secundaria")?"ESO":(c.etapaReparto==="primaria"?"EP":"PAS"); }
  return "PAS";
}
/* A qué etapa del RPT pertenece una persona. Respeta el override manual si existe. */
function etapaRptDe(d, p){
  /* 1) override manual guardado en rptExtra */
  var ex = rptExtraDe(d, p.id);
  if(ex.etapa) return ex.etapa;
  /* 2) automático: la etapa donde tiene más horas */
  var cats={}; (d.categorias||[]).forEach(function(c){ cats[c.id]=c; });
  var conteo={};
  (d.tramos||[]).forEach(function(t){
    if(t.personaId!==p.id) return;
    var c=cats[t.categoriaId]; if(!c) return;
    var e=etapaDeCategoria(c);
    conteo[e]=(conteo[e]||0)+num(t.porcentaje);
  });
  var mejor="", max=-1;
  Object.keys(conteo).forEach(function(g){ if(conteo[g]>max){ max=conteo[g]; mejor=g; } });
  /* 3) sin tramos: deducir por la categoría de convenio (su nombre dice la etapa) */
  if(!mejor && p.categoriaConvenio){
    var cat = ((d.convenio&&d.convenio.categorias)||[]).filter(function(x){ return x.id===p.categoriaConvenio; })[0];
    var nom = cat ? (cat.nombre||"") : "";
    mejor = etapaPorNombreConvenio(nom);
  }
  return mejor || "PAS";
}
/* Deduce la etapa del RPT a partir del nombre de una categoría de convenio */
function etapaPorNombreConvenio(nom){
  var n = (nom||"").toLowerCase();
  if(!n) return "";
  if(/teji|jard/.test(n)) return "EI1";
  if(/infantil|inf\b|2 años|2º ciclo/.test(n)) return "EI2";
  if(/primaria/.test(n)) return "EP";
  if(/eso|secundaria|bachiller|bach/.test(n)) return "ESO";
  if(/eae|apoyo educativo/.test(n)) return "EAE";
  /* puestos claramente no docentes -> PAS */
  if(/admin|contable|negociado|auxiliar|instructor|cuidador|portero|limpieza|mantenimiento|titulado no docente|recep|secret/.test(n)) return "PAS";
  return "";
}
/* Titulación (texto) de una persona, desde Formación */
function rptTitulacion(p){
  var F=p.formacion||{};
  var acad=F.academica||[];
  if(acad.length){ return acad.map(function(a){ return a.titulo; }).filter(Boolean).join("; "); }

/* Perfil lingüístico (texto) desde Formación: "Euskera C1 / Inglés B2" */
function rptPerfilLinguistico(p){

/* "Conocimientos / metodologías a considerar" desde Formación (DECA, digital, metodología) */
function rptConocimientos(p){
  var F=p.formacion||{};
  var out=[];
  if(F.deca) out.push("DECA");
  if(F.digital) out.push(F.digital);

/* Datos extra del RPT guardados por persona en el curso (materia/curso y evolución) */
function rptExtraDe(d, pid){

/* % de jornada de una persona para el RPT, con respaldo para PAS y no docentes */
function pctJornadaRpt(d, p){
  var fref = periodoCurso(d);
  /* 1) intento normal (docentes, EAE, TEJI: los que están en mapaConvenio) */
  var jp = jornadaPersona(d, p, fref);
  if(jp && !jp.vacio && num(jp.pct)>0) return Math.round(jp.pct);
  /* 2) respaldo: horas de contrato / jornada del tipo PAS (para no docentes sin mapeo) */
  var hc = horasContrato(p, fref);
  if(hc && hc>0){
    var J = d.jornadas;
    /* jornada de referencia: la del tipo PAS si existe, si no 38 */
    var jref = 38;
    if(J && J.tipos){ var tpas = J.tipos.filter(function(t){ return t.id==="jt_pas" || /pas/i.test(t.nombre||""); })[0]; if(tpas && num(tpas.jornada)>0) jref = num(tpas.jornada); }

/* Construye las filas del RPT agrupadas por etapa (orden oficial) */
function construirRPT(d, orden){
  var grupos = RPT_ETAPAS.map(function(e){ return {etapa:e, filas:[]}; });
  var idxEtapa={}; RPT_ETAPAS.forEach(function(e,i){ idxEtapa[e.id]=i; });
  /* IDs de personas que son SUSTITUTAS: no van al RPT (solo el titular) */
  var sustitutos={};
  (d.incidencias||[]).forEach(function(inc){ if(inc.sustitutoId && inc.aplicada){ sustitutos[inc.sustitutoId]=1; } });
  (d.personas||[]).forEach(function(p){
    if(sustitutos[p.id]) return;
    var eid = etapaRptDe(d, p);
    var g = grupos[idxEtapa[eid]!==undefined ? idxEtapa[eid] : (grupos.length-1)];
    var ex = rptExtraDe(d, p.id);
    g.filas.push({
      persona:p,
      pct: pctJornadaRpt(d, p),
      titulacion: rptTitulacion(p),
      perfil: rptPerfilLinguistico(p),
      conocimientos: rptConocimientos(p),
      materia: ex.materia||"",
      curso: ex.curso||""
    });
  });
  /* ordenación interna configurable (las etapas van siempre en su orden oficial fijo) */
  var ord = orden || "apellido";
  grupos.forEach(function(g){
    g.filas.sort(function(a,b){
      if(ord==="jornada"){ return num(b.pct)-num(a.pct); }        /* mayor jornada primero */
      if(ord==="nombre"){ return cmpPersona(a.persona, b.persona); }
      if(ord==="materia"){ return cmpTexto(a.materia||"~", b.materia||"~"); }
      /* por defecto: apellido */
      return cmpPersona(a.persona, b.persona);
    });
  });
  return grupos;
}

function sinAcentos(x){ return String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function buscarGlobal(d, q){
  var query = sinAcentos(q).trim();
  if(query.length<2) return {personas:[], categorias:[], secciones:[]};
  var res = {personas:[], categorias:[], secciones:[]};
  /* personas por nombre, apellido o sigla */
  (d.personas||[]).forEach(function(p){
    var texto = sinAcentos((p.apellidos||"")+" "+(p.nombre||"")+" "+siglaDe(p));
    if(texto.indexOf(query)>=0) res.personas.push(p);
  });
  /* categorías por nombre */
  (d.categorias||[]).forEach(function(c){
    var texto = sinAcentos((c.nombreEs||"")+" "+(c.nombreEu||"")+" "+(c.grupoCuadre||""));
    if(texto.indexOf(query)>=0) res.categorias.push(c);
  });
  /* secciones por palabra clave */
  INDICE_BUSQUEDA.forEach(function(sec){
    var hit = sinAcentos(sec.seccion).indexOf(query)>=0 || sec.claves.some(function(k){ return sinAcentos(k).indexOf(query)>=0 || query.indexOf(sinAcentos(k))>=0; });
    if(hit) res.secciones.push(sec);
  });
  return res;
}

}

/* ---------- hash de contraseña (SHA-256 con fallback) ---------- */
function sha256(txt){
  return new Promise(function(resolve){
    try{
      if(window.crypto && window.crypto.subtle && window.crypto.subtle.digest){
        var enc = new TextEncoder().encode(txt);
        window.crypto.subtle.digest("SHA-256", enc).then(function(buf){
          var arr = Array.prototype.slice.call(new Uint8Array(buf));
          resolve(arr.map(function(b){ return ("00"+b.toString(16)).slice(-2); }).join(""));
        }, function(){ resolve(weakHash(txt)); });
        return;
      }
    }catch(e){}
    resolve(weakHash(txt));
  });
}
function weakHash(txt){
  var h=0,i; for(i=0;i<txt.length;i++){ h=((h<<5)-h+txt.charCodeAt(i))|0; }
  return "weak:"+(h>>>0).toString(16);
}

/* ---------- cuadre: financiadas por grupo ---------- */
function financiadasPorGrupo(d, cats){
  var g = {};
  cats.forEach(function(c){
    if(!c.cuadra) return;
    var fin = num(c.unidades)*num(c.ratioProfAula)*horasBaseDe(d, c);
    g[c.grupoCuadre] = (g[c.grupoCuadre]||0) + fin;
  });
  return g;
}

  var personas = (d.personas||[]).slice().sort(cmpPersona);

  function toggleBaja(pid){ var b=Object.assign({}, bajas); b[pid]=!b[pid]; setBajas(b); }
  function contarTramos(pid){ return (d.tramos||[]).filter(function(t){ return t.personaId===pid; }).length; }
  function horasDe(pid){
    var cats={}; (d.categorias||[]).forEach(function(c){ cats[c.id]=c; });
    return (d.tramos||[]).filter(function(t){ return t.personaId===pid; })
      .reduce(function(a,t){ var c=cats[t.categoriaId]; return a + (c?num(t.porcentaje)/100*horasBaseDe(d,c):0); }, 0);

      incidencias: (d.incidencias||[]).filter(function(x){ return !setB[x.personaId] && !setB[x.sustitutoId]; })

        <button style={S.btnPri} onClick={aplicar}>{nBajas>0 ? ("Aplicar "+nBajas+" baja(s) y continuar") : "Todo continúa, terminar revisión"}</button>
      </div>

        <div className="tabla-scroll"><table style={{fontSize:13}}>

          <tbody>

                  <td style={{color:C.secundario}}>{p.categoriaConvenio? (d.convenio.categorias.filter(function(x){ return x.id===p.categoriaConvenio; })[0]||{}).nombre : <span style={{color:C.avisoText}}>sin categoría</span>}</td>
                  <td className="num">{contarTramos(p.id)}</td>
                  <td className="num">{r2(horasDe(p.id))}</td>
                  <td style={{textAlign:"center"}}>
                    <button style={seVa?Object.assign({}, S.btn,{borderColor:C.peligro, color:C.peligroText}):S.btn} onClick={function(){ toggleBaja(p.id); }}>
                      {seVa?"Se va":"Sigue"}
                    </button>
                  </td>

              );

    </div>
  );
}

/* ----- Cursos académicos ----- */
function CursosTab(props){
  var d = props.data;
  var cursos = d.cursos || [];
  var activo = cursoActivoDe(d);
  var [wizard, setWizard] = useState(0); /* 0=cerrado, 1=resumen, 2=copia, 3=confirmar */
  var [nuevoNombre, setNuevoNombre] = useState("");
  var [copiaHecha, setCopiaHecha] = useState(false);

  function descargarCopia(){
    /* copia de seguridad del estado completo antes de cerrar */
    try{
      var blob = new Blob([JSON.stringify(d, null, 1)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "copia_seguridad_"+(activo?activo.nombre:"curso")+"_"+hoyISO()+".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(e){ props.toast("No se pudo descargar la copia","error"); }
  }

  function siguienteNombre(nom){
    var m = String(nom||"").match(/(\d{4})\D+(\d{4})/);
    if(m){ return (parseInt(m[1],10)+1)+"-"+(parseInt(m[2],10)+1); }
    return "";
  }

  function abrirWizard(){
    setNuevoNombre(siguienteNombre(activo.nombre));
    setCopiaHecha(false);
    setWizard(1);
  }
  function cerrarYAbrir(){
    var nuevoNom = (nuevoNombre||"").trim();
    if(!nuevoNom){ props.toast("Pon un nombre para el curso nuevo","error"); return; }
    if(cursos.some(function(c){ return (c.nombre||"").trim()===nuevoNom; })){ props.toast("Ya existe un curso con ese nombre","error"); return; }
    /* congelar el actual */
    var cursosNuevos = cursos.map(function(c){ return c.id===activo.id ? Object.assign({}, c, {estado:"cerrado", cerrado:hoyISO()}) : c; });
    /* crear el siguiente copiando personas, unidades y reparto -sin incidencias- */
    var nuevoId = "curso_" + nuevoNom.replace(/[^0-9]/g,"_") + "_" + Date.now();
    var nuevo = {
      id: nuevoId, nombre: nuevoNom, estado:"abierto", creado: hoyISO(),
      unidades: Object.assign({}, activo.unidades),
      personas: JSON.parse(JSON.stringify(activo.personas||[])),
      tramos: JSON.parse(JSON.stringify(activo.tramos||[])),
      incidencias: [],           /* las incidencias son de su curso */
      subvenciones: JSON.parse(JSON.stringify(activo.subvenciones||[])),
      versiones: [], cambios: [], reaperturas: [],
      derivadoDe: activo.id,
      revisarPlantilla: true
    };
    cursosNuevos.push(nuevo);
    var d2 = Object.assign({}, d, {cursos:cursosNuevos, cursoActivo:nuevoId});
    d2 = proyectarCurso(d2);
    props.setData(d2);
    setWizard(0);
    props.toast("Curso "+nuevoNom+" abierto. Revisa altas y bajas.","ok");
  }

  function reabrir(cid){
    var c = cursos.filter(function(x){ return x.id===cid; })[0];
    if(!c) return;
    if(!window.confirm("¿Reabrir el curso "+c.nombre+"? Volverá a ser editable. Quedará registrado que se reabrió.")) return;
    var cursosNuevos = cursos.map(function(x){ return x.id===cid ? Object.assign({}, x, {estado:"abierto", reaperturas:(x.reaperturas||[]).concat([hoyISO()])}) : x; });
    props.setData(Object.assign({}, d, {cursos:cursosNuevos}));
    props.toast("Curso "+c.nombre+" reabierto","ok");
  }

  return (
    <div>
      <h4 style={{fontSize:14, color:C.secundario, textTransform:"uppercase", letterSpacing:".04em", marginBottom:4}}>Cursos académicos</h4>
      <p style={{margin:"0 0 16px", color:C.secundario, fontSize:J, maxWidth:760}}>Cada curso guarda su plantilla, reparto, incidencias y subvenciones. Al cerrar un curso queda como histórico (solo lectura) y se abre el siguiente heredando personas, unidades y reparto.</p>

      <div style={Object.assign({}, S.card, {padding:0, overflow:"hidden", marginBottom:20, maxWidth:640})}>
        <div className="tabla-scroll"><table>
          <thead><tr><th>Curso</th><th>Estado</th><th className="num">Personas</th><th>Creado</th><th style={{width:120}}></th></tr></thead>
          <tbody>
            {cursos.map(function(cu){
              var esActivo = cu.id===d.cursoActivo;
              return (
                <tr key={cu.id} style={esActivo?{background:C.infoBg}:null}>
                  <td style={{fontWeight:700, color:C.titulo}}>{cu.nombre}{esActivo?<span style={{fontSize:11, color:C.azul, fontWeight:400}}> · activo</span>:null}</td>
                  <td>{cu.estado==="cerrado" ? <span style={{color:C.avisoText, fontWeight:600}}>🔒 cerrado</span> : <span style={{color:C.okText, fontWeight:600}}>abierto</span>}{(cu.reaperturas&&cu.reaperturas.length)?<span style={{fontSize:11, color:C.secundario}}> · reabierto {cu.reaperturas.length}×</span>:null}</td>
                  <td className="num">{(cu.personas||[]).length}</td>
                  <td style={{fontSize:12, color:C.secundario}}>{cu.creado||"—"}</td>
                  <td>
                    {!esActivo ? <button style={S.btn} onClick={function(){ props.cambiarCurso(cu.id); }}>Ir</button> : null}
                    {cu.estado==="cerrado" ? <button style={Object.assign({}, S.btn, {marginLeft:6})} onClick={function(){ reabrir(cu.id); }}>Reabrir</button> : null}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table></div>
      </div>

      {activo && activo.estado==="abierto" ? (
        <div style={Object.assign({}, S.card, {padding:"16px 18px", maxWidth:640, borderColor:C.aviso})}>
          <div style={{fontWeight:700, color:C.titulo, fontSize:14, marginBottom:6}}>Cerrar el curso {activo.nombre} y abrir el siguiente</div>
          <p style={{fontSize:J, color:C.secundario, margin:"0 0 12px"}}>
            El curso {activo.nombre} quedará como histórico (solo lectura). Se abrirá el siguiente heredando personas, unidades y reparto. Un asistente te guía en tres pasos, con copia de seguridad obligatoria.
          </p>
          <button style={Object.assign({}, S.btnPri, {background:C.aviso})} onClick={abrirWizard}>Cerrar curso y abrir el siguiente…</button>
        </div>
      ) : null}

      {wizard>0 ? (
        <div className="no-print" onClick={function(){ setWizard(0); }} style={{position:"fixed", inset:0, background:"rgba(30,25,20,.5)", zIndex:220, display:"flex", alignItems:"center", justifyContent:"center", padding:20}}>
          <div onClick={function(e){ e.stopPropagation(); }} style={{background:"#fff", borderRadius:12, maxWidth:560, width:"100%", padding:"22px 24px", boxShadow:"0 18px 50px rgba(0,0,0,.3)"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4}}>
              <h3 style={{margin:0, fontFamily:"'Source Serif 4',serif", color:C.titulo, fontSize:P}}>Cerrar curso · paso {wizard} de 3</h3>
              <button style={S.btn} onClick={function(){ setWizard(0); }}>Cancelar</button>
            </div>
            <div style={{height:4, background:C.panelBorde2, borderRadius:3, marginBottom:18, overflow:"hidden"}}>
              <div style={{height:"100%", width:(wizard/3*100)+"%", background:C.azul, borderRadius:3}}></div>
            </div>

            {wizard===1 ? (
              <div>
                <div style={{fontWeight:700, color:C.titulo, marginBottom:10}}>Qué va a pasar</div>
                <div style={{background:C.superficie, border:"1px solid "+C.borde, borderRadius:8, padding:"12px 14px", marginBottom:14, fontSize:13, lineHeight:1.7}}>
                  <div>El curso <b>{activo.nombre}</b> se cerrará (histórico, solo lectura).</div>
                  <div style={{marginTop:8, color:C.secundario}}>Se copiarán al curso nuevo:</div>
                  <div style={{display:"flex", gap:16, flexWrap:"wrap", marginTop:4}}>
                    <span>👤 <b>{(activo.personas||[]).length}</b> personas</span>
                    <span>🕒 <b>{(activo.tramos||[]).length}</b> asignaciones</span>
                    <span>🏫 <b>{Object.keys(activo.unidades||{}).length}</b> categorías con unidades</span>
                    <span>💶 <b>{(activo.subvenciones||[]).length}</b> subvenciones</span>
                  </div>
                  <div style={{marginTop:8, color:C.avisoText}}>NO se copiarán: las <b>{(activo.incidencias||[]).length}</b> incidencias (son propias de cada curso) ni las versiones.</div>
                </div>
                <label style={S.label}>Nombre del curso nuevo</label>
                <input style={S.input} value={nuevoNombre} onChange={function(e){ setNuevoNombre(e.target.value); }} placeholder="p. ej. 2027-2028" />
                {cursos.some(function(c){ return (c.nombre||"").trim()===(nuevoNombre||"").trim() && (nuevoNombre||"").trim(); }) ? <div style={{fontSize:12, color:C.peligroText, marginTop:4}}>⚠ Ya existe un curso con ese nombre.</div> : null}
                <div style={{display:"flex", justifyContent:"flex-end", gap:10, marginTop:18}}>
                  <button style={S.btnPri} disabled={!(nuevoNombre||"").trim()} onClick={function(){ if((nuevoNombre||"").trim()) setWizard(2); }}>Siguiente →</button>
                </div>
              </div>
            ) : null}

            {wizard===2 ? (
              <div>
                <div style={{fontWeight:700, color:C.titulo, marginBottom:10}}>Copia de seguridad</div>
                <p style={{fontSize:13, color:C.texto, lineHeight:1.6, marginBottom:14}}>Antes de cerrar, descarga una copia completa de tus datos. Si algo saliera mal, podrías recuperarlo importando este archivo.</p>
                <button style={Object.assign({}, S.btnPri, {marginBottom:14})} onClick={function(){ descargarCopia(); setCopiaHecha(true); }}>⬇ Descargar copia de seguridad</button>
                <label style={{display:"flex", alignItems:"center", gap:8, fontSize:13, color:C.titulo, cursor:"pointer"}}>
                  <input type="checkbox" checked={copiaHecha} onChange={function(e){ setCopiaHecha(e.target.checked); }} />
                  He descargado y guardado la copia de seguridad
                </label>
                <div style={{display:"flex", justifyContent:"space-between", gap:10, marginTop:18}}>
                  <button style={S.btn} onClick={function(){ setWizard(1); }}>← Atrás</button>
                  <button style={S.btnPri} disabled={!copiaHecha} onClick={function(){ if(copiaHecha) setWizard(3); }}>Siguiente →</button>
                </div>
              </div>
            ) : null}

            {wizard===3 ? (
              <div>
                <div style={{fontWeight:700, color:C.peligroText, marginBottom:10}}>⚠ Confirmación final</div>
                <div style={{background:C.peligroBg, border:"1px solid "+C.peligro, borderRadius:8, padding:"12px 14px", marginBottom:16, fontSize:13, lineHeight:1.6, color:C.peligroText}}>
                  Se cerrará <b>{activo.nombre}</b> (quedará solo lectura) y se creará <b>{nuevoNombre}</b> con las {(activo.personas||[]).length} personas y su reparto. Esto reorganiza tus datos. Podrás reabrir el curso si hace falta.
                </div>
                <div style={{display:"flex", justifyContent:"space-between", gap:10}}>
                  <button style={S.btn} onClick={function(){ setWizard(2); }}>← Atrás</button>
                  <button style={Object.assign({}, S.btnPri, {background:C.peligro})} onClick={cerrarYAbrir}>Cerrar {activo.nombre} y abrir {nuevoNombre}</button>
                </div>
              </div>
            ) : null}
          </div>
        </div>
      ) : null}
    </div>
  );
}

/* ----- Categorías (edición en línea) ----- */
function CategoriasTab(props){
  var d = props.data;
  function update(id, campo, valor){
    var cats = d.categorias.map(function(c){
      if(c.id!==id) return c;
      var nc = Object.assign({}, c);
      nc[campo] = valor;
      return nc;
    });
    props.setData(Object.assign({}, d, {categorias:cats}));
  }
  function add(){
    var nc = {id:uid("cat"), nombreEs:"Nueva categoría", nombreEu:"Kategoria berria", tipo:"docente", ratioProfAula:1, horasBase:23,
      unidades:0, grupoCuadre:"OTROS", cuadra:true, fuenteSugerida:"", moduloId:"", labPermitidas:[]};
    props.setData(Object.assign({}, d, {categorias:d.categorias.concat([nc])}));
    props.toast("Categoría añadida");
  }
  function del(id){
    var c = d.categorias.find(function(x){ return x.id===id; });
    var nT = d.tramos.filter(function(t){ return t.categoriaId===id; }).length;
    var msg = "¿Eliminar la categoría \"" + nombreDe(c) + "\"?";
    if(nT) msg += "\n\nSe borrarán también sus " + nT + " asignación(es) de personas.";
    if(!window.confirm(msg)) return;
    props.setData(Object.assign({}, d, {
      categorias: d.categorias.filter(function(x){ return x.id!==id; }),
      tramos: d.tramos.filter(function(t){ return t.categoriaId!==id; }),
      incidencias: (d.incidencias||[]).map(function(x){ return x.categoriaId===id ? Object.assign({}, x, {categoriaId:""}) : x; })
    }));
    props.toast("Categoría eliminada", "info");
  }
  var grupos = financiadasPorGrupo(d, d.categorias);
  var totalFin = Object.keys(grupos).reduce(function(a,k){ return a+grupos[k]; }, 0);

  return (
    <div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:12}}>
        <div>
          <h3 style={{fontSize:P}}>Categorías y ratios</h3>
          <p style={{margin:"4px 0 0", color:C.secundario, fontSize:K}}>
            Horas financiadas = unidades × ratio × horas base. Edita cualquier celda; se guarda solo.
          </p>
        </div>
        <button style={S.btnPri} onClick={add}>+ Categoría</button>
      </div>

      <div style={Object.assign({}, S.card, {padding:0, overflow:"hidden"})}>
        <div style={{overflowX:"auto"}}>
        <div className="tabla-scroll"><table style={{minWidth:880}}>
          <thead><tr>
            <th style={{width:32}}></th><th style={{minWidth:150}}>Nombre (es / eu)</th><th>Tipo</th><th className="num" style={{width:64}}>Ratio</th><th style={{width:150}}>Tipo de jornada</th><th className="num" style={{width:56}}>Base (h)</th>
            <th className="num" style={{width:60}}>Unid.</th><th style={{width:120}}>Grupo cuadre</th><th style={{textAlign:"center", width:60}}>Cuadra</th>
            <th style={{width:150}}>Fuente sugerida</th><th className="num" style={{width:90}}>Financiadas</th>
          </tr></thead>
          <tbody>
            {d.categorias.map(function(c){
              var fin = num(c.unidades)*num(c.ratioProfAula)*horasBaseDe(d, c);
              return (
                <tr key={c.id}>
                  <td style={{textAlign:"center"}}><button style={Object.assign({}, S.btnDel, {padding:"4px 7px"})} onClick={function(){ del(c.id); }} title="Eliminar categoría">✕</button></td>
                  <td>
                    <input className="cellinput" placeholder="castellano" value={c.nombreEs} onChange={function(e){ update(c.id,"nombreEs",e.target.value); }} />
                    <input className="cellinput" placeholder="euskera" value={c.nombreEu} onChange={function(e){ update(c.id,"nombreEu",e.target.value); }} style={{marginTop:3, color:C.secundario}} />
                  </td>
                  <td>
                    <select className="cellinput" value={c.tipo} onChange={function(e){ update(c.id,"tipo",e.target.value); }}>
                      <option value="docente">docente</option>
                      <option value="laguntza">laguntza (EAE)</option>
                      <option value="pas">PAS</option>
                      <option value="teji">TEJI</option>
                      <option value="otro">otro</option>
                    </select>
                  </td>
                  <td><input className="cellinput num" value={c.ratioProfAula} onChange={function(e){ update(c.id,"ratioProfAula",num(e.target.value)); }} /></td>
                  <td>
                    <select className="cellinput" value={c.jornadaId||""} onChange={function(e){ update(c.id,"jornadaId",e.target.value); }}>
                      <option value="">— (usa base fija) —</option>
                      {(d.jornadas&&d.jornadas.tipos?d.jornadas.tipos:[]).map(function(t){ return <option key={t.id} value={t.id}>{t.nombre}</option>; })}
                    </select>
                  </td>
                  <td className="num" style={{color:C.secundario, fontWeight:600}} title="Se deriva del tipo de jornada">{horasBaseDe(d, c)}{c.jornadaId?"":<input className="cellinput num" value={c.horasBase} onChange={function(e){ update(c.id,"horasBase",num(e.target.value)); }} />}</td>
                  <td>
                    <div style={{display:"flex", alignItems:"center", gap:4}}>
                      <input className="cellinput num" value={c.unidades} onChange={function(e){ update(c.id,"unidades",num(e.target.value)); }} />
                      {/PRL/i.test((c.nombreEs||"")+(c.nombreEu||"")) ? <InfoBtn info="En PRL, este número de unidades es solo orientativo: el tope real NO es por unidades sino por presupuesto. El presupuesto se calcula con el alumnado en Configuración → Tablas y parámetros → PRL (media de meses con datos, prorrateada al 95%). PRL Primaria y Secundaria comparten bolsa. Cambia el alumnado ahí para ajustar el presupuesto." /> : null}
                    </div>
                  </td>
                  <td><input className="cellinput" value={c.grupoCuadre} onChange={function(e){ update(c.id,"grupoCuadre",e.target.value); }} /></td>
                  <td style={{textAlign:"center"}}>
                    <input type="checkbox" checked={c.cuadra} onChange={function(e){ update(c.id,"cuadra",e.target.checked); }} />
                  </td>
                  <td>
                    <select className="cellinput" value={c.fuenteSugerida} onChange={function(e){ update(c.id,"fuenteSugerida",e.target.value); }}>
                      <option value="">—</option>
                      {d.fuentes.map(function(f){ return <option key={f.id} value={f.id}>{nombreDe(f)}</option>; })}
                    </select>
                  </td>
                  <td className="num" style={{fontWeight:600, color:C.titulo}}>{r2(fin)}</td>
                </tr>
              );
            })}
          </tbody>
        </table></div>
        </div>
      </div>

      <div style={{marginTop:18}}>
        <h4 style={{fontSize:14, color:C.secundario, textTransform:"uppercase", letterSpacing:".04em", marginBottom:8}}>
          Horas financiadas por grupo de cuadre
        </h4>
        <div style={{display:"flex", flexWrap:"wrap", gap:10}}>
          {Object.keys(grupos).sort().map(function(g){
            return (
              <div key={g} style={Object.assign({}, S.card, {padding:"10px 16px", minWidth:120})}>
                <div style={{fontSize:12, color:C.secundario, fontWeight:600}}>{g}</div>
                <div style={{fontSize:20, fontWeight:700, color:C.titulo}}>{r2(grupos[g])} <span style={{fontSize:12, color:C.secundario, fontWeight:500}}>h</span></div>
              </div>
            );
          })}
          <div style={Object.assign({}, S.card, {padding:"10px 16px", minWidth:120, background:C.infoBg, borderColor:C.azul})}>
            <div style={{fontSize:12, color:C.azul, fontWeight:700}}>TOTAL</div>
            <div style={{fontSize:20, fontWeight:700, color:C.azul}}>{r2(totalFin)} <span style={{fontSize:12, fontWeight:500}}>h</span></div>
          </div>
        </div>
      </div>

      <div style={{marginTop:24}}>
        <h4 style={{fontSize:14, color:C.secundario, textTransform:"uppercase", letterSpacing:".04em", marginBottom:4}}>
          ¿Quién puede ocupar cada categoría?
        </h4>
        <p style={{margin:"0 0 10px", color:C.secundario, fontSize:J}}>Marca qué categorías laborales pueden trabajar en cada categoría. Fila vacía = cualquiera. Esto filtra las personas en el montaje.</p>
        <div style={Object.assign({}, S.card, {padding:0, overflow:"hidden"})}>
          <div style={{overflowX:"auto"}}>
            <div className="tabla-scroll"><table>
              <thead><tr>
                <th>Categoría</th>
                {(d.categoriasLaborales||[]).map(function(l){ return <th key={l.id} className="num" style={{whiteSpace:"nowrap"}}>{nombreDe(l)}</th>; })}
                <th></th>
              </tr></thead>
              <tbody>
                {d.categorias.map(function(c){
                  var perm = c.labPermitidas||[];
                  return (
                    <tr key={c.id}>
                      <td style={{fontWeight:600, color:C.titulo, whiteSpace:"nowrap"}}>{nombreDe(c)}</td>
                      {(d.categoriasLaborales||[]).map(function(l){
                        var on = perm.indexOf(l.id)>=0;
                        return <td key={l.id} style={{textAlign:"center"}}>
                          <input type="checkbox" checked={on} onChange={function(e){
                            var nv = e.target.checked ? perm.concat([l.id]) : perm.filter(function(x){ return x!==l.id; });
                            update(c.id, "labPermitidas", nv);
                          }} />
                        </td>;
                      })}
                      <td style={{fontSize:11, color:C.secundario, whiteSpace:"nowrap"}}>{perm.length===0 ? "cualquiera" : ""}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table></div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ----- Fuentes ----- */
function FuentesTab(props){
  var d = props.data;
  function update(id, campo, valor){
    var fs = d.fuentes.map(function(f){ return f.id===id ? Object.assign({}, f, (function(){ var o={}; o[campo]=valor; return o; })()) : f; });
    props.setData(Object.assign({}, d, {fuentes:fs}));
  }
  function add(){
    var nf = {id:uid("f"), nombreEs:"Nueva fuente", nombreEu:"Iturri berria"};
    props.setData(Object.assign({}, d, {fuentes:d.fuentes.concat([nf])}));
    props.toast("Fuente añadida");
  }
  function usos(id){
    return d.categorias.filter(function(c){ return c.fuenteSugerida===id; }).length;
  }
  function del(id){
    var n = usos(id);
    var f = d.fuentes.find(function(x){ return x.id===id; });
    var msg = "¿Eliminar la fuente \"" + nombreDe(f) + "\"?";
    if(n>0) msg += "\n\nLa usan " + n + " categoría(s) como fuente sugerida; quedarán sin fuente.";
    if(!window.confirm(msg)) return;
    var cats = d.categorias.map(function(c){ return c.fuenteSugerida===id ? Object.assign({}, c, {fuenteSugerida:""}) : c; });
    props.setData(Object.assign({}, d, {fuentes:d.fuentes.filter(function(x){ return x.id!==id; }), categorias:cats}));
    props.toast("Fuente eliminada", "info");
  }
  return (
    <div style={{maxWidth:560}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:12}}>
        <div>
          <h3 style={{fontSize:P}}>Fuentes de pago</h3>
          <p style={{margin:"4px 0 0", color:C.secundario, fontSize:K}}>Quién paga cada tramo de jornada.</p>
        </div>
        <button style={S.btnPri} onClick={add}>+ Fuente</button>
      </div>
      <div style={Object.assign({}, S.card, {padding:0, overflow:"hidden"})}>
        <div className="tabla-scroll"><table>
          <thead><tr><th>Nombre (es / eu)</th><th className="num">Categorías</th><th></th></tr></thead>
          <tbody>
            {d.fuentes.map(function(f){
              return (
                <tr key={f.id}>
                  <td>
                    <input className="cellinput" placeholder="castellano" value={f.nombreEs} onChange={function(e){ update(f.id,"nombreEs",e.target.value); }} />
                    <input className="cellinput" placeholder="euskera" value={f.nombreEu} onChange={function(e){ update(f.id,"nombreEu",e.target.value); }} style={{marginTop:3, color:C.secundario}} />
                  </td>
                  <td className="num">{usos(f.id)}</td>
                  <td><button style={S.btnDel} onClick={function(){ del(f.id); }}>✕</button></td>
                </tr>
              );
            })}
          </tbody>
        </table></div>
      </div>
    </div>
  );
}

/* ----- Listas configurables (categorías laborales y tipos de contrato) ----- */
function ListaCRUD(props){
  var d = props.data;
  var items = d[props.campo] || [];
  function update(id, patch){
    var arr = items.map(function(x){ return x.id===id ? Object.assign({}, x, patch) : x; });
    props.setData(Object.assign({}, d, (function(){ var o={}; o[props.campo]=arr; return o; })()));
  }
  function add(){
    var nuevo = Object.assign({id:uid(props.prefijo), nombreEs:"Nuevo", nombreEu:"Berria"}, props.extra || {});
    props.setData(Object.assign({}, d, (function(){ var o={}; o[props.campo]=items.concat([nuevo]); return o; })()));
    props.toast(props.titulo + ": añadido");
  }
  function del(id){
    var it = items.find(function(x){ return x.id===id; });
    function usa(p){ var v = p[props.campoPersona]; return Array.isArray(v) ? v.indexOf(id)>=0 : v===id; }
    var enUso = (d.personas || []).filter(usa).length;
    var msg = "¿Eliminar \"" + nombreDe(it) + "\"?";
    if(enUso>0) msg += "\n\nLo usan " + enUso + " persona(s); quedarán sin valor en ese campo.";
    if(!window.confirm(msg)) return;
    var pers = (d.personas||[]).map(function(p){
      if(!usa(p)) return p;
      var v = p[props.campoPersona];
      var nv = Array.isArray(v) ? v.filter(function(x){ return x!==id; }) : "";
      return Object.assign({}, p, (function(){ var o={}; o[props.campoPersona]=nv; return o; })());
    });
    props.setData(Object.assign({}, d, (function(){ var o={}; o[props.campo]=items.filter(function(x){ return x.id!==id; }); o.personas=pers; return o; })()));
    props.toast("Eliminado", "info");
  }
  return (
    <div style={Object.assign({}, S.card, {flex:"1 1 320px", padding:0, overflow:"hidden", alignSelf:"flex-start"})}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"14px 16px", borderBottom:"1px solid "+C.borde}}>
        <h4 style={{fontSize:15}}>{props.titulo}</h4>
        <button style={Object.assign({}, S.btnPri, {padding:"6px 12px"})} onClick={add}>+ Añadir</button>
      </div>
      <div className="tabla-scroll"><table>
        <tbody>
          {items.map(function(it){
            return (
              <tr key={it.id}>
                <td>
                  <input className="cellinput" placeholder="castellano" value={it.nombreEs} onChange={function(e){ update(it.id,{nombreEs:e.target.value}); }} />
                  <input className="cellinput" placeholder="euskera" value={it.nombreEu} onChange={function(e){ update(it.id,{nombreEu:e.target.value}); }} style={{marginTop:3, color:C.secundario}} />
                </td>
                {props.conSinFin &&
                  <td style={{width:130, whiteSpace:"nowrap"}}>
                    <label style={{display:"flex", alignItems:"center", gap:6, fontSize:13, color:C.secundario, cursor:"pointer"}}>
                      <input type="checkbox" checked={it.sinFin===true} onChange={function(e){ update(it.id,{sinFin:e.target.checked}); }} /> sin fecha fin
                    </label>
                  </td>}
                <td style={{width:34}}><button style={S.btnDel} onClick={function(){ del(it.id); }}>✕</button></td>
              </tr>
            );
          })}
          {items.length===0 && <tr><td style={{color:C.secundario, padding:"18px", textAlign:"center"}}>Lista vacía</td></tr>}
        </tbody>
      </table></div>
    </div>
  );
}

/* ----- Ajustes ----- */
function AjustesTab(props){
  var d = props.data;
  var [nu, setNu] = useState({usuario:"", rol:"consulta", pass:""});
  var fileRef = useRef(null);

  function setCurso(v){ props.setData(Object.assign({}, d, {curso:v})); }
  function setTol(v){ props.setData(Object.assign({}, d, {toleranciaCuadre:num(v)})); }

  function addUsuario(){
    if(!nu.usuario.trim() || !nu.pass){ props.toast("Usuario y contraseña requeridos","error"); return; }
    sha256(nu.pass).then(function(h){
      var u = {usuario:nu.usuario.trim(), rol:nu.rol, passwordHash:h};
      props.setData(Object.assign({}, d, {usuarios:d.usuarios.concat([u])}));
      setNu({usuario:"", rol:"consulta", pass:""});
      props.toast("Usuario añadido");
    });
  }
  function delUsuario(i){
    props.setData(Object.assign({}, d, {usuarios:d.usuarios.filter(function(_,j){ return j!==i; })}));
    props.toast("Usuario eliminado","info");
  }
  function exportar(){
    var blob = new Blob([JSON.stringify(d, null, 1)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "datos_EAMI_" + (d.curso||"curso") + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    props.toast("JSON exportado");
  }
  function importar(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var rd = new FileReader();
    rd.onload = function(ev){
      try{
        var d2 = normalize(JSON.parse(ev.target.result));
        props.setData(d2);
        props.toast("Datos importados");
      }catch(err){ props.toast("Archivo no válido","error"); }
    };
    rd.readAsText(file);
    e.target.value = "";
  }
  function reset(){
    if(!window.confirm("¿Restablecer la configuración base (sin personas)? Se perderán los cambios locales.")) return;
    props.setData(normalize(makeSeed()));
    props.toast("Configuración restablecida","info");
  }

  return (
    <div style={{maxWidth:760}}>
      <div style={{display:"flex", flexWrap:"wrap", gap:16}}>
        <div style={Object.assign({}, S.card, {flex:"1 1 240px"})}>
          <label style={S.label}>Curso académico</label>
          <input style={S.input} value={d.curso} onChange={function(e){ setCurso(e.target.value); }} />
          <label style={Object.assign({}, S.label, {marginTop:14})}>Tolerancia de cuadre (h)</label>
          <input style={S.input} className="num" value={d.toleranciaCuadre} onChange={function(e){ setTol(e.target.value); }} />
          <p style={{color:C.secundario, fontSize:J, marginTop:8}}>El semáforo avisa solo si la diferencia supera este valor (evita el ruido de redondeo).</p>
        </div>

        <div style={Object.assign({}, S.card, {flex:"1 1 300px"})}>
          <h4 style={{fontSize:15, marginBottom:4}}>Copia de seguridad</h4>
          <p style={{color:C.secundario, fontSize:J, margin:"0 0 12px"}}>Red de seguridad manual, además del autoguardado local.</p>
          <div style={{display:"flex", gap:10, flexWrap:"wrap"}}>
            <button style={S.btnPri} onClick={exportar}>Exportar JSON</button>
            <button style={S.btn} onClick={function(){ fileRef.current && fileRef.current.click(); }}>Importar JSON</button>
            <input ref={fileRef} type="file" accept="application/json,.json" style={{display:"none"}} onChange={importar} />
            <button style={Object.assign({}, S.btn, {color:C.peligroText, borderColor:C.peligroBgBorde})} onClick={reset}>Restablecer</button>
          </div>
        </div>
      </div>

      <div style={Object.assign({}, S.card, {marginTop:16})}>
        <h4 style={{fontSize:15, marginBottom:4}}>Usuarios y roles</h4>
        <p style={{color:C.secundario, fontSize:J, margin:"0 0 14px"}}>
          La contraseña se guarda cifrada (SHA-256), nunca en claro. El candado de acceso se activará con la capa GitHub; aquí defines los perfiles.
          <b style={{color:C.texto}}> admin</b> = todo · <b style={{color:C.texto}}>editor</b> = fases 1 y 2 · <b style={{color:C.texto}}>consulta</b> = solo resultados.
        </p>
        <div style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"flex-end", marginBottom:14}}>
          <div style={{flex:"1 1 160px"}}>
            <label style={S.label}>Usuario</label>
            <input style={S.input} value={nu.usuario} onChange={function(e){ setNu(Object.assign({}, nu, {usuario:e.target.value})); }} />
          </div>
          <div style={{flex:"1 1 130px"}}>
            <label style={S.label}>Rol</label>
            <select style={S.input} value={nu.rol} onChange={function(e){ setNu(Object.assign({}, nu, {rol:e.target.value})); }}>
              <option value="admin">admin</option>
              <option value="editor">editor</option>
              <option value="consulta">consulta</option>
            </select>
          </div>
          <div style={{flex:"1 1 160px"}}>
            <label style={S.label}>Contraseña</label>
            <input style={S.input} type="password" value={nu.pass} onChange={function(e){ setNu(Object.assign({}, nu, {pass:e.target.value})); }} />
          </div>
          <button style={S.btnPri} onClick={addUsuario}>Añadir</button>
        </div>
        {d.usuarios.length>0 &&
          <div className="tabla-scroll"><table>
            <thead><tr><th>Usuario</th><th>Rol</th><th>Hash</th><th></th></tr></thead>
            <tbody>
              {d.usuarios.map(function(u,i){
                return (
                  <tr key={i}>
                    <td style={{fontWeight:600}}>{u.usuario}</td>
                    <td><span style={Object.assign({}, S.chip, {background:C.infoBg, color:C.azul})}>{u.rol}</span></td>
                    <td style={{fontFamily:"ui-monospace,monospace", fontSize:12, color:C.secundario}}>{(u.passwordHash||"").slice(0,18)}…</td>
                    <td><button style={S.btnDel} onClick={function(){ delUsuario(i); }}>✕</button></td>
                  </tr>
                );
              })}
            </tbody>
          </table></div>}
      </div>
    </div>
  );
}
