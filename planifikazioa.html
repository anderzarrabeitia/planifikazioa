  function byname(a,b){ return cmpPersona(a,b); }
  function nomP(p){ return (p.apellidos+", "+p.nombre).replace(/^, |, $/,""); }
  function horasT(t){ var c=catById[t.categoriaId]; var base=c?horasBaseDe(d, c):0; return num(t.porcentaje)/100*base; }
  function tramosDe(pid){ return d.tramos.filter(function(t){ return t.personaId===pid; }); }
  function totalPct(pid){ return d.tramos.reduce(function(a,t){ return t.personaId===pid?a+num(t.porcentaje):a; }, 0); }
  function labNombres(p){ return (p.categoriasLaborales||[]).map(function(id){ var x=(d.categoriasLaborales||[]).find(function(o){ return o.id===id; }); return x?nombreDe(x):""; }).filter(Boolean).join(", "); }
  function cargoNombre(p){ var x=(d.cargosDirectivos||[]).find(function(o){ return o.id===p.cargoDirectivo; }); return x?nombreDe(x):""; }
  function fNom(fid){ return fuentesById[fid]?nombreDe(fuentesById[fid]):"—"; }

  var personasOrden = d.personas.slice().sort(byname);
  var personasFicha = quien==="todos" ? personasOrden.filter(function(p){ return tramosDe(p.id).length; }) : personasOrden.filter(function(p){ return p.id===quien; });

  // cuadre (para resumen)
  var finG={},asgG={},finGH={},asgGH={},grupos=[],seen={},asgCat={};
  cats.forEach(function(c){ if(!c.cuadra) return; if(!seen[c.grupoCuadre]){seen[c.grupoCuadre]=true;grupos.push(c.grupoCuadre);} finG[c.grupoCuadre]=(finG[c.grupoCuadre]||0)+num(c.unidades)*num(c.ratioProfAula); finGH[c.grupoCuadre]=(finGH[c.grupoCuadre]||0)+num(c.unidades)*num(c.ratioProfAula)*horasBaseDe(d, c); });
  d.tramos.forEach(function(t){ var c=catById[t.categoriaId]; asgCat[t.categoriaId]=(asgCat[t.categoriaId]||0)+num(t.porcentaje)/100; if(c&&c.cuadra){asgG[c.grupoCuadre]=(asgG[c.grupoCuadre]||0)+num(t.porcentaje)/100; asgGH[c.grupoCuadre]=(asgGH[c.grupoCuadre]||0)+num(t.porcentaje)/100*horasBaseDe(d, c);} });
  grupos.sort();

  var cambiosF = (d.cambios||[]).filter(function(x){
    if(desde && String(x.fecha||"") < desde) return false;
    if(hasta && String(x.fecha||"") > hasta) return false;
    if(quien!=="todos" && x.personaId!==quien) return false;
    return true;
  }).sort(function(a,b){ var f=String(a.fecha||"").localeCompare(String(b.fecha||"")); if(f!==0) return f; return String(a.persona||"").localeCompare(String(b.persona||"")); });
  function grupos(){
    var g = {}, orden = [];
    cambiosF.forEach(function(x){
      var k = (agrupar==="fuente") ? (x.fuente||"(sin fuente)") : (x.persona||"(sin persona)");
      if(!g[k]){ g[k]=[]; orden.push(k); }
      g[k].push(x);
    });
    orden.sort();
    return orden.map(function(k){ return {clave:k, filas:g[k]}; });
  }
  function delta(x){ var v=num(x.a)-num(x.de); return (v>=0?"+":"") + r2(v); }

  function exportar(){
    if(formato==="cambios"){
      var aoa=[["Fecha","Persona","Categoría","Fuente","De %","A %","Variación","Motivo"]];
      cambiosF.forEach(function(x){ aoa.push([x.fecha, x.persona, x.categoria, x.fuente, r2(x.de), r2(x.a), delta(x), x.motivo]); });
      descargarTabla("cambios_"+(desde||"inicio")+"_"+(hasta||"hoy"), [{nombre:"Cambios", aoa:aoa}]);
      return;
    }
    if(formato==="persona"){
      var aoa=[["Apellidos","Nombre","Cat. laborales","Cargo","Tutor","Categoría","Grupo","Fuente","Horas","%"]];
      personasFicha.forEach(function(p){
        var ts=tramosDe(p.id);
        if(!ts.length){ aoa.push([p.apellidos,p.nombre,labNombres(p),cargoNombre(p),p.tutor?"Sí":"","","","",0,0]); return; }
        ts.forEach(function(t){ var c=catById[t.categoriaId]; aoa.push([p.apellidos,p.nombre,labNombres(p),cargoNombre(p),p.tutor?"Sí":"", c?nombreDe(c):"", c?c.grupoCuadre:"", fNom(t.fuenteId), r2(horasT(t)), r2(num(t.porcentaje))]); });
      });
      descargarTabla("fichas_"+d.curso, [{nombre:"Fichas", aoa:aoa}]);
    } else if(formato==="fuente"){
      var hojas=d.fuentes.map(function(f){
        var aoa=[["Apellidos","Nombre","Categoría","Grupo","Horas","%"]]; var totH=0;
        d.tramos.filter(function(t){ return t.fuenteId===f.id; }).forEach(function(t){
          var p=d.personas.find(function(x){ return x.id===t.personaId; }); var c=catById[t.categoriaId]; totH+=horasT(t);
          aoa.push([p?p.apellidos:"",p?p.nombre:"", c?nombreDe(c):"", c?c.grupoCuadre:"", r2(horasT(t)), r2(num(t.porcentaje))]);
        });
        aoa.push(["","","","TOTAL", r2(totH), ""]);
        return {nombre:nombreDe(f), aoa:aoa};
      });
      descargarTabla("por_fuente_"+d.curso, hojas);
    } else if(formato==="cuadre"){
      var aoaG=[["Grupo","Fin. FTE","Asig. FTE","Dif FTE","Fin. h","Asig. h","Dif h"]];
      grupos.forEach(function(g){ aoaG.push([g, r2(finG[g]||0), r2(asgG[g]||0), r2((finG[g]||0)-(asgG[g]||0)), r2(finGH[g]||0), r2(asgGH[g]||0), r2((finGH[g]||0)-(asgGH[g]||0))]); });
      var aoaC=[["Categoría","Grupo","Unid","Ratio","Base","Fin. FTE","Asig. FTE","Dif FTE"]];
      cats.forEach(function(c){ var fin=c.cuadra?num(c.unidades)*num(c.ratioProfAula):0; var asg=asgCat[c.id]||0; aoaC.push([nombreDe(c),c.grupoCuadre,num(c.unidades),num(c.ratioProfAula),horasBaseDe(d, c), c.cuadra?r2(fin):"", r2(asg), c.cuadra?r2(fin-asg):""]); });
      descargarTabla("cuadre_"+d.curso, [{nombre:"Grupos",aoa:aoaG},{nombre:"Categorias",aoa:aoaC}]);
    } else {
      var head=["Persona"].concat(cats.map(function(c){ return nombreDe(c); })).concat(["Total %"]);
      var aoa=[head];
      personasOrden.filter(function(p){ return tramosDe(p.id).length; }).forEach(function(p){
        var row=[nomP(p)];
        cats.forEach(function(c){ var h=d.tramos.filter(function(t){ return t.personaId===p.id&&t.categoriaId===c.id; }).reduce(function(a,t){ return a+horasT(t); },0); row.push(h>0?r2(h):""); });
        row.push(r2(totalPct(p.id)));
        aoa.push(row);
      });
      descargarTabla("matriz_"+d.curso, [{nombre:"Matriz",aoa:aoa}]);
    }
  }

  var formatos = [
    {id:"persona", label:"Ficha por persona"},
    {id:"fuente", label:"Por fuente"},
    {id:"cuadre", label:"Resumen de cuadre"},
    {id:"matriz", label:"Matriz"},
    {id:"cambios", label:"Cambios"}
  ];
  var thp = {textAlign:"left", padding:"5px 8px", borderBottom:"1px solid "+C.borde, fontSize:11, color:C.secundario, textTransform:"uppercase", letterSpacing:".03em", background:"transparent", position:"static"};
  var tdp = {padding:"5px 8px", borderBottom:"1px solid #f0ece5", fontSize:J};

  return (
    <div>
      <div className="no-print" style={{display:"flex", flexWrap:"wrap", gap:10, alignItems:"center", marginBottom:14}}>
        <Segmented options={formatos} value={formato} onChange={setFormato} />
        {formato==="persona" ? (
          <select style={Object.assign({}, S.input, {width:230})} value={quien} onChange={function(e){ setQuien(e.target.value); }}>
            <option value="todos">Todas las personas (con tramos)</option>
            {personasOrden.map(function(p){ return <option key={p.id} value={p.id}>{nomP(p)}</option>; })}
          </select>
        ) : null}
        {formato==="cambios" ? (
          <React.Fragment>
            <div style={{width:145}}>
              <label style={Object.assign({}, S.label, {marginBottom:2})}>Desde</label>
              <input type="date" style={S.input} value={desde} onChange={function(e){ setDesde(e.target.value); }} />
            </div>
            <div style={{width:145}}>
              <label style={Object.assign({}, S.label, {marginBottom:2})}>Hasta</label>
              <input type="date" style={S.input} value={hasta} onChange={function(e){ setHasta(e.target.value); }} />
            </div>
            <select style={Object.assign({}, S.input, {width:200})} value={quien} onChange={function(e){ setQuien(e.target.value); }}>
              <option value="todos">Todas las personas</option>
              {personasOrden.map(function(p){ return <option key={p.id} value={p.id}>{nomP(p)}</option>; })}
            </select>
            <Segmented options={[{id:"persona",label:"Por persona"},{id:"fuente",label:"Por fuente"}]} value={agrupar} onChange={setAgrupar} />
          </React.Fragment>
        ) : null}
        <div style={{flex:1}} />
        <button style={S.btn} onClick={exportar}>Descargar Excel</button>
        <button style={S.btnPri} onClick={function(){ window.print(); }}>Imprimir / PDF</button>
      </div>
      <p className="no-print" style={{fontSize:12, color:C.secundario, marginBottom:14}}>
        En el diálogo de impresión elige "Guardar como PDF". "Descargar Excel" genera .xlsx (o .csv si la librería no cargó). Las observaciones son solo para esta impresión (no se guardan).
      </p>

      <div className="print-area">
        {formato==="persona" ? (
          personasFicha.length ? personasFicha.map(function(p){
            var ts = tramosDe(p.id); var tp = totalPct(p.id);
            var thP = ts.reduce(function(a,t){ return a+horasT(t); }, 0);
            var est = jornadaEstado(p, tp, thP); var col = est.col;
            return (
              <div key={p.id} className="ficha" style={{background:"#fff", border:"1px solid "+C.borde, borderRadius:10, padding:"20px 22px", marginBottom:18}}>
                <CabeceraPapel titulo={nomP(p)} sigla={siglaDe(p)} sigcolor={colorCatLab(d, p)} curso={d.curso} />
                <div style={{fontSize:J, color:C.texto, marginBottom:14, lineHeight:1.7}}>
                  {labNombres(p) ? <span><b>Categoría laboral:</b> {labNombres(p)} · </span> : null}
                  {cargoNombre(p) ? <span><b>Cargo:</b> {cargoNombre(p)} · </span> : null}
                  {p.tutor ? <span><b>Tutor/a</b></span> : null}
                </div>
                {p.titulaciones ? <div style={{fontSize:J, color:C.texto, marginBottom:12}}><b>Estudios / titulaciones:</b> {p.titulaciones}</div> : null}
                <div className="tabla-scroll"><table>
                  <thead><tr><th style={thp}>Categoría</th><th style={thp}>Grupo</th><th style={thp}>Fuente</th><th style={Object.assign({}, thp, {textAlign:"right"})}>H. lectivas</th><th style={Object.assign({}, thp, {textAlign:"right"})}>H. jornada</th><th style={Object.assign({}, thp, {textAlign:"right"})}>% jornada</th></tr></thead>
                  <tbody>
                    {ts.map(function(t){ var c=catById[t.categoriaId]; var dg=desgloseAsignacion(d, t); return (
                      <tr key={t.id}>
                        <td style={Object.assign({}, tdp, {fontWeight:600, color:C.titulo})}>{c?nombreDe(c):"—"}</td>
                        <td style={tdp}>{c?c.grupoCuadre:""}</td>
                        <td style={tdp}>{fNom(t.fuenteId)}</td>
                        <td style={Object.assign({}, tdp, {textAlign:"right"})}>{dg.esDocente ? r2(dg.lectivas) : <span style={{color:C.secundario}}>—</span>}</td>
                        <td style={Object.assign({}, tdp, {textAlign:"right"})}>{r2(dg.jornadaHoras)}</td>
                        <td style={Object.assign({}, tdp, {textAlign:"right"})}>{r2(dg.pctJornada)}%</td>
                      </tr>
                    ); })}
                    {ts.length===0 ? <tr><td colSpan="6" style={Object.assign({}, tdp, {color:C.secundario})}>Sin tramos.</td></tr> : null}
                  </tbody>
                </table></div>
                <div style={{display:"flex", alignItems:"center", gap:10, margin:"12px 0 6px"}}>
                  <div style={{flex:1, height:8, background:C.panelBorde, borderRadius:5, overflow:"hidden"}}><div style={{height:"100%", width:Math.min(100,est.ratio*100)+"%", background:col}}></div></div>
                  <div style={{fontSize:13, fontWeight:700, color:col}}>{est.texto} jornada</div>
                </div>
                {(function(){
                  var rr = repartoDe(d, ts);
                  if(rr.lectivas+rr.comple+rr.personal<=0 && rr.pctSinReparto<=0) return null;
                  return (
                    <div style={{display:"flex", gap:18, flexWrap:"wrap", fontSize:J, color:C.texto, padding:"8px 10px", background:C.superficie, border:"1px solid "+C.borde, borderRadius:8, margin:"4px 0 4px"}}>
                      <span><b>Lectivas:</b> {r2(rr.lectivas)} h</span>
                      <span><b>Complementarias:</b> {r2(rr.comple)} h</span>
                      <span><b>Trabajo personal:</b> {r2(rr.personal)} h</span>
                      {rr.pctSinReparto>0 ? <span style={{color:C.secundario}}>+ {r2(rr.pctSinReparto)}% sin reparto (PAS/TEJI/EAE)</span> : null}
                    </div>
                  );
                })()}
                {(function(){
                  var cargo = cargoNombre(p);
                  var plus = null;
                  if(cargo && d.pluses && Array.isArray(d.pluses.cargos)){
                    var R = plusesCalc(d.pluses);
                    d.pluses.cargos.forEach(function(cg, ci){
                      var mismoNombre = cg.nombre && (cg.nombre.toLowerCase().indexOf((p.nombre||"").toLowerCase())>=0 || cg.nombre.toLowerCase().indexOf((p.apellidos||"").toLowerCase())>=0);
                      var mismoCargo = cg.cargo && cargo && cg.cargo.toLowerCase()===cargo.toLowerCase();
                      if((mismoNombre || mismoCargo) && plus===null && R.rows[ci]) plus = R.rows[ci].total;
                    });
                  }
                  if(!p.tutor && !cargo) return null;
                  return (
                    <div style={{border:"1px solid "+C.azul, background:C.infoBg, borderRadius:8, padding:"10px 12px", margin:"10px 0 4px"}}>
                      <div style={{fontSize:11, fontWeight:700, color:C.azul, textTransform:"uppercase", letterSpacing:".04em", marginBottom:5}}>Complementos para nómina</div>
                      <div style={{display:"flex", gap:20, flexWrap:"wrap", fontSize:J, color:C.texto}}>
                        {p.tutor ? <span><b>Tutoría:</b> sí (complemento de tutoría)</span> : null}
                        {cargo ? <span><b>Cargo directivo:</b> {cargo}{plus!==null ? (" · plus " + r2(plus) + " €/mes") : " · plus (pendiente de configurar)"}</span> : null}
                      </div>
                    </div>
                  );
                })()}
                {(function(){
                  var lst = (p.contratos||[]).slice().sort(function(a,b){ return String(a.desde||"").localeCompare(String(b.desde||"")); });
                  if(!lst.length) return null;
                  var perCurso = periodoCurso(d);
                  var vigIds = {}; contratosVigentes(p, perCurso).forEach(function(k){ vigIds[k.id]=true; });
                  var totalVig = horasContrato(p, perCurso);
                  return (
                    <div style={{margin:"10px 0 4px"}}>
                      <div style={{fontSize:11, fontWeight:700, color:C.titulo, textTransform:"uppercase", letterSpacing:".04em", marginBottom:4}}>Historial de contrato</div>
                      <div className="tabla-scroll"><table>
                        <thead><tr><th style={thp}>Desde</th><th style={thp}>Hasta</th><th style={thp}>Tipo</th><th style={Object.assign({}, thp,{textAlign:"right"})}>H. lectivas</th><th style={Object.assign({}, thp,{textAlign:"right"})}>H. jornada</th><th style={Object.assign({}, thp,{textAlign:"right"})}>% jornada</th><th style={thp}>Estado</th><th style={thp}>Motivo</th></tr></thead>
                        <tbody>
                          {lst.map(function(k){
                            var esVig = vigIds[k.id];
                            var dc = desgloseContrato(d, p, k.horas);
                            return (
                              <tr key={k.id} style={esVig?null:{opacity:.65}}>
                                <td style={Object.assign({}, tdp,{whiteSpace:"nowrap", fontWeight:esVig?700:400})}>{k.desde||"—"}</td>
                                <td style={Object.assign({}, tdp,{whiteSpace:"nowrap", color:k.hasta?C.texto:C.secundario})}>{k.hasta||"indefinido"}</td>
                                <td style={Object.assign({}, tdp,{fontWeight:esVig?700:400})}>{k.tipo}</td>
                                <td style={Object.assign({}, tdp,{textAlign:"right", fontWeight:esVig?700:400})}>{dc.lectivas!==null ? r2(dc.lectivas) : <span style={{color:C.secundario}}>—</span>}</td>
                                <td style={Object.assign({}, tdp,{textAlign:"right", fontWeight:esVig?700:400})}>{r2(dc.jornadaHoras)}</td>
                                <td style={Object.assign({}, tdp,{textAlign:"right", fontWeight:esVig?700:400})}>{r2(dc.pctJornada)}%</td>
                                <td style={Object.assign({}, tdp,{fontSize:10, fontWeight:600, color:esVig?C.okText:C.secundario})}>{esVig?"vigente":"fuera del curso"}</td>
                                <td style={Object.assign({}, tdp,{color:C.secundario})}>{k.nota||""}</td>
                              </tr>
                            );
                          })}
                          {totalVig!==null ? <tr><td colSpan="4" style={Object.assign({}, tdp,{textAlign:"right", fontWeight:700, borderTop:"2px solid "+C.borde})}>Vigente en el curso</td><td style={Object.assign({}, tdp,{textAlign:"right", fontWeight:700, color:C.azul, borderTop:"2px solid "+C.borde})}>{r2(totalVig)}</td><td colSpan="3" style={{borderTop:"2px solid "+C.borde}}></td></tr> : null}
                        </tbody>
                      </table></div>
                    </div>
                  );
                })()}
                <div style={{fontSize:11, fontWeight:700, color:C.titulo, textTransform:"uppercase", letterSpacing:".04em", margin:"14px 0 6px"}}>Observaciones</div>
                <div className="no-print"><textarea value={obs[p.id]||""} onChange={function(e){ var o=Object.assign({},obs); o[p.id]=e.target.value; setObs(o); }} placeholder="Notas para esta impresión…" style={{width:"100%", minHeight:54, border:"1px solid "+C.borde, borderRadius:8, padding:"8px 10px", resize:"vertical"}} /></div>
                <div className="print-only" style={{border:"1px solid "+C.borde, borderRadius:8, padding:"10px 12px", minHeight:48, fontSize:J, whiteSpace:"pre-wrap"}}>{obs[p.id]||""}</div>
              </div>
            );
          }) : <div style={{color:C.secundario, padding:20}}>No hay personas con tramos.</div>
        ) : null}

        {formato==="fuente" ? d.fuentes.map(function(f){
          var ts = d.tramos.filter(function(t){ return t.fuenteId===f.id; });
          var totH = ts.reduce(function(a,t){ return a+horasT(t); }, 0);
          return (
            <div key={f.id} className="ficha" style={{background:"#fff", border:"1px solid "+C.borde, borderRadius:10, padding:"20px 22px", marginBottom:18}}>
              <CabeceraPapel titulo={"Fuente: " + nombreDe(f)} curso={d.curso} />
              <div className="tabla-scroll"><table>
                <thead><tr><th style={thp}>Persona</th><th style={thp}>Categoría</th><th style={thp}>Grupo</th><th style={Object.assign({}, thp,{textAlign:"right"})}>Horas</th><th style={Object.assign({}, thp,{textAlign:"right"})}>%</th></tr></thead>
                <tbody>
                  {ts.slice().sort(function(a,b){ var pa=d.personas.find(function(x){return x.id===a.personaId;}); var pb=d.personas.find(function(x){return x.id===b.personaId;}); return byname(pa||{apellidos:"",nombre:""}, pb||{apellidos:"",nombre:""}); }).map(function(t){
                    var p=d.personas.find(function(x){ return x.id===t.personaId; }); var c=catById[t.categoriaId];
                    return <tr key={t.id}>
                      <td style={Object.assign({}, tdp,{fontWeight:600,color:C.titulo})}>{p?nomP(p):"—"}</td>
                      <td style={tdp}>{c?nombreDe(c):"—"}</td>
                      <td style={tdp}>{c?c.grupoCuadre:""}</td>
                      <td style={Object.assign({}, tdp,{textAlign:"right"})}>{r2(horasT(t))}</td>
                      <td style={Object.assign({}, tdp,{textAlign:"right"})}>{r2(num(t.porcentaje))}%</td>
                    </tr>;
                  })}
                  {ts.length===0 ? <tr><td colSpan="5" style={Object.assign({}, tdp,{color:C.secundario})}>Sin tramos en esta fuente.</td></tr> : null}
                  <tr><td colSpan="3" style={Object.assign({}, tdp,{fontWeight:700,textAlign:"right",borderTop:"2px solid "+C.borde})}>TOTAL horas</td><td style={Object.assign({}, tdp,{textAlign:"right",fontWeight:700,borderTop:"2px solid "+C.borde})}>{r2(totH)}</td><td style={{borderTop:"2px solid "+C.borde}}></td></tr>
                </tbody>
              </table></div>
            </div>
          );
        }) : null}

        {formato==="cuadre" ? (
          <div className="ficha" style={{background:"#fff", border:"1px solid "+C.borde, borderRadius:10, padding:"20px 22px"}}>
            <CabeceraPapel titulo="Resumen de cuadre" curso={d.curso} />
            <div style={{fontSize:13, fontWeight:700, color:C.titulo, marginBottom:6}}>Por grupo</div>
            <div className="tabla-scroll"><table style={{marginBottom:18}}>
              <thead><tr><th style={thp}>Grupo</th><th style={Object.assign({}, thp,{textAlign:"right"})}>Fin. FTE</th><th style={Object.assign({}, thp,{textAlign:"right"})}>Asig. FTE</th><th style={Object.assign({}, thp,{textAlign:"right"})}>Dif FTE</th><th style={Object.assign({}, thp,{textAlign:"right"})}>Dif h</th></tr></thead>
              <tbody>
                {grupos.map(function(g){ var dif=(finG[g]||0)-(asgG[g]||0); var difH=(finGH[g]||0)-(asgGH[g]||0); return (
                  <tr key={g}>
                    <td style={Object.assign({}, tdp,{fontWeight:600,color:C.titulo})}>{g}</td>
                    <td style={Object.assign({}, tdp,{textAlign:"right"})}>{r2(finG[g]||0)}</td>
                    <td style={Object.assign({}, tdp,{textAlign:"right"})}>{r2(asgG[g]||0)}</td>
                    <td style={Object.assign({}, tdp,{textAlign:"right", color:semColorDif(dif), fontWeight:700})}>{dif>=0?"+":""}{r2(dif)}</td>
                    <td style={Object.assign({}, tdp,{textAlign:"right", color:semColorDif(dif)})}>{difH>=0?"+":""}{r2(difH)}</td>
                  </tr>
                ); })}
              </tbody>
            </table></div>

function PrlCalc(props){
  var d = props.data; var P = d.prl;
  function setP(campo, val){ var o={}; o[campo]=num(val); props.setData(Object.assign({}, d, {prl:Object.assign({}, P, o)})); }
  function setMes(i, campo, val){ var meses=P.meses.map(function(m,j){ if(j!==i) return m; var nm=Object.assign({}, m); nm[campo]=num(val); return nm; }); props.setData(Object.assign({}, d, {prl:Object.assign({}, P, {meses:meses})})); }
  var caPrim = prlCoste(P.perfiles.prim, P).costeAnio, caEso = prlCoste(P.perfiles.eso, P).costeAnio;
  var hb = num(P.horasBase);
  /* Horas y coste REALES desde el reparto (asignaciones a PRL EP / PRL ES) */
  var cats={}; (d.categorias||[]).forEach(function(c){ cats[c.id]=c; });
  var horasAsigEP=0, horasAsigES=0, costeAnualEP=0, costeAnualES=0;
  (d.tramos||[]).forEach(function(t){
    var c=cats[t.categoriaId]; if(!c) return;
    var nom=(c.nombreEs||"")+" "+(c.nombreEu||"");
    if(/PRL/i.test(nom)){
      var h = num(t.porcentaje)/100 * horasBaseDe(d, c);
      if(c.etapaReparto==="secundaria"){ horasAsigES += h; costeAnualES += num(t.porcentaje)/100 * caEso; }
      else { horasAsigEP += h; costeAnualEP += num(t.porcentaje)/100 * caPrim; }
    }
  });
  /* coste MENSUAL = coste anual / 12 (las 2 pagas extra ya están prorrateadas en el coste-año) */
  var costeMesEP = costeAnualEP/12, costeMesES = costeAnualES/12;
  var costeMesTotal = costeMesEP + costeMesES;
  function calc(m){
    var tot = num(m.alumEP)+num(m.alumES);
    var presup = tot*num(P.ari)*(num(P.becarios)+num(P.coef));
    /* el coste ya no depende de las horas tecleadas: es el coste mensual del reparto */
    var coste = costeMesTotal;
    return { tot:tot, presup:presup, coste:coste, dif:presup-coste, prorr:presup*num(P.prorrateo)/100-coste };
  }
  var sumP=0, sumC=0, sumD=0;
  P.meses.forEach(function(m){ var r=calc(m); sumP+=r.presup; sumC+=r.coste; sumD+=r.dif; });
  function pc(label, campo, w){ return <div style={{display:"flex", flexDirection:"column", gap:3}}><label style={S.label}>{label}</label><NumInput value={P[campo]} style={Object.assign({}, S.input, {width:w||90})} onCommit={function(v){ setP(campo, v); }} /></div>; }
  var thn = {textAlign:"right"};
  return (
    <div>
      <h4 style={{fontSize:14, color:C.secundario, textTransform:"uppercase", letterSpacing:".04em", marginBottom:4}}>Presupuesto PRL mensual</h4>
      <p style={{margin:"0 0 12px", color:C.secundario, fontSize:J}}>Presupuesto = alumnos × ARI × (becarios + coeficiente), por mes. El <b>coste</b> y las <b>horas asignadas</b> salen del reparto de jornadas (categorías PRL EP y PRL ES); el coste mensual es el coste-año ÷ 12. Coste año PRIM <b>{r2(caPrim)}</b> · ESO <b>{r2(caEso)}</b> (pestaña Coste).</p>
      <div style={{display:"flex", flexWrap:"wrap", gap:14, marginBottom:14}}>
        {pc("ARI (€)","ari",90)}
        {pc("Becarios","becarios",90)}
        {pc("Coeficiente","coef",90)}
        {pc("Prorrateo %","prorrateo",90)}
      </div>
      <div style={Object.assign({}, S.card, {padding:0, overflow:"hidden"})}>
        <div style={{overflowX:"auto"}}>
          <div className="tabla-scroll"><table style={{fontSize:J}}>
            <thead><tr>
              <th>Mes</th><th className="num">Alum. EP</th><th className="num">Alum. ES</th><th className="num">Horas asig. EP</th><th className="num">Horas asig. ES</th>
              <th className="num">Presupuesto</th><th className="num">Coste</th><th className="num">Diferencia</th><th className="num">Prorr. {r2(P.prorrateo)}%</th>
            </tr></thead>
            <tbody>
              {P.meses.map(function(m, i){
                var r = calc(m);
                return (
                  <tr key={i}>
                    <td style={{fontWeight:600, color:C.titulo, whiteSpace:"nowrap"}}>{m.nombre}</td>
                    <td style={{padding:2}}><NumInput value={m.alumEP} style={Object.assign({}, S.input, {width:64})} onCommit={function(v){ setMes(i,"alumEP",v); }} /></td>
                    <td style={{padding:2}}><NumInput value={m.alumES} style={Object.assign({}, S.input, {width:64})} onCommit={function(v){ setMes(i,"alumES",v); }} /></td>
                    <td className="num" style={{color:C.secundario}}>{r2(horasAsigEP)}</td>
                    <td className="num" style={{color:C.secundario}}>{r2(horasAsigES)}</td>
                    <td className="num">{r2(r.presup)}</td>
                    <td className="num">{r2(r.coste)}</td>
                    <td className="num" style={{color:r.dif>=0?C.ok:C.peligro, fontWeight:600}}>{r2(r.dif)}</td>
                    <td className="num" style={{color:r.prorr>=0?C.ok:C.peligro}}>{r2(r.prorr)}</td>
                  </tr>
                );
              })}
              <tr style={{borderTop:"2px solid "+C.borde}}>
                <td style={{fontWeight:700, color:C.titulo}}>TOTAL</td>
                <td></td><td></td><td></td><td></td>
                <td className="num" style={{fontWeight:700, color:C.titulo}}>{r2(sumP)}</td>

function PlusesCalc(props){
  var d = props.data; var pl = d.pluses;
  function setPL(patch){ props.setData(Object.assign({}, d, {pluses:Object.assign({}, pl, patch)})); }
  function setEtapa(i, campo, val){ var et=pl.etapas.map(function(e,j){ if(j!==i) return e; var ne=Object.assign({}, e); ne[campo]=(campo==="nombre")?val:num(val); return ne; }); setPL({etapas:et}); }
  function setCargo(id, campo, val){ var cg=pl.cargos.map(function(c){ if(c.id!==id) return c; var nc=Object.assign({}, c); nc[campo]=(campo==="n")?num(val):val; return nc; }); setPL({cargos:cg}); }
  function setPres(id, ei, val){ var cg=pl.cargos.map(function(c){ if(c.id!==id) return c; var pr=c.pres.slice(); pr[ei]=num(val); return Object.assign({}, c, {pres:pr}); }); setPL({cargos:cg}); }
  function addCargo(){ setPL({cargos:pl.cargos.concat([{id:uid("cgp"), nombre:"", cargo:"", n:0, pres:[0,0,0,0,0]}])}); }
  function delCargo(id){ setPL({cargos:pl.cargos.filter(function(c){ return c.id!==id; })}); }
  var R = plusesCalc(pl);
  return (
    <div>
      <h4 style={{fontSize:14, color:C.secundario, textTransform:"uppercase", letterSpacing:".04em", marginBottom:4}}>Pluses por etapa</h4>
      <p style={{margin:"0 0 10px", color:C.secundario, fontSize:J}}>Nº de unidades × €/plus/mes/unidad. El total se reparte entre los cargos según su presencia ponderada por el % de acuerdo.</p>
      <div style={Object.assign({}, S.card, {padding:0, overflow:"hidden", maxWidth:620, marginBottom:22})}>
        <div className="tabla-scroll"><table>
          <thead><tr><th>Etapa</th><th className="num">Nº unidades</th><th className="num">€/unidad/mes</th><th className="num">Total/mes</th></tr></thead>
          <tbody>
            {pl.etapas.map(function(e,i){ return (
              <tr key={i}>
                <td style={{padding:2}}><input style={Object.assign({}, S.input, {width:120})} value={e.nombre} onChange={function(ev){ setEtapa(i,"nombre",ev.target.value); }} /></td>
                <td style={{padding:2}}><NumInput value={e.unidades} style={Object.assign({}, S.input, {width:80})} onCommit={function(v){ setEtapa(i,"unidades",v); }} /></td>
                <td style={{padding:2}}><NumInput value={e.euros} style={Object.assign({}, S.input, {width:90})} onCommit={function(v){ setEtapa(i,"euros",v); }} /></td>
                <td className="num" style={{fontWeight:600, color:C.titulo}}>{r2(R.totEt[i])}</td>
              </tr>
            ); })}
            <tr style={{borderTop:"2px solid "+C.borde}}><td style={{fontWeight:700, color:C.titulo}}>TOTAL/mes</td><td></td><td></td><td className="num" style={{fontWeight:700, color:C.azul}}>{r2(R.grand)}</td></tr>
          </tbody>
        </table></div>
      </div>

      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
        <h4 style={{fontSize:14, color:C.secundario, textTransform:"uppercase", letterSpacing:".04em", margin:0}}>Reparto por cargo <InfoBtn info={INFO.pluses} vigencia={"tablas de convenio " + d.convenio.anio} /></h4>
        <button style={S.btn} onClick={addCargo}>+ Cargo</button>
      </div>
      <p style={{margin:"0 0 10px", color:C.secundario, fontSize:J}}>N% = porcentaje de acuerdo del equipo directivo. Bajo cada etapa, el % de presencia del cargo en esa etapa.</p>
      {(function(){
        var topes = (d.convenio && Array.isArray(d.convenio.cargos)) ? d.convenio.cargos : [];
        if(!topes.length) return null;
        var maxTope = topes.reduce(function(a,x){ return Math.max(a, num(x.plus)); }, 0);
        var pasados = [];
        pl.cargos.forEach(function(c, ci){
          var rr = R.rows[ci];
          if(!rr) return;
          var nom = (c.cargo||c.nombre||"").toLowerCase();
          var t = null;
          topes.forEach(function(x){
            var tn = (x.nombre||"").toLowerCase();
            if(t===null && nom && tn && (tn.indexOf(nom.split(" ")[0])>=0 || nom.indexOf(tn.split(" ")[0])>=0)) t = num(x.plus);
          });
          if(t===null) t = maxTope;
          if(rr.total > t + 0.01) pasados.push({nombre:(c.nombre||c.cargo||"(sin nombre)"), asignado:rr.total, tope:t});
        });
        if(!pasados.length) return (
          <div style={{background:C.okBg, border:"1px solid "+C.ok, borderRadius:8, padding:"8px 12px", marginBottom:12, fontSize:J, color:C.okText}}>
            ✓ Ningún cargo supera su tope legal de plus.
          </div>
        );
        return (
          <div style={{background:C.peligroBg, border:"1px solid "+C.peligro, borderRadius:8, padding:"9px 12px", marginBottom:12, fontSize:J, color:C.peligroText}}>
            <b>⚠ Tope legal superado</b> — la suma del plus por profesor no puede pasar del importe del convenio para el nivel más alto en que ejerza el cargo (circular de funcionamiento del pago delegado):
            <ul style={{margin:"5px 0 0", paddingLeft:18}}>
              {pasados.map(function(x, i){ return <li key={i}><b>{x.nombre}</b>: {r2(x.asignado)} € asignados · tope {r2(x.tope)} € (<b>{r2(x.asignado-x.tope)} € de más</b>)</li>; })}
            </ul>
          </div>
        );
      })()}
      <div style={Object.assign({}, S.card, {padding:0, overflow:"hidden"})}>
        <div style={{overflowX:"auto"}}>
          <div className="tabla-scroll"><table style={{fontSize:J}}>
            <thead><tr>
              <th>Nombre</th><th>Cargo</th><th className="num">N%</th>
              {pl.etapas.map(function(e,i){ return <th key={i} className="num" style={{whiteSpace:"nowrap"}}>{e.nombre} %</th>; })}
              <th className="num">Total €</th><th className="num">Acuerdo €</th><th className="num">Dif</th><th></th>
            </tr></thead>
            <tbody>
              {pl.cargos.map(function(c, ci){
                var rr = R.rows[ci];
                return (
                  <tr key={c.id}>
                    <td style={{padding:2}}><input style={Object.assign({}, S.input, {width:130})} value={c.nombre} placeholder="(nombre)" onChange={function(ev){ setCargo(c.id,"nombre",ev.target.value); }} /></td>
                    <td style={{padding:2}}><input style={Object.assign({}, S.input, {width:150})} value={c.cargo} onChange={function(ev){ setCargo(c.id,"cargo",ev.target.value); }} /></td>
                    <td style={{padding:2}}><NumInput value={c.n} style={Object.assign({}, S.input, {width:56})} onCommit={function(v){ setCargo(c.id,"n",v); }} /></td>
                    {pl.etapas.map(function(e, ei){ return <td key={ei} style={{padding:2}}><NumInput value={c.pres[ei]} style={Object.assign({}, S.input, {width:56})} onCommit={function(v){ setPres(c.id, ei, v); }} /></td>; })}
                    <td className="num" style={{fontWeight:600, color:C.titulo}}>{r2(rr.total)}</td>
                    <td className="num" style={{color:C.secundario}}>{r2(rr.acuerdo)}</td>
                    <td className="num" style={{fontWeight:600, color: Math.abs(rr.dif)<0.01?C.ok:(rr.dif>0?CALM:C.aviso)}}>{rr.dif>=0?"+":""}{r2(rr.dif)}</td>
                    <td><button style={S.btnDel} onClick={function(){ delCargo(c.id); }}>✕</button></td>
                  </tr>
                );
              })}
              <tr style={{borderTop:"2px solid "+C.borde}}>
                <td style={{fontWeight:700, color:C.titulo}} colSpan="3">TOTAL repartido</td>
                {pl.etapas.map(function(e, ei){ return <td key={ei} className="num" style={{fontWeight:600, color:C.secundario}}>{r2(R.sumEt[ei])}</td>; })}
                <td className="num" style={{fontWeight:700, color:C.azul}}>{r2(R.grand)}</td>
                <td></td><td></td><td></td>
              </tr>
            </tbody>
          </table></div>
        </div>
      </div>
      <p style={{fontSize:11, color:C.secundario, marginTop:8}}>El "Total €" de cada cargo es lo que percibe según su presencia; "Acuerdo €" es lo que le correspondería por su N%; "Dif" es el ajuste entre ambos.</p>
    </div>
  );
}

      {tab==="convenio" && <ConvenioCfg data={props.data} setData={props.setData} toast={props.toast} />}
      {tab==="formacion" && <FormacionCfg data={props.data} setData={props.setData} toast={props.toast} />}
    </div>
  );
}

function CalcFlotante(props){
  var d = props.data;
  function copiaRapida(){
    try{
      var blob = new Blob([JSON.stringify(d, null, 1)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "datos_EAMI_" + (d.cursoNombre||d.curso||"curso") + "_" + hoyISO() + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      if(props.toast) props.toast("Copia de seguridad descargada","ok");
    }catch(e){ if(props.toast) props.toast("No se pudo descargar","error"); }
  }
  var [open, setOpen] = useState(false);       /* menú de herramientas abierto */
  var [tool, setTool] = useState("");          /* "" | "calc" | "buscar" — herramienta activa */
  var [q, setQ] = useState("");                /* texto del buscador */
  var [colec, setColec] = useState("primaria");
  var [campo, setCampo] = useState("pct");
  var [valor, setValor] = useState("");
  var J = d.jornadas || {};
  function tipoDocente(txt){ var res=null; (J.tipos||[]).forEach(function(t){ if(t.modo==="docente" && (t.nombre||"").toLowerCase().indexOf(txt)>=0) res=t; }); return res; }
  /* Config por colectivo: jornada laboral total (base del %) y, si es docente, su desglose */
  var COLECTIVOS = {
    primaria:   { label:"Prim/Inf", docente:true,  jornada:32 },
    secundaria: { label:"Secund.",  docente:true,  jornada:32 },
    eae:        { label:"EAE",       docente:false, jornada:35 },
    teji:       { label:"TEJI",      docente:false, jornada:38 },
    pas:        { label:"PAS",       docente:false, jornada:40 }
  };
  var cfg = COLECTIVOS[colec] || COLECTIVOS.primaria;
  var esDocCalc = cfg.docente;
  var tE = esDocCalc ? (tipoDocente(colec==="primaria"?"primaria":"secundaria") || {jornada:32, lectivas:(colec==="primaria"?23:22), personal:5}) : null;
  /* jornada laboral total = base del % (docentes 32, EAE 35, TEJI 38, PAS 40) */
  var jornadaTotal = esDocCalc ? num(tE.jornada) : cfg.jornada;
  var rLect = esDocCalc ? num(tE.lectivas) : 0;
  var rComp = esDocCalc ? (num(tE.jornada)-num(tE.lectivas)-num(tE.personal)) : 0;
  var rPers = esDocCalc ? num(tE.personal) : 0;
  /* factores: cuánto vale el 100% de cada campo. El % SIEMPRE se calcula sobre la jornada laboral total. */
  var factor = { pct:1, jornada:jornadaTotal, lectivas:rLect, comple:rComp, personal:rPers };
  var f = campo==="pct" ? num(valor)/100 : (factor[campo]>0 ? num(valor)/factor[campo] : 0);
  function val(k){ if(campo===k) return valor; if(!valor) return ""; return k==="pct" ? String(r2(f*100)) : String(r2(f*factor[k])); }
  function set(k, v){ setCampo(k); setValor(v); }
  var campos = esDocCalc ? [
    {k:"pct", t:"% jornada"},
    {k:"jornada", t:"Jornada total (h)"},
    {k:"lectivas", t:"Lectivas (h)"},
    {k:"comple", t:"Complementarias (h)"},
    {k:"personal", t:"Trabajo personal (h)"}
  ] : [
    {k:"pct", t:"% jornada"},
    {k:"jornada", t:"Horas de trabajo (h)"}
  ];
  return (
    <div className="no-print">
      {/* Panel del buscador */}
      {tool==="buscar" ? (function(){
        var r = buscarGlobal(d, q);
        var nada = q.length>=2 && !r.personas.length && !r.categorias.length && !r.secciones.length;
        return (
          <div style={{position:"fixed", bottom:74, right:20, width:340, maxHeight:"70vh", overflowY:"auto", background:"#fff", border:"1px solid "+C.borde, borderRadius:14, boxShadow:"0 12px 32px rgba(30,58,95,.18)", padding:14, zIndex:61}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
              <span style={{fontFamily:"'Source Serif 4',serif", fontWeight:700, color:C.titulo}}>Buscar</span>
              <button onClick={function(){ setTool(""); setQ(""); }} style={{border:"none", background:"transparent", color:C.secundario, cursor:"pointer", fontSize:O}}>✕</button>
            </div>
            <input autoFocus style={Object.assign({}, S.input, {width:"100%", marginBottom:10})} placeholder="Persona, categoría o palabra clave…" value={q} onChange={function(e){ setQ(e.target.value); }} />
            {q.length<2 ? <p style={{fontSize:11, color:C.secundario, margin:0}}>Escribe al menos 2 letras. Prueba con un nombre, una categoría, o palabras como \"premio\", \"subvención\", \"vacaciones\"…</p> : null}
            {nada ? <p style={{fontSize:12, color:C.secundario, margin:0}}>Sin resultados para \""+q+"\".</p> : null}

            {r.personas.length ? (
              <div style={{marginBottom:10}}>
                <div style={{fontSize:10.5, color:C.secundario, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", marginBottom:4}}>Personas ({r.personas.length})</div>
                {r.personas.slice(0,8).map(function(pp){
                  return <button key={pp.id} onClick={function(){ setTool(""); setQ(""); setOpen(false); if(props.onNavegar) props.onNavegar("personas"); }} style={{display:"flex", alignItems:"center", gap:8, width:"100%", border:"none", background:"transparent", borderRadius:7, padding:"6px 8px", cursor:"pointer", textAlign:"left"}}>
                    <span style={{width:24, height:24, borderRadius:"50%", background:colorCatLab(d,pp), color:"#fff", fontSize:10, fontWeight:700, display:"inline-flex", alignItems:"center", justifyContent:"center", flexShrink:0}}>{siglaDe(pp)}</span>
                    <span style={{fontSize:13, color:C.titulo}}>{(pp.apellidos+", "+pp.nombre).replace(/^, |, $/,"")}</span>
                  </button>;
                })}
              </div>
            ) : null}

            {r.categorias.length ? (
              <div style={{marginBottom:10}}>
                <div style={{fontSize:10.5, color:C.secundario, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", marginBottom:4}}>Categorías ({r.categorias.length})</div>
                {r.categorias.slice(0,6).map(function(cc){
                  return <button key={cc.id} onClick={function(){ setTool(""); setQ(""); setOpen(false); if(props.onNavegar) props.onNavegar("config"); }} style={{display:"block", width:"100%", border:"none", background:"transparent", borderRadius:7, padding:"6px 8px", cursor:"pointer", textAlign:"left", fontSize:13, color:C.titulo}}>
                    {cc.nombreEs}{cc.grupoCuadre?<span style={{color:C.secundario}}> · {cc.grupoCuadre}</span>:null}
                  </button>;
                })}
              </div>
            ) : null}

            {r.secciones.length ? (
              <div>
                <div style={{fontSize:10.5, color:C.secundario, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", marginBottom:4}}>Ir a…</div>
                {r.secciones.slice(0,6).map(function(sec, i){
                  return <button key={i} onClick={function(){ setTool(""); setQ(""); setOpen(false); if(props.onNavegar) props.onNavegar(sec.fase); }} style={{display:"flex", alignItems:"center", gap:8, width:"100%", border:"none", background:C.infoBg, borderRadius:7, padding:"7px 9px", cursor:"pointer", textAlign:"left", marginBottom:4, fontSize:13, color:C.azul, fontWeight:600}}>
                    → {sec.seccion}
                  </button>;
                })}
              </div>
            ) : null}
          </div>
        );
      })() : null}

      {/* Panel de la calculadora (solo si la herramienta activa es calc) */}
      {tool==="calc" ? (
        <div style={{position:"fixed", bottom:74, right:20, width:280, background:"#fff", border:"1px solid "+C.borde, borderRadius:14, boxShadow:"0 12px 32px rgba(30,58,95,.18)", padding:16, zIndex:61}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
            <span style={{fontFamily:"'Source Serif 4',serif", fontWeight:700, color:C.titulo}}>Reparto de jornada</span>
            <button onClick={function(){ setTool(""); }} style={{border:"none", background:"transparent", color:C.secundario, cursor:"pointer", fontSize:O}}>✕</button>
          </div>
          <div style={{marginBottom:8}}>
            <select value={colec} onChange={function(e){ setColec(e.target.value); }} style={Object.assign({}, S.input, {width:"100%"})}>
              <option value="primaria">Docente · Primaria/Infantil (32 h)</option>
              <option value="secundaria">Docente · Secundaria (32 h)</option>
              <option value="eae">EAE (35 h)</option>
              <option value="teji">TEJI (38 h)</option>
              <option value="pas">PAS (40 h)</option>
            </select>
          </div>
          <p style={{fontSize:11, color:C.secundario, margin:"0 0 10px"}}>El % se calcula sobre la jornada laboral total. Escribe en cualquier campo y se recalculan los demás.</p>
          {campos.map(function(field){
            return (
              <div key={field.k} style={{display:"flex", alignItems:"center", gap:8, marginBottom:7}}>
                <label style={{flex:1, fontSize:J, color: campo===field.k?C.azul:C.secundario, fontWeight: campo===field.k?700:500}}>{field.t}</label>
                <input className="num" style={Object.assign({}, S.input, {width:84, borderColor: campo===field.k?C.azul:C.borde})} value={val(field.k)} onChange={function(e){ set(field.k, e.target.value); }} placeholder="0" />
              </div>
            );
          })}
          <button onClick={function(){ setValor(""); }} style={Object.assign({}, S.btn, {width:"100%", marginTop:4, padding:"6px"})}>Limpiar</button>
        </div>
      ) : null}

      {/* Menú de herramientas */}
      {open ? (
        <div style={{position:"fixed", bottom:74, right:20, width:230, background:"#fff", border:"1px solid "+C.borde, borderRadius:14, boxShadow:"0 12px 32px rgba(30,58,95,.18)", padding:8, zIndex:60}}>
          <div style={{fontSize:11, color:C.secundario, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", padding:"6px 10px 4px"}}>Herramientas</div>
          <button onClick={function(){ setTool("buscar"); setOpen(false); }} style={{display:"flex", alignItems:"center", gap:10, width:"100%", border:"none", background: tool==="buscar"?C.zona2:"transparent", borderRadius:8, padding:"9px 10px", cursor:"pointer", fontSize:13, color:C.titulo, textAlign:"left"}}>
            <span style={{fontSize:17}}>🔍</span> Buscar
          </button>
          <button onClick={function(){ setTool(tool==="calc"?"":"calc"); setOpen(false); }} style={{display:"flex", alignItems:"center", gap:10, width:"100%", border:"none", background: tool==="calc"?C.zona2:"transparent", borderRadius:8, padding:"9px 10px", cursor:"pointer", fontSize:13, color:C.titulo, textAlign:"left"}}>
            <span style={{fontSize:17}}>🧮</span> Calculadora de reparto
          </button>
          <button onClick={function(){ setOpen(false); if(props.onHistorial) props.onHistorial(); }} style={{display:"flex", alignItems:"center", gap:10, width:"100%", border:"none", background:"transparent", borderRadius:8, padding:"9px 10px", cursor:"pointer", fontSize:13, color:C.titulo, textAlign:"left"}}>
            <span style={{fontSize:17}}>🕘</span> Historial de cambios
          </button>
          <button onClick={function(){ setOpen(false); copiaRapida(); }} style={{display:"flex", alignItems:"center", gap:10, width:"100%", border:"none", background:"transparent", borderRadius:8, padding:"9px 10px", cursor:"pointer", fontSize:13, color:C.titulo, textAlign:"left"}}>
            <span style={{fontSize:17}}>💾</span> Copia de seguridad
          </button>
          <button onClick={function(){ setOpen(false); if(props.onAyuda) props.onAyuda(); }} style={{display:"flex", alignItems:"center", gap:10, width:"100%", border:"none", background:"transparent", borderRadius:8, padding:"9px 10px", cursor:"pointer", fontSize:13, color:C.titulo, textAlign:"left"}}>
            <span style={{fontSize:17}}>❓</span> Ayuda
          </button>
          <div style={{borderTop:"1px solid "+C.borde, margin:"4px 6px"}}></div>
          <button onClick={function(){ setOpen(false); setTimeout(function(){ window.print(); }, 150); }} style={{display:"flex", alignItems:"center", gap:10, width:"100%", border:"none", background:"transparent", borderRadius:8, padding:"9px 10px", cursor:"pointer", fontSize:13, color:C.titulo, textAlign:"left"}}>
            <span style={{fontSize:17}}>🖨️</span> Imprimir esta pantalla
          </button>
        </div>
      ) : null}

      {/* Botón flotante de Herramientas */}
      <button onClick={function(){ setOpen(!open); }} title="Herramientas"
        style={{position:"fixed", bottom:20, right:20, width:48, height:48, borderRadius:"50%", border:"none", background: (open||tool)?C.titulo:C.azul, color:"#fff", fontSize:20, cursor:"pointer", boxShadow:"0 6px 18px rgba(43,94,167,.4)", zIndex:62}}>🧰</button>
    </div>
  );
}

function IncidenciasView(props){
  var d = props.data;
  var TIPOS = ["Baja médica","Maternidad/Paternidad","Reducción función directiva","Vacaciones no disfrutadas","Excedencia","Días sin sueldo","Reducción de jornada","Sustitución","Otro"];
  /* quién financia la sustitución por defecto según el tipo (editable en cada incidencia) */
  var PAGA_DEFECTO = {
    "Baja médica":"pd", "Maternidad/Paternidad":"pd", "Reducción función directiva":"pd",
    "Vacaciones no disfrutadas":"centro", "Excedencia":"centro", "Días sin sueldo":"centro",
    "Reducción de jornada":"centro", "Sustitución":"centro", "Otro":"centro"
  };
  var [form, setForm] = useState(null);
  var [fPersona, setFPersona] = useState("");
  var [fTipo, setFTipo] = useState("");
  function byname(a,b){ return cmpPersona(a,b); }
  var personas = d.personas.slice().sort(byname);
  function nomP(id){ var p=d.personas.find(function(x){ return x.id===id; }); return p?((p.apellidos+", "+p.nombre).replace(/^, |, $/,"")):"—"; }
  function nuevo(){ setForm({id:null, personaId:"", tipo:TIPOS[0], desde:"", hasta:"", abierta:false, cantidad:0, unidad:"pct", categoriaId:"", sustitutoId:"", quienPaga:"pd", aplicada:false, notas:""}); }
  function editar(x){ setForm(Object.assign({}, x)); }
  function setF(campo, val){ var o=Object.assign({}, form); o[campo]=val; if(campo==="tipo" && PAGA_DEFECTO[val]) o.quienPaga=PAGA_DEFECTO[val]; setForm(o); }
  function setFm(patch){ setForm(Object.assign({}, form, patch)); }
  function guardar(){
    if(!form.personaId){ props.toast("Elige una persona","error"); return; }
    var f = Object.assign({}, form);
    if(f.abierta) f.hasta = "";
    var esNueva = !f.id;
    var anterior = esNueva ? null : (d.incidencias.filter(function(z){ return z.id===f.id; })[0] || null);
    if(!f.id) f.id = uid("inc");
    var sustCambio = anterior && anterior.sustitutoId && anterior.sustitutoId!==f.sustitutoId;

    /* Aviso claro sobre lo que se hará automáticamente en las fichas (sin tocar el montaje) */
    if(f.sustitutoId && num(f.cantidad)>0){
      var horas = horasSustitucionDe(d, f);
      var lineas = [];
      lineas.push("Se registrará la incidencia en la ficha de "+nomP(f.personaId)+".");
      if(sustCambio){ lineas.push("Se QUITARÁ el contrato de "+nomP(anterior.sustitutoId)+" (sustituto/a anterior)."); }
      lineas.push("Se "+(sustCambio?"CREARÁ":"creará/actualizará")+" el contrato de "+nomP(f.sustitutoId)+" con "+r2(horas)+" h ("+r2(f.cantidad)+(f.unidad==="horas"?" h":"%")+" de "+nomP(f.personaId)+").");
      lineas.push("");
      lineas.push("El reparto de jornadas NO se modifica: el 100% sigue siendo de "+nomP(f.personaId)+".");
      if(!window.confirm("Al aceptar, automáticamente:\n\n· "+lineas.join("\n· ").replace("· \n· ","\n"))) return;
    }

    f.aplicada = true;   /* en el nuevo modelo, una incidencia con sustituto ya genera su contrato: se considera activa */
    var inc = esNueva ? d.incidencias.concat([f]) : d.incidencias.map(function(z){ return z.id===f.id?f:z; });
    var nd = Object.assign({}, d, {incidencias:inc});

    /* si cambió el sustituto, limpiar el contrato del anterior */
    if(sustCambio){ nd = Object.assign({}, nd, {personas: limpiarContratosDeIncidencia(nd.personas, f.id)}); }
    /* crear/actualizar el contrato del sustituto actual (sin tocar el reparto) */
    if(f.sustitutoId && num(f.cantidad)>0){ nd = Object.assign({}, nd, {personas: sincronizarContratoSustituto(nd, f)}); }

    props.setData(nd);
    setForm(null); props.toast("Incidencia guardada"+(f.sustitutoId?" y contrato sincronizado":""),"ok");
  }
  function reincorporar(x){
    var f = window.prompt("Fecha de reincorporación (AAAA-MM-DD):", hoyISO());
    if(!f) return;
    props.setData(Object.assign({}, d, {incidencias:d.incidencias.map(function(z){ return z.id===x.id?Object.assign({}, z, {hasta:f, abierta:false}):z; })}));
    props.toast("Incidencia cerrada", "ok");
  }
  function contratoSustituto(x){
    if(!x.sustitutoId){ props.toast("Esta incidencia no tiene sustituto/a","aviso"); return; }
    var horas = horasSustitucionDe(d, x);
    var sust = d.personas.find(function(p){ return p.id===x.sustitutoId; });
    var yaExiste = sust && (sust.contratos||[]).some(function(k){ return k.incidenciaId===x.id; });
    var msg = (yaExiste ? "¿Actualizar" : "¿Crear") + " el contrato de " + nomP(x.sustitutoId) + "?\n\n"
      + "· " + r2(x.cantidad) + (x.unidad==="horas"?" h":"%") + " de " + nomP(x.personaId)
      + " = " + r2(horas) + " h\n"
      + "· Vigencia: " + (x.desde||"?") + (x.hasta ? (" a " + x.hasta) : " (indefinido)") + "\n\n"
      + "Se " + (yaExiste?"actualizará":"añadirá") + " en su ficha, ligado a esta incidencia. No afecta a sus otros contratos.";
    if(!window.confirm(msg)) return;
    var nuevasPersonas = sincronizarContratoSustituto(d, x);
    props.setData(Object.assign({}, d, {personas:nuevasPersonas}));
    props.toast((yaExiste?"Contrato actualizado":"Contrato creado")+" para "+nomP(x.sustitutoId), "ok");
  }
  function borrar(id){
    var inc = d.incidencias.filter(function(z){ return z.id===id; })[0];
    /* ¿hay contratos ligados a esta incidencia en alguna ficha? */
    var conLigado = inc && (d.personas||[]).some(function(pp){ return (pp.contratos||[]).some(function(k){ return k.incidenciaId===id; }); });
    if(conLigado){
      var quien = inc.sustitutoId ? nomP(inc.sustitutoId) : "el sustituto/a";
      if(!window.confirm("Al eliminar esta incidencia, automáticamente:\n\n· Se borrará la incidencia de la ficha de "+nomP(inc.personaId)+".\n· Se limpiará el contrato vinculado en la ficha de "+quien+".\n\nEl reparto de jornadas no se modifica.")) return;
    }
    var nd = Object.assign({}, d, {incidencias:d.incidencias.filter(function(z){ return z.id!==id; })});
    nd = Object.assign({}, nd, {personas: limpiarContratosDeIncidencia(nd.personas, id)});
    props.setData(nd);
    props.toast("Incidencia eliminada"+(conLigado?" y contrato vinculado limpiado":""), "ok");
  }
  var lista = d.incidencias.slice();
  if(fPersona) lista = lista.filter(function(x){ return x.personaId===fPersona; });
  if(fTipo) lista = lista.filter(function(x){ return x.tipo===fTipo; });
  lista.sort(function(a,b){ return String(b.desde||"").localeCompare(String(a.desde||"")); });

  return (
    <div>
      <div style={{display:"flex", flexWrap:"wrap", gap:10, alignItems:"center", marginBottom:16}}>
        <button style={S.btnPri} onClick={nuevo}>+ Nueva incidencia</button>
        <div style={{flex:1}} />
        <select style={Object.assign({}, S.input, {width:200})} value={fPersona} onChange={function(e){ setFPersona(e.target.value); }}>
          <option value="">Todas las personas</option>
          {personas.map(function(p){ return <option key={p.id} value={p.id}>{nomP(p.id)}</option>; })}
        </select>
        <select style={Object.assign({}, S.input, {width:180})} value={fTipo} onChange={function(e){ setFTipo(e.target.value); }}>
          <option value="">Todos los tipos</option>
          {TIPOS.map(function(t){ return <option key={t} value={t}>{t}</option>; })}
        </select>
      </div>

      {form ? (
        <div style={Object.assign({}, S.card, {padding:"16px 18px", marginBottom:18})}>
          <div style={{fontFamily:"'Source Serif 4',serif", fontWeight:700, color:C.titulo, fontSize:O, marginBottom:12}}>{form.id?"Editar incidencia":"Nueva incidencia"}</div>
          <div style={{display:"flex", flexWrap:"wrap", gap:12}}>
            <div style={{flex:"1 1 200px"}}>
              <label style={S.label}>Persona que solicita</label>
              <select style={S.input} value={form.personaId} onChange={function(e){ setF("personaId", e.target.value); }}>
                <option value="">— elegir —</option>
                {personas.map(function(p){ return <option key={p.id} value={p.id}>{nomP(p.id)}</option>; })}
              </select>
            </div>
            <div style={{flex:"1 1 160px"}}>
              <label style={S.label}>Tipo</label>
              <select style={S.input} value={form.tipo} onChange={function(e){ setF("tipo", e.target.value); }}>
                {TIPOS.map(function(t){ return <option key={t} value={t}>{t}</option>; })}
              </select>
            </div>
            <div style={{width:150}}>
              <label style={S.label}>Desde (efecto)</label>
              <input type="date" style={S.input} value={form.desde} onChange={function(e){ setF("desde", e.target.value); }} />
            </div>
            <div style={{width:150}}>
              <label style={S.label}>Hasta</label>
              <input type="date" style={S.input} value={form.hasta} disabled={form.abierta===true} onChange={function(e){ setF("hasta", e.target.value); }} />
            </div>
            <div style={{display:"flex", alignItems:"center", paddingBottom:8}}>
              <label style={{display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:J, fontWeight:600, color:C.titulo}}>
                <input type="checkbox" checked={form.abierta===true} onChange={function(e){ var ab=e.target.checked; setFm(ab ? {abierta:true, hasta:""} : {abierta:false}); }} /> Hasta reincorporación
              </label>
            </div>
            <div style={{width:110}}>
              <label style={S.label}>Cantidad</label>
              <NumInput value={form.cantidad} style={S.input} onCommit={function(v){ setF("cantidad", num(v)); }} />

function VersionesView(props){
  var d = props.data;
  var [fecha, setFecha] = useState(hoyISO());
  var [nota, setNota] = useState("");
  var versiones = (d.versiones || []).slice().sort(function(a,b){
    var f = String(b.fecha||"").localeCompare(String(a.fecha||""));
    if(f!==0) return f;
    return String(b.creado||"").localeCompare(String(a.creado||""));
  });
  var ultima = versiones[0] || null;
  var pendientes = (d.cambios||[]).filter(function(c){ return !ultima || String(c.registrado||"") > String(ultima.creado||""); });
  var [cDesde, setCDesde] = useState("");
  var [cHasta, setCHasta] = useState("");
  var [cQuien, setCQuien] = useState("todos");
  var camF = (d.cambios||[]).filter(function(x){
    if(cDesde && String(x.fecha||"") < cDesde) return false;
    if(cHasta && String(x.fecha||"") > cHasta) return false;
    if(cQuien!=="todos" && x.personaId!==cQuien) return false;
    return true;
  }).sort(function(a,b){ return String(b.fecha||"").localeCompare(String(a.fecha||"")); });
  function setFechaCam(id, f){
    props.setData(Object.assign({}, d, {cambios:(d.cambios||[]).map(function(x){ return x.id===id?Object.assign({}, x, {fecha:f}):x; })}));
  }
  function expoCam(){
    var aoa=[["Fecha efecto","Persona","Categoría","Fuente","De %","A %","Variación","Motivo"]];
    camF.forEach(function(x){ aoa.push([x.fecha, x.persona, x.categoria, x.fuente, r2(x.de), r2(x.a), r2(num(x.a)-num(x.de)), x.motivo]); });
    descargarTabla("diario_cambios_"+(cDesde||"inicio")+"_"+(cHasta||"hoy"), [{nombre:"Cambios", aoa:aoa}]);
  }
  function diasDesde(iso){
    if(!iso) return null;
    var t = new Date(iso);
    if(isNaN(t.getTime())) return null;
    return Math.floor((new Date() - t)/(1000*60*60*24));
  }
  function cambiosDe(v, i){
    var prev = versiones[i+1] || null;
    return (d.cambios||[]).filter(function(c){
      var r = String(c.registrado||"");
      if(r > String(v.creado||"")) return false;
      if(prev && r <= String(prev.creado||"")) return false;
      return true;
    });
  }
  function resumen(cs){
    if(!cs.length) return "—";
    var pers = {}; cs.forEach(function(c){ if(c.persona) pers[c.persona]=1; });
    return cs.length + " cambio(s) · " + Object.keys(pers).length + " persona(s)";
  }
  function guardar(){
    if(!fecha){ props.toast("Pon una fecha de efecto","error"); return; }
    var v = {id:uid("ver"), fecha:fecha, nota:nota.trim(), creado:new Date().toISOString(), snap:hacerSnapshot(d)};
    props.setData(Object.assign({}, d, {versiones:(d.versiones||[]).concat([v])}));
    setNota(""); props.toast("Versión guardada","ok");
  }
  function restaurar(v){
    if(!window.confirm("¿Restaurar la versión con fecha "+v.fecha+"?\nReemplazará el montaje actual (personas, categorías, fuentes, tramos y reparto). El historial se conserva.")) return;
    var s = JSON.parse(JSON.stringify(v.snap || {}));
    props.setData(Object.assign({}, d, {
      personas: Array.isArray(s.personas)?s.personas:d.personas,
      categorias: Array.isArray(s.categorias)?s.categorias:d.categorias,
      fuentes: Array.isArray(s.fuentes)?s.fuentes:d.fuentes,
      tramos: Array.isArray(s.tramos)?s.tramos:d.tramos,
      reparto: s.reparto||d.reparto
    }));
    props.toast("Versión restaurada","ok");
  }
  function borrar(id){
    if(!window.confirm("¿Borrar esta versión del historial? (no afecta al montaje actual)")) return;
    props.setData(Object.assign({}, d, {versiones:(d.versiones||[]).filter(function(v){ return v.id!==id; })}));
  }
  function fmtCreado(iso){ if(!iso) return ""; try { return new Date(iso).toLocaleString("es-ES"); } catch(e){ return iso; } }
  function cuenta(snap, k){ return (snap && Array.isArray(snap[k])) ? snap[k].length : 0; }

  return (
    <div>
      <div style={Object.assign({}, S.card, {padding:"16px 18px", marginBottom:18, maxWidth:640})}>
        <div style={{fontFamily:"'Source Serif 4',serif", fontWeight:700, color:C.titulo, fontSize:O, marginBottom:4}}>Guardar versión</div>
        <p style={{margin:"0 0 10px", color:C.secundario, fontSize:J}}>Congela el estado actual del montaje (una "foto"). Es lo único que permite reconstruir el pasado: sin fotos, los informes del pasado son proyecciones, no datos objetivos.</p>
        {pendientes.length ? (
          <div style={{background:C.avisoBg, border:"1px solid "+C.aviso, borderRadius:8, padding:"9px 12px", marginBottom:12, fontSize:J, color:C.avisoText}}>
            <b>Llevas {pendientes.length} cambio(s) sin fotografiar</b>{(ultima && diasDesde(ultima.creado)!==null) ? (" · última versión hace " + diasDesde(ultima.creado) + " día(s)") : " · nunca has guardado una versión"}. Guarda una foto para dejarlos registrados.
          </div>
        ) : null}
        <div style={{display:"flex", gap:12, flexWrap:"wrap", alignItems:"flex-end"}}>
          <div style={{width:170}}>
            <label style={S.label}>Fecha de efecto</label>
            <input type="date" style={S.input} value={fecha} onChange={function(e){ setFecha(e.target.value); }} />
          </div>
          <div style={{flex:"1 1 240px"}}>
            <label style={S.label}>Nota</label>
            <input style={S.input} value={nota} placeholder="p. ej. Semana 12 · baja de X, entra Y" onChange={function(e){ setNota(e.target.value); }} />
          </div>
          <button style={S.btnPri} onClick={guardar}>Guardar versión</button>
        </div>
      </div>

      <h4 style={{fontSize:14, color:C.secundario, textTransform:"uppercase", letterSpacing:".04em", marginBottom:8}}>Historial ({versiones.length})</h4>
      <div style={Object.assign({}, S.card, {padding:0, overflow:"hidden"})}>
        <div className="tabla-scroll"><table>
          <thead><tr><th>Fecha efecto</th><th>Nota</th><th>Qué cambió</th><th className="num">Personas</th><th className="num">Tramos</th><th>Guardada</th><th style={{width:150}}></th></tr></thead>
          <tbody>
            {versiones.map(function(v, i){ return (
              <tr key={v.id}>
                <td style={{fontWeight:600, color:C.titulo, whiteSpace:"nowrap"}}>{v.fecha||"—"}</td>
                <td style={{fontSize:J}}>{v.nota||""}</td>
                <td style={{fontSize:12, color:CALM, fontWeight:600, whiteSpace:"nowrap"}}>{resumen(cambiosDe(v, i))}</td>
                <td className="num">{cuenta(v.snap,"personas")}</td>
                <td className="num">{cuenta(v.snap,"tramos")}</td>
                <td style={{fontSize:I, color:C.secundario, whiteSpace:"nowrap"}}>{fmtCreado(v.creado)}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  <button style={S.btn} onClick={function(){ restaurar(v); }}>Restaurar</button>
                  <button style={S.btnDel} onClick={function(){ borrar(v.id); }}>✕</button>
                </td>
              </tr>
            ); })}
            {versiones.length===0 ? <tr><td colSpan="7" style={{color:C.secundario, padding:18, textAlign:"center"}}>Aún no hay versiones guardadas.</td></tr> : null}
          </tbody>
        </table></div>
      </div>
      <p style={{fontSize:12, color:C.secundario, marginTop:10}}>Restaurar reemplaza el reparto actual por esa foto (el historial se conserva).</p>

      {/* Diario de cambios */}
      <h4 style={{fontSize:14, color:C.secundario, textTransform:"uppercase", letterSpacing:".04em", margin:"26px 0 8px"}}>Diario de cambios ({(d.cambios||[]).length})</h4>
      <div className="no-print" style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"flex-end", marginBottom:10}}>
        <div style={{width:145}}><label style={Object.assign({}, S.label,{marginBottom:2})}>Desde</label><input type="date" style={S.input} value={cDesde} onChange={function(e){ setCDesde(e.target.value); }} /></div>
        <div style={{width:145}}><label style={Object.assign({}, S.label,{marginBottom:2})}>Hasta</label><input type="date" style={S.input} value={cHasta} onChange={function(e){ setCHasta(e.target.value); }} /></div>
        <select style={Object.assign({}, S.input, {width:200})} value={cQuien} onChange={function(e){ setCQuien(e.target.value); }}>
          <option value="todos">Todas las personas</option>
          {d.personas.slice().sort(cmpPersona).map(function(p){
            return <option key={p.id} value={p.id}>{(p.apellidos+", "+p.nombre).replace(/^, |, $/,"")}</option>;
          })}
        </select>
        <div style={{flex:1}} />
        {camF.length ? <button style={S.btn} onClick={expoCam}>Descargar Excel</button> : null}
        {camF.length ? <button style={S.btnPri} onClick={function(){ window.print(); }}>Imprimir / PDF</button> : null}
      </div>
      <div className="print-area">
        <div className="ficha" style={Object.assign({}, S.card, {padding:0, overflow:"hidden"})}>
          <div className="tabla-scroll"><table style={{fontSize:J}}>
            <thead><tr><th style={{width:110}}>Fecha efecto</th><th>Persona</th><th>Categoría</th><th>Fuente</th><th className="num">De</th><th className="num">A</th><th className="num">Var.</th><th>Motivo</th></tr></thead>
            <tbody>
              {camF.map(function(x){
                var v = num(x.a)-num(x.de);
                return (
                  <tr key={x.id}>
                    <td style={{padding:2}}><input type="date" className="cellinput" value={x.fecha} onChange={function(e){ setFechaCam(x.id, e.target.value); }} /></td>
                    <td style={{fontWeight:600, color:C.titulo}}>{x.persona||"—"}</td>
                    <td>{x.categoria||"—"}</td>
                    <td style={{color:C.secundario}}>{x.fuente||"—"}</td>
                    <td className="num">{r2(x.de)}%</td>
                    <td className="num">{r2(x.a)}%</td>
                    <td className="num" style={{fontWeight:700, color: v>0?C.ok:(v<0?C.aviso:C.secundario)}}>{v>=0?"+":""}{r2(v)}</td>
                    <td style={{color:C.secundario, fontSize:12}}>{x.motivo||""}</td>
                  </tr>
                );
              })}
              {camF.length===0 ? <tr><td colSpan="8" style={{color:C.secundario, padding:18, textAlign:"center"}}>Sin cambios en ese rango.</td></tr> : null}
            </tbody>
          </table></div>
        </div>
      </div>
      <p style={{fontSize:12, color:C.secundario, marginTop:8}}>Todo cambio de reparto queda registrado con la fecha de hoy. Si la fecha de efecto real es otra, corrígela aquí.</p>
    </div>
  );
}

function FichasView(props){
  var d = props.data;
  var [edit, setEdit] = useState(null);
  var catById = {}; d.categorias.forEach(function(c){ catById[c.id]=c; });
  function guardarP(np){
    var existe = d.personas.some(function(x){ return x.id===np.id; });
    var ps = existe ? d.personas.map(function(x){ return x.id===np.id?np:x; }) : d.personas.concat([np]);
    props.setData(Object.assign({}, d, {personas:ps}));
    setEdit(null);
    if(props.toast) props.toast("Guardado","ok");
  }
  function borrarP(id){
    var nT = d.tramos.filter(function(t){ return t.personaId===id; }).length;
    if(!window.confirm("¿Eliminar esta persona?" + (nT?("\n\nSe borrarán también sus " + nT + " asignación(es)."):""))) return;
    props.setData(Object.assign({}, d, {
      personas: d.personas.filter(function(x){ return x.id!==id; }),
      tramos: d.tramos.filter(function(t){ return t.personaId!==id; }),
      incidencias: (d.incidencias||[]).filter(function(x){ return x.personaId!==id && x.sustitutoId!==id; })
    }));
    setEdit(null);
    if(props.toast) props.toast("Persona eliminada","info");
  }
  function nuevaP(){
    setEdit({id:uid("per"), apellidos:"", nombre:"", dni:"", categoriasLaborales:[], cargoDirectivo:"", tipoContrato:"",
      fechaInicio:"", fechaFin:"", tutor:false, contratos:[], topeActivo:false, topeValor:0, topeUnidad:"horas",
      categoriaConvenio:"", cargoConvenio:"", trienios:0, fechaAntiguedad:"", fechaNacimiento:"", irpfPersonal:0,
      formacion:{academica:[], idiomas:[], deca:false, digital:"", otras:"", estrategicas:{}}, notas:"", _nuevo:true});
  }
  var [sel, setSel] = useState("todos");
  var [q, setQ] = useState("");
  var [fIdioma, setFIdioma] = useState("");
  var [fNivel, setFNivel] = useState("");
  var [fDeca, setFDeca] = useState(false);
  var [fDigital, setFDigital] = useState("");
  var [fEstr, setFEstr] = useState("");
  var [fCat, setFCat] = useState("");
  var [campos, setCampos] = useState({datos:true, formacion:true, complementos:true, tramos:true, contratos:true, reparto:true, incidencias:false, cambios:false, notas:true});
  var [sumarInc, setSumarInc] = useState({});  /* solo afecta a la vista de la ficha: qué sustituciones se suman a los totales */
  function byname(a,b){ return cmpPersona(a,b); }
  function nomP(p){ return (p.apellidos+", "+p.nombre).replace(/^, |, $/,""); }
  function horasT(t){ var c=catById[t.categoriaId]; return num(t.porcentaje)/100*(c?horasBaseDe(d, c):0); }
  function fNom(fid){ var f=d.fuentes.find(function(x){ return x.id===fid; }); return f?nombreDe(f):"—"; }
  function labNombres(p){ return (p.categoriasLaborales||[]).map(function(id){ var x=(d.categoriasLaborales||[]).find(function(o){ return o.id===id; }); return x?nombreDe(x):""; }).filter(Boolean).join(", "); }
  function cargoNombre(p){ var x=(d.cargosDirectivos||[]).find(function(o){ return o.id===p.cargoDirectivo; }); return x?nombreDe(x):""; }

  var NIVEL_ORD = {A1:1,A2:2,B1:3,B2:4,C1:5,C2:6};
  var todas = d.personas.slice().sort(byname);
  var ql = q.trim().toLowerCase();
  var lista = todas.filter(function(p){
    if(ql && nomP(p).toLowerCase().indexOf(ql)<0) return false;
    var F = p.formacion || {};
    if(fIdioma){
      var li = (F.idiomas||[]).filter(function(i){ return (i.idioma||"").toLowerCase().indexOf(fIdioma.toLowerCase())>=0; });
      if(!li.length) return false;
      if(fNivel){
        var min = NIVEL_ORD[fNivel]||0;
        if(!li.some(function(i){ return (NIVEL_ORD[i.nivel]||0) >= min; })) return false;
      }
    } else if(fNivel){
      var minN = NIVEL_ORD[fNivel]||0;
      if(!(F.idiomas||[]).some(function(i){ return (NIVEL_ORD[i.nivel]||0) >= minN; })) return false;
    }
    if(fDeca && F.deca!==true) return false;
    if(fDigital && (NIVEL_ORD[F.digital]||0) < (NIVEL_ORD[fDigital]||0)) return false;
    if(fEstr && !((F.estrategicas||{})[fEstr] && (F.estrategicas||{})[fEstr].length)) return false;
    if(fCat && !(F.academica||[]).some(function(a){ return (a.habilita||[]).indexOf(fCat)>=0; })) return false;
    return true;
  });
  var fichas = sel==="todos" ? lista : todas.filter(function(p){ return p.id===sel; });
  function limpiar(){ setQ(""); setFIdioma(""); setFNivel(""); setFDeca(false); setFDigital(""); setFEstr(""); setFCat(""); setSel("todos"); }
  var hayFiltro = !!(ql||fIdioma||fNivel||fDeca||fDigital||fEstr||fCat);

  var OPCIONES = [
    {k:"datos", t:"Datos"}, {k:"formacion", t:"Formación"}, {k:"complementos", t:"Complementos"},
    {k:"tramos", t:"Asignaciones"}, {k:"reparto", t:"Reparto horas"}, {k:"contratos", t:"Contratos"},
    {k:"incidencias", t:"Incidencias"}, {k:"cambios", t:"Cambios"}, {k:"notas", t:"Notas"}
  ];
  function toggle(k){ var o=Object.assign({}, campos); o[k]=!o[k]; setCampos(o); }
  var thp = {textAlign:"left", padding:"5px 8px", borderBottom:"1px solid "+C.borde, fontSize:11, color:C.secundario, textTransform:"uppercase", letterSpacing:".03em", background:"transparent", position:"static"};
  var tdp = {padding:"5px 8px", borderBottom:"1px solid #f0ece5", fontSize:J};
  var H4 = {fontSize:11, fontWeight:700, color:C.titulo, textTransform:"uppercase", letterSpacing:".04em", margin:"14px 0 5px"};

  function exportar(){
    var aoa=[["Apellidos","Nombre","Cat. laborales","Cargo","Tutor","Contrato vigente (h)","Titulaciones","Idiomas","DECA","C. digital"]];
    fichas.forEach(function(p){
      var F=p.formacion||{};
      var tit=(F.academica||[]).map(function(a){ return a.tipo+" "+a.titulo; }).join(" · ");
      var idi=(F.idiomas||[]).map(function(i){ return i.idioma+" "+i.nivel; }).join(" · ");
      var hc=horasContrato(p, periodoCurso(d));
      aoa.push([p.apellidos,p.nombre,labNombres(p),cargoNombre(p),p.tutor?"Sí":"",hc===null?"":r2(hc),tit,idi,F.deca?"Sí":"",F.digital||""]);
    });
    descargarTabla("fichas_personas_"+d.curso, [{nombre:"Fichas", aoa:aoa}]);
  }

  return (

      <div className="print-area">

          var th = ts.reduce(function(a,t){ return a+horasT(t); }, 0);
          var est = jornadaEstado(p, tp, th);
          var F = p.formacion || {};
          var incs = (d.incidencias||[]).filter(function(x){ return x.personaId===p.id || x.sustitutoId===p.id; });
          var cams = (d.cambios||[]).filter(function(x){ return x.personaId===p.id; }).sort(function(a,b){ return String(a.fecha||"").localeCompare(String(b.fecha||"")); });
          var cargo = cargoNombre(p);
          var lstC = (p.contratos||[]).slice().sort(function(a,b){ return String(a.desde||"").localeCompare(String(b.desde||"")); });
          var vigIds = {}; contratosVigentes(p, periodoCurso(d)).forEach(function(k){ vigIds[k.id]=true; });

          return (

                            </div>
                          );

                        <div style={{fontSize:I, color:C.secundario, marginTop:4}}>Marca la casilla para incluir una sustitución en los totales de jornada de esta ficha. No afecta al reparto ni a la economía.</div>
                      </div>
                    );
                  })()}

                  {(function(){
                    /* GRÁFICO: barra donde 100% = jornada del convenio (de Config). Cada asignación es un segmento

                    if(!jpP || jpP.vacio) return null;
                    var segs = (ts||[]).map(function(t){
                      var c = catById[t.categoriaId];

                    }).filter(function(x){ return x.pct>0.01; });
                    /* añadir las sustituciones por incidencia MARCADAS (solo en esta ficha) */
                    (d.incidencias||[]).filter(function(x){ return x.sustitutoId===p.id && sumarInc[x.id]===true; }).forEach(function(inc){
                      var dc = desgloseSustitucion(d, inc);
                      if(dc.pctJornada>0.01) segs.push({ nombre:"Sustitución*", pct:dc.pctJornada, cat:null, sub:true });
                    });
                    var totalPct = segs.reduce(function(a,x){ return a+x.pct; }, 0);

                          {pctContrato>0 && pctContrato<99.5 ? <div style={{position:"absolute", top:-3, bottom:-3, left:(pctContrato/escala*100)+"%", width:2, background:C.azul, borderRadius:2}} title={"Tope del contrato: "+pctContrato+"%"}></div> : null}

              {campos.reparto && jpP && !jpP.vacio ? (function(){

                var horasAsigTotal = (ts||[]).reduce(function(a,t){ return a + desgloseAsignacion(d, t).jornadaHoras; }, 0);

                var pctLect2 = lectMax2>0 ? lectAsig2/lectMax2*100 : 0;
                var lectSinAsig2 = Math.max(0, lectMax2 - lectAsig2);
                var celda = {display:"flex", flexDirection:"column", gap:1};

                    <div style={celda}><span style={lblCol}>% de contrato cubierto</span><span style={Object.assign({}, valCol, {color:colContrato})}>{r2(pctContratoCubierto)}%</span></div>
                  </div>
                  {esDoc2 ? (
                  <div>
                    <div style={{fontSize:11, fontWeight:700, color:C.titulo, textTransform:"uppercase", letterSpacing:".04em", marginBottom:6}}>Horas lectivas asignadas</div>
                    <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10, marginBottom:10}}>
                      <div style={celda}><span style={lblCol}>Horas lectivas asignadas</span><span style={Object.assign({}, valCol, {color:colLect2})}>{r2(lectAsig2)} h</span></div>
                      <div style={celda}><span style={lblCol}>Horas máx. asignables (contrato)</span><span style={valCol}>{r2(lectMax2)} h</span></div>
                      <div style={celda}><span style={lblCol}>% de horas lectivas cubiertas</span><span style={Object.assign({}, valCol, {color:colLect2})}>{r2(pctLect2)}%</span></div>

                    <div style={{display:"flex", gap:18, flexWrap:"wrap", fontSize:J, paddingTop:8, borderTop:"1px dashed "+C.borde}}>
                      <span style={{color:C.secundario}}>Horas lectivas sin asignar <b style={{color: lectSinAsig2>0.01 ? C.avisoText : C.okText}}>{r2(lectSinAsig2)} h</b></span>
                      <span style={{color:C.secundario}}>Horas complementarias <b style={{color:C.titulo}}>{r2(jpP.comple)} h</b> <span style={{fontSize:H}}>(de las cuales {r2(jpP.personal)} de trabajo personal)</span></span>

              {(function(){

                      var sust=x.sustitutoId ? (d.personas||[]).filter(function(z){ return z.id===x.sustitutoId; })[0] : null;
                      var nomSust=sust ? (sust.apellidos+", "+sust.nombre).replace(/^, |, $/,"") : "";
                      return <div key={x.id} style={{fontSize:J, color:C.texto, padding:"3px 0"}}><b>{x.tipo}</b>{num(x.cantidad)>0?(" · "+r2(x.cantidad)+(x.unidad==="horas"?" h":"%")):""} · {x.desde||"?"}{x.hasta?(" a "+x.hasta):""}{nomSust?(" · sustituye: "+nomSust):""}</div>;

              {campos.contratos && lstC.length ? (

function IngresosView(props){

  function setMod(id, campo, val){ setMO({lista: MO.lista.map(function(m){ if(m.id!==id) return m; var nm=Object.assign({}, m); nm[campo]=(campo==="nombre")?val:num(val); return nm; })}); }
  function setDest(k, v){ setMO({destino: Object.assign({}, MO.destino, (function(){ var o={}; o[k]=v; return o; })())}); }
  function addMod(){ setMO({lista: MO.lista.concat([{id:uid("mo"), nombre:"", doc:0, noDoc:0, educ:0, func:0, rir:0}])}); }
  function delMod(id){
    var usada = d.categorias.filter(function(c){ return c.moduloId===id; });
    if(usada.length && !window.confirm("Este módulo está enlazado a " + usada.length + " categoría(s). Si lo borras, quedarán sin módulo. ¿Continuar?")) return;
    props.setData(Object.assign({}, d, {
