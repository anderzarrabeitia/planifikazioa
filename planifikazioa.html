/* ===== Fase 2: Montaje (matriz + cuadre) ===== */
function semColorPersona(pct){
  /* Verde = tiene hueco (no llega al 100%). Amarillo = justo al 100% (lleno). Rojo = se pasa. */
  if(pct > 100.5) return C.peligro;              /* se pasa del 100% */
  if(pct >= 99.5) return C.aviso;                /* completo al 100% (con tolerancia de decimales) */
  return C.ok;                                   /* tiene hueco disponible */
}
/* Líneas de contrato vigentes en una fecha: desde <= ref y (sin hasta o hasta >= ref). El tope es su SUMA (un anexo suma, no sustituye). */
/* Firma estable de un aviso (para poder descartarlo y recordarlo) */
function firmaAviso(a){
  return (a.titulo||"") + "|" + (a.persona||"") + "|" + (a.ruta||"");
}
function detectarIncongruencias(d, incluirDescartados){
  var out = [];
  var descart = (d.avisosDescartados||[]).reduce(function(m,x){ m[x.firma]=x; return m; }, {});
  function add(nivel, titulo, detalle, ruta, persona){
    var a = {nivel:nivel, titulo:titulo, detalle:detalle, ruta:ruta, persona:persona||""};
    a.firma = firmaAviso(a);
    var desc = descart[a.firma];
    if(desc && !incluirDescartados){ return; }   /* descartado: no aparece */
    if(desc){ a.descartado = true; a.notaDescarte = desc.nota; a.fechaDescarte = desc.fecha; }
    out.push(a);
  }
  var hoy = hoyISO();
  var anioNat = parseInt(hoy.slice(0,4), 10);
  function nomP(p){ return (p.apellidos+", "+p.nombre).replace(/^, |, $/,""); }
  var cats={}; (d.categorias||[]).forEach(function(c){ cats[c.id]=c; });
  var pids={}; (d.personas||[]).forEach(function(p){ pids[p.id]=1; });

  /* ===== NIVEL 1 · ERRORES OBJETIVOS ===== */

  /* Tramos huérfanos */
  (d.tramos||[]).forEach(function(t){
    if(!pids[t.personaId]) add("error","Asignación sin persona","Una asignación apunta a una persona que ya no existe.","Reparto de jornadas");
    else if(!cats[t.categoriaId]) add("error","Asignación sin categoría","Una asignación apunta a una categoría borrada.","Reparto de jornadas");
  });
  /* Lectivas por encima del convenio + tramos > contrato */
  (d.personas||[]).forEach(function(p){
    var jp = jornadaPersona(d, p);
    if(jp && jp.modo==="docente" && jp.sem && jp.sem.color==="peligro"){
      add("error","Lectivas por encima del convenio", nomP(p)+" tiene más horas lectivas de las que permite el convenio para su jornada. Es ilegal.","Personas → Fichas → "+nomP(p), nomP(p));
    }
    var ts=(d.tramos||[]).filter(function(t){ return t.personaId===p.id; });
    var pctTot=ts.reduce(function(a,t){ return a+num(t.porcentaje); },0);
    if(pctTot>100.01) add("error","Reparto por encima del 100%", nomP(p)+" tiene asignado "+r2(pctTot)+"% de jornada (más del 100%).","Reparto de jornadas → Por persona", nomP(p));
  });
  /* Pluses por encima del tope */
  var topes=(d.convenio&&d.convenio.cargos)?d.convenio.cargos:[];
  if(topes.length && d.pluses && d.pluses.cargos){
    var maxT=topes.reduce(function(a,x){ return Math.max(a,num(x.plus)); },0);
    /* (el detalle fino ya está en Pluses; aquí solo señalamos que hay que mirarlo si hay reparto) */
  }
  /* Reparto de ingresos que no suma 100% (modo pct) */
  var RP=d.repartoIngresos;
  if(RP && RP.modo==="pct" && (RP.partidas||[]).length){
    var suma=RP.partidas.reduce(function(a,x){ return a+num(x.valor); },0);
    if(Math.abs(suma-100)>0.01) add("error","Reparto de ingresos ≠ 100%","Las partidas del reparto suman "+r2(suma)+"% en vez de 100%.","Economía → Ingresos GV → Reparto");
  }

  /* Siglas duplicadas */
  (function(){
    var dup = siglasDuplicadas(d.personas);
    Object.keys(dup).forEach(function(sg){
      var quienes = (d.personas||[]).filter(function(p){ return siglaDe(p)===sg; }).map(nomP).join(", ");
      add("revisable","Sigla repetida ("+sg+")", "La sigla "+sg+" la comparten "+dup[sg]+" personas: "+quienes+". Ponles siglas distintas para identificarlas bien en el montaje y las fichas.","Personas → Fichas");
    });
  })();

  /* Contrato de sustitución con horas distintas a las que corresponden por la incidencia.
     Se compara con las horas que TOCA cubrir (% de la incidencia sobre el titular), NO con el
     contrato total de la sustituta: en una sustitución parcial la sustituta complementa su propio
     horario, así que no tiene por qué calcar al titular. */
  (function(){
    var pById={}; (d.personas||[]).forEach(function(p){ pById[p.id]=p; });
    (d.incidencias||[]).forEach(function(inc){
      if(!inc.sustitutoId || !inc.aplicada) return;
      var titular=pById[inc.personaId], sust=pById[inc.sustitutoId];
      if(!titular || !sust) return;
      var horasTocan = horasSustitucionDe(d, inc);   /* lo que la sustituta debe cubrir por esta incidencia */
      if(horasTocan<=0) return;
      /* horas del contrato de sustitución ligado a esta incidencia */
      var contratoSust = (sust.contratos||[]).filter(function(k){ return k.incidenciaId===inc.id; });
      var horasContratoSust = contratoSust.reduce(function(a,k){ return a + num(k.horas); }, 0);
      if(contratoSust.length && Math.abs(horasContratoSust - horasTocan) > 0.5){
        add("revisable","Contrato de sustitución con horas que no cuadran", nomP(sust)+" cubre a "+nomP(titular)+" ("+r2(num(inc.cantidad))+(inc.unidad==="horas"?" h":"%")+"): le corresponden "+r2(horasTocan)+" h, pero su contrato de sustitución es de "+r2(horasContratoSust)+" h. Revísalo en la ficha de "+nomP(sust)+".","Personas → Fichas → "+nomP(sust), nomP(sust));
      }
    });
  })();

  /* ===== NIVEL 2 · REVISABLES / JUSTIFICABLES ===== */
  (d.personas||[]).forEach(function(p){
    var ts=(d.tramos||[]).filter(function(t){ return t.personaId===p.id; });
    var pctTot=ts.reduce(function(a,t){ return a+num(t.porcentaje); },0);
    var incAbierta=(d.incidencias||[]).some(function(x){ return x.personaId===p.id && x.abierta; });
    var esSustituta=(d.incidencias||[]).some(function(x){ return x.sustitutoId===p.id; });   /* cubre una incidencia de otra persona */
    var vigSA=contratosVigentes(p, periodoCurso(d));
    var soloSust=vigSA.length>0 && vigSA.every(function(k){ return k.incidenciaId; });        /* todos sus contratos vigentes son de sustitución */
    /* con contrato pero sin tramos (y sin nada que lo explique: ni incidencia propia, ni ser sustituta) */
    if((p.contratos||[]).length && pctTot===0 && !incAbierta && !esSustituta && !soloSust){
      add("revisable","Con contrato pero sin asignar", nomP(p)+" tiene contrato pero no está en ningún reparto. ¿Se te olvidó asignarla o está de baja?","Reparto de jornadas → Por persona", nomP(p));
    }
    /* con tramos pero sin categoría de convenio */
    if(pctTot>0 && !p.categoriaConvenio){
      add("revisable","Sin categoría de convenio", nomP(p)+" está en el reparto pero no tiene categoría de convenio: no entra en los cálculos de nómina ni coste.","Personas → Fichas → "+nomP(p), nomP(p));
    }
    /* fechas de contrato incoherentes */
    (p.contratos||[]).forEach(function(k){
      if(k.desde && k.hasta && String(k.hasta) < String(k.desde)){
        add("revisable","Fechas de contrato invertidas", nomP(p)+" tiene un contrato cuya fecha de fin es anterior a la de inicio.","Personas → Fichas → "+nomP(p), nomP(p));
      }
    });
    /* contrato caducado pero sigue con tramos */
    if(pctTot>0 && (p.contratos||[]).length){
      var vig=contratosVigentes(p, periodoCurso(d));
      if(!vig.length) add("revisable","Contrato caducado con asignación", nomP(p)+" sigue en el reparto pero no tiene ningún contrato vigente en el curso.","Personas → Fichas → "+nomP(p), nomP(p));
    }
    /* MEJORA 2: asignaciones (horas de jornada) que no cuadran con el contrato vigente.
       No avisa en sustitutas: si TODOS sus contratos vigentes son de sustitución (incidenciaId),
       es normal que no lleven reparto propio, así que el aviso sería ruido. */
    var vigM2 = contratosVigentes(p, periodoCurso(d));
    var soloSustituciones = vigM2.length>0 && vigM2.every(function(k){ return k.incidenciaId; });
    if((p.contratos||[]).length && !soloSustituciones){
      var horasAsig = ts.reduce(function(a,t){ return a + desgloseAsignacion(d, t).jornadaHoras; }, 0);
      /* Comparar SOLO contra los contratos PROPIOS (sin las líneas de sustitución con incidenciaId):
         las horas de sustitución no van al reparto, así que no deben contar como horas a asignar. */
      var horasPropias = vigM2.filter(function(k){ return !k.incidenciaId; }).reduce(function(a,k){ return a + num(k.horas); }, 0);
      if(horasPropias>0 && Math.abs(horasAsig - horasPropias) > 0.5){
        var mas = horasAsig > horasPropias;
        add("revisable","Asignaciones "+(mas?"por encima":"por debajo")+" del contrato",
          nomP(p)+" tiene asignadas "+r2(horasAsig)+" h en el reparto pero su contrato propio es de "+r2(horasPropias)+" h ("+(mas?"sobran":"faltan")+" "+r2(Math.abs(horasAsig-horasPropias))+" h). Revisa el reparto o el contrato.",
          "Personas → Ficha → "+nomP(p), nomP(p));
      }
    }
    /* MEJORA 3: sustituto/a que acumula contratos solapados por encima de su jornada completa */
    (function(){
      var cons = (p.contratos||[]).filter(function(k){ return k.computa!==false; });
      if(cons.length<2) return;
      var jp2 = jornadaPersona(d, p);
      var jornadaMax = (jp2 && jp2.tj) ? num(jp2.tj.jornada) : 0;
      if(jornadaMax<=0) return;
      /* buscar solapamientos: para cada par de contratos con fechas que se cruzan, sumar horas */
      for(var i=0;i<cons.length;i++){
        var suma = num(cons[i].horas), hayCruce=false;
        var iniA=cons[i].desde||"", finA=cons[i].hasta||"9999-12-31";
        for(var j=0;j<cons.length;j++){
          if(j===i) continue;
          var iniB=cons[j].desde||"", finB=cons[j].hasta||"9999-12-31";
          if(iniA<finB && iniB<finA){ suma+=num(cons[j].horas); hayCruce=true; }  /* solape estricto: no cuenta compartir solo el día frontera */
        }
        if(hayCruce && suma > jornadaMax + 0.5){
          add("revisable","Contratos solapados por encima de la jornada",
            nomP(p)+" acumula "+r2(suma)+" h en contratos que se solapan en el tiempo, por encima de su jornada completa ("+r2(jornadaMax)+" h). Si alguno no debe computar, desmárcalo.",
            "Personas → Ficha → "+nomP(p), nomP(p));
          break;
        }
      }
    })();
  });
  /* incidencias con fechas invertidas */
  (d.incidencias||[]).forEach(function(x){
    if(x.desde && x.hasta && String(x.hasta)<String(x.desde)){
      var per=(d.personas||[]).filter(function(p){ return p.id===x.personaId; })[0];
      add("revisable","Incidencia con fechas invertidas","Una incidencia"+(per?(" de "+nomP(per)):"")+" acaba antes de empezar.","Personas → Incidencias", per?nomP(per):"");
    }
  });
  /* módulo a 0 enlazado a categoría con unidades */
  var mods={}; ((d.modulos&&d.modulos.lista)||[]).forEach(function(m){ mods[m.id]=m; });
  (d.categorias||[]).forEach(function(c){
    if(num(c.unidades)>0 && c.moduloId && mods[c.moduloId]){
      var m=mods[c.moduloId];
      var tot=num(m.doc)+num(m.noDoc)+num(m.educ)+num(m.func)+num(m.rir);
      if(tot===0) add("revisable","Módulo a cero", "La categoría “"+(c.nombreEs||"")+"” está enlazada a un módulo cuyo importe es 0.","Economía → Ingresos GV → Tabla de módulos");
    }
  });

  /* ===== NIVEL 3 · AVISOS DE GESTIÓN ===== */
  /* Tablas salariales caducadas (año natural) */
  var cv=d.convenio||{};
  if(cv.anio && parseInt(cv.anio,10) < anioNat){
    add("gestion","Tablas de convenio del año anterior","Las tablas cargadas son de "+cv.anio+" y estamos en "+anioNat+". Revisa si se han publicado las nuevas.","Configuración → Tablas y parámetros → Convenio");
  }
  if(d.modulos && d.modulos.anio && parseInt(d.modulos.anio,10) < anioNat){
    add("gestion","Módulos económicos del año anterior","Los módulos son de "+d.modulos.anio+" y estamos en "+anioNat+". Se publican cada año con la Ley de Presupuestos.","Economía → Ingresos GV → Tabla de módulos");
  }
  /* Conciertos y subvenciones por año académico */
  var curso=d.curso||"";
  var cursoIni = curso ? parseInt(String(curso).slice(0,4),10) : null;
  var mesHoy=parseInt(hoy.slice(5,7),10);
  var cursoActualIni = (mesHoy>=9)?anioNat:(anioNat-1);
  if(cursoIni!==null && cursoIni < cursoActualIni){
    add("gestion","Curso desactualizado","El curso configurado es "+curso+", pero el curso actual empieza en "+cursoActualIni+". Revisa unidades concertadas y subvenciones (van por año académico).","Configuración → Centro");
  }
  /* Trienios que cumplen pronto (3 meses para notificar).
     Solo si la persona lleva de verdad cerca de un múltiplo de 3 años (no en su primer año). */
  (d.personas||[]).forEach(function(p){
    if(!p.categoriaConvenio) return;
    var fAnt=fechaAntiguedadEfectiva(p);
    if(!fAnt) return;
    var A=new Date(fAnt), B=new Date(hoy);
    if(isNaN(A.getTime())) return;
    var anios=(B-A)/(1000*60*60*24*365.25);
    if(anios < 2.75) return; /* menos de ~3 años en el centro: no hay trienio próximo */
    var tri=Math.floor(anios/3);
    var proxAnios=(tri+1)*3;
    var faltaDias=Math.round((proxAnios-anios)*365.25);
    /* solo avisar en la ventana de 90 días ANTES de cumplir el siguiente trienio */
    if(faltaDias>=0 && faltaDias<=90){
      add("gestion","Trienio próximo a cumplir", nomP(p)+" cumplirá su "+(tri+1)+"º trienio en unos "+faltaDias+" días. Hay 3 meses para notificarlo o se pierde el efecto retroactivo.","Personas → Fichas → "+nomP(p), nomP(p));
    }
  });
  /* Contratos temporales próximos a vencer */
  (d.personas||[]).forEach(function(p){
    (p.contratos||[]).forEach(function(k){
      if(k.hasta){
        var H=new Date(k.hasta), B=new Date(hoy);
        var dias=Math.round((H-B)/(1000*60*60*24));
        if(dias>=0 && dias<=45) add("gestion","Contrato próximo a vencer", nomP(p)+" tiene un contrato que vence en "+dias+" días.","Personas → Fichas → "+nomP(p), nomP(p));
      }
    });
  });
  /* Premio de continuidad: quién cumple ya y no consta cobrado */
  (d.personas||[]).forEach(function(p){
    if(!p.fechaNacimiento) return;
    if(p.premioSolicitado===true) return;   /* ya solicitado: no es un aviso pendiente */
    var PC=premioContinuidad(d, p, hoy);
    if(PC.derecho) add("gestion","Premio de continuidad disponible", nomP(p)+" cumple los requisitos del premio (art. 72): "+PC.pagas+" pagas, lo asume "+(PC.lopaga==="pd"?"el pago delegado":"el centro")+".","Personas → Fichas → "+nomP(p), nomP(p));
  });
  /* Subvenciones sin justificar con fecha encima (informativo) */
  (d.subvenciones||[]).forEach(function(sv){
    if(sv.justificar && (num(sv.previsto)>0||num(sv.confirmado)>0)){
      /* no calculamos la fecha exacta; recordatorio suave */
    }
  });
  return out;
}
function auditarEstado(d){
  var items = [];
  function add(nivel, txt, ruta){ items.push({nivel:nivel, txt:txt, ruta:ruta}); }
  /* Categorías con unidades sin módulo */
  var catUnid = (d.categorias||[]).filter(function(c){ return num(c.unidades)>0; });
  var sinMod = catUnid.filter(function(c){ return !c.moduloId; });
  var sinModReales = sinMod.filter(function(c){
    var n=(c.nombreEs||"").toLowerCase();
    return n.indexOf("pas")<0 && n.indexOf("teji")<0 && n.indexOf("complej")<0 && n.indexOf("prl")<0;
  });
  if(catUnid.length===0) add("error","No hay categorías con unidades concertadas","Configuración → Categorías y conciertos");
  else if(sinModReales.length) add("aviso", sinModReales.length+" categoría(s) con unidades pero sin módulo económico enlazado","Economía → Ingresos GV → Enlazar categorías");
  else add("ok", catUnid.length+" categorías con unidades, módulos enlazados","");
  /* Personas sin categoría de convenio */
  var np = (d.personas||[]).length;
  var sinCat = (d.personas||[]).filter(function(p){ return !p.categoriaConvenio; });
  if(np===0) add("error","No hay personas cargadas","Personas → Fichas");
  else if(sinCat.length) add("aviso", sinCat.length+" de "+np+" personas sin categoría de convenio (no entran en los cálculos económicos)","Personas → Fichas → Editar → Convenio y antigüedad");
  else add("ok", np+" personas con categoría de convenio","");
  /* Personas sin contrato */
  var sinCon = (d.personas||[]).filter(function(p){ return p.categoriaConvenio && (!p.contratos || !p.contratos.length); });
  if(sinCon.length) add("aviso", sinCon.length+" persona(s) con categoría pero sin contrato base (jornada = 0)","Personas → Fichas → Editar → Contrato base");
  /* Tablas de convenio */
  var cv = d.convenio || {};
  if(!num(cv.tutoria)) add("aviso","El complemento de tutoría está a 0 (los tutores no cobran el complemento)","Configuración → Tablas y parámetros → Convenio");
  else add("ok","Complemento de tutoría configurado","");
  /* Jornadas */
  var J = d.jornadas || {};
  var cvCats = (cv.categorias||[]);
  var cvSinJor = cvCats.filter(function(c){ return c.pd && !(J.mapaConvenio && J.mapaConvenio[c.id]); });
  if(cvSinJor.length) add("aviso", cvSinJor.length+" categoría(s) de convenio docentes sin tipo de jornada asignado","Configuración → Tablas y parámetros → Tipos de jornada");
  /* Subvenciones sin importe */
  var sv = d.subvenciones || [];
  var svSin = sv.filter(function(x){ return num(x.previsto)===0 && num(x.confirmado)===0; });
  if(sv.length && svSin.length) add("aviso", svSin.length+" de "+sv.length+" subvenciones sin importe (el presupuesto queda incompleto)","Economía → Ingresos GV → Otros ingresos");
  else if(sv.length) add("ok", sv.length+" subvenciones con importe","");
  var svSinFuente = sv.filter(function(x){ return !x.fuenteId; });
  if(svSinFuente.length) add("aviso", svSinFuente.length+" subvención(es) sin enlazar a un proyecto (no se cruzan con el gasto)","Economía → Ingresos GV → Otros ingresos");
  /* Incidencias sin aplicar */
  var incSin = (d.incidencias||[]).filter(function(x){ return !x.aplicada; });
  if(incSin.length) add("aviso", incSin.length+" incidencia(s) registrada(s) sin aplicar al reparto","Personas → Incidencias");
  /* Tramos huérfanos */
  var pids={}; (d.personas||[]).forEach(function(p){ pids[p.id]=1; });
  var cids={}; (d.categorias||[]).forEach(function(c){ cids[c.id]=1; });
  var huerf=(d.tramos||[]).filter(function(t){ return !pids[t.personaId] || !cids[t.categoriaId]; });
  if(huerf.length) add("error", huerf.length+" asignación(es) huérfana(s) (persona o categoría ya no existe)","Reparto de jornadas → Por persona");
  /* Versiones */
  var nv=(d.versiones||[]).length;
  var ultima=(d.versiones||[]).slice().sort(function(a,b){ return String(b.creado||"").localeCompare(String(a.creado||"")); })[0];
  var pend=(d.cambios||[]).filter(function(c){ return !ultima || String(c.registrado||"")>String(ultima.creado||""); });
  if(nv===0) add("aviso","No has guardado ninguna versión (sin fotos no se puede reconstruir el pasado)","Configuración → Versiones");
  else if(pend.length) add("aviso", pend.length+" cambio(s) sin fotografiar desde la última versión","Configuración → Versiones");
  else add("ok", nv+" versiones guardadas, sin cambios pendientes","");
  /* Usuarios */
  var us=(d.usuarios||[]);
  if(us.length===0) add("aviso","No hay usuarios definidos (cualquiera que abra el archivo entra sin contraseña)","Configuración → Centro → Usuarios");
  return items;
}
function jornadaPersona(d, p, fechaRef){
  /* Traduce el contrato (horas totales) a su desglose según el tipo de jornada del puesto */
  var J = d.jornadas; if(!J) return null;
  if(!fechaRef) fechaRef = periodoCurso(d);   /* por defecto, periodo del curso activo (no hoy) */
  var cc = p && p.categoriaConvenio;
  var jtId = cc ? J.mapaConvenio[cc] : null;
  var tj = jtId ? J.tipos.filter(function(t){ return t.id===jtId; })[0] : null;
  if(!tj) return null;
  var hc = horasContrato(p, fechaRef);
  if(hc===null || hc<=0) return {tj:tj, pct:0, vacio:true};
  var pct = num(tj.jornada)>0 ? (hc/num(tj.jornada)*100) : 0;
  var dg = desgloseJornada(tj, pct);
  dg.tj = tj; dg.pct = pct; dg.horasContrato = hc;
  if(dg.modo==="docente"){
    var cats={}; (d.categorias||[]).forEach(function(c){ cats[c.id]=c; });
    var ts=(d.tramos||[]).filter(function(t){ return t.personaId===p.id; });
    var lectAsig = ts.reduce(function(a,t){ var c=cats[t.categoriaId]; return a + (c ? num(t.porcentaje)/100*horasBaseDe(d, c) : 0); }, 0);
    /* Tope de lectivas ponderado por etapa: cada tramo aporta las lectivas de SU categoría
       (primaria 23 / secundaria 22), ponderadas por su %. Así quien da en dos etapas tiene
       un tope intermedio (p.ej. 7%×23 + 93%×22 = 22,07) y no salta un falso "se pasa del convenio".
       Se escala por el % de contrato. Si no hay tramos, se usa las lectivas de su categoría de convenio. */
    var sumaPct = ts.reduce(function(a,t){ return a + num(t.porcentaje); }, 0);
    var lectMaxPorEtapa;
    if(sumaPct>0){
      var lectPond = ts.reduce(function(a,t){ var c=cats[t.categoriaId]; return a + (c ? num(t.porcentaje)/100*horasBaseDe(d, c) : 0); }, 0);
      lectMaxPorEtapa = lectPond / (sumaPct/100);   /* lectivas por 100% ponderadas por dónde da clase */
    } else {
      lectMaxPorEtapa = num(tj.lectivas);
    }
    var lectMax = lectMaxPorEtapa * (pct/100);   /* escalado al % de su contrato */
    dg.lectivasAsignadas = lectAsig;
    dg.lectivasMax = lectMax;
    dg.sem = semaforoLectivas(lectAsig, lectMax);
  }
  return dg;
}
/* Fecha de referencia del curso activo: mitad del primer trimestre del año de inicio.
   Así los contratos y anexos que arrancan el 1 de septiembre ya cuentan como vigentes
   cuando se trabaja en ese curso, en vez de depender de la fecha de hoy. */
/* Periodo del curso académico activo: del 1-sept del año inicial al 31-ago del año final */
function periodoCurso(d){
  var nom = (d && (d.cursoNombre || d.curso)) || "";
  var m = String(nom).match(/(20\d{2})/);
  if(m){
    var y = parseInt(m[1], 10);
    return { desde: y + "-09-01", hasta: (y+1) + "-08-31" };
  }
  var hoy = hoyISO();
  return { desde: hoy, hasta: hoy };
}
/* (compat) fecha de referencia puntual = inicio del curso */
function fechaRefCurso(d){ return periodoCurso(d).desde; }
function contratosVigentes(p, fechaRef){
  var lst = (p && p.contratos) ? p.contratos : [];
  /* fechaRef puede ser un periodo {desde,hasta} (curso) o una fecha suelta (compat) */
  var pDesde, pHasta;
  if(fechaRef && typeof fechaRef === "object"){ pDesde = fechaRef.desde; pHasta = fechaRef.hasta; }
  else { pDesde = fechaRef || hoyISO(); pHasta = pDesde; }
  return lst.filter(function(k){
    /* el usuario puede excluir manualmente una línea del cómputo (checkbox "computa") */
    if(k.computa === false) return false;
    /* un contrato cuenta si su periodo se SOLAPA con el periodo pedido:
       - no empieza después del fin del periodo
       - no termina antes del inicio del periodo
       El contrato base (sin fecha de fin) está vigente siempre desde su inicio. */
    if(k.desde && pHasta && String(k.desde) > String(pHasta)) return false;
    if(k.hasta && pDesde && String(k.hasta) < String(pDesde)) return false;
    return true;
  });
}
function horasContrato(p, fechaRef){
  var v = contratosVigentes(p, fechaRef);
  if(!v.length) return null;
  return v.reduce(function(a,k){ return a + num(k.horas); }, 0);
}
function jornadaEstado(p, totalPct, totalH, fechaRef){
  var hc = horasContrato(p, fechaRef);
  var activo = !!(p && p.topeActivo);
  var uni = (p && p.topeUnidad === "horas") ? "horas" : "pct";
  var tope = (activo && num(p.topeValor) > 0) ? num(p.topeValor) : 100;
  if(activo && hc !== null && hc > 0){ uni = "horas"; tope = hc; }
  if(!activo) uni = "pct";
  var actual = (uni === "horas") ? (totalH||0) : (totalPct||0);
  var ratio = tope > 0 ? actual/tope : 0;
  /* Verde = tiene hueco; amarillo = completo al 100%; rojo = se pasa */
  var col = (ratio > 1.005) ? C.peligro : (ratio >= 0.995 ? C.aviso : C.ok);
  var suf = (uni === "horas") ? " h" : "%";
  var texto = r2(actual) + suf + (activo ? (" / " + r2(tope) + suf) : "");
  return { col:col, actual:actual, tope:tope, uni:uni, suf:suf, activo:activo, ratio:ratio, texto:texto, horasContrato:hc };
}
var CALM = "#8294ad";
function cuadreInfo(fin, asg, finH, asgH){
  var dif = fin - asg, difH = (finH||0) - (asgH||0);
  if(Math.abs(dif) <= 0.01) return { col:C.ok, txt:"cuadra", estado:"ok" };
  if(dif > 0) return { col:CALM, txt:"quedan " + r2(dif) + " por asignar (" + r2(difH) + " h)", estado:"falta" };
  return { col:C.aviso, txt:"sobran " + r2(-dif) + " (" + r2(-difH) + " h)", estado:"sobra" };
}
function semColorDif(dif){
  if(Math.abs(dif) <= 0.01) return C.ok;
  if(dif > 0) return CALM;
  return C.aviso;
}

function hoyISO(){ var f=new Date(); var m=("0"+(f.getMonth()+1)).slice(-2); var dd=("0"+f.getDate()).slice(-2); return f.getFullYear()+"-"+m+"-"+dd; }
function hacerSnapshot(d){ return JSON.parse(JSON.stringify({ personas:d.personas, categorias:d.categorias, fuentes:d.fuentes, tramos:d.tramos, reparto:d.reparto })); }
/* Compara tramos antes/después y genera las líneas del diario (fecha = hoy, editable luego) */
function diffTramosCambios(d, nuevos, motivo){
  var catById={}; d.categorias.forEach(function(c){ catById[c.id]=c; });
  var fNom=function(fid){ var f=d.fuentes.filter(function(x){ return x.id===fid; })[0]; return f?nombreDe(f):""; };
  var antes={}; (d.tramos||[]).forEach(function(t){ antes[t.id]=t; });
  var desp={}; (nuevos||[]).forEach(function(t){ desp[t.id]=t; });
  var out=[]; var hoy=hoyISO(); var ahora=new Date().toISOString();
  function linea(t, de, a){
    return {id:uid("cam"), fecha:hoy, registrado:ahora, personaId:t.personaId, persona:nomPersona(d, t.personaId),
      categoriaId:t.categoriaId, categoria:(catById[t.categoriaId]?nombreDe(catById[t.categoriaId]):""),
      fuente:fNom(t.fuenteId), de:de, a:a, unidad:"pct", motivo:motivo||"Cambio manual", incidenciaId:""};
  }
  Object.keys(desp).forEach(function(id){
    var n=desp[id], v=antes[id];
    if(!v){ if(num(n.porcentaje)>0.0001) out.push(linea(n, 0, num(n.porcentaje))); }
    else if(Math.abs(num(v.porcentaje)-num(n.porcentaje))>0.0001) out.push(linea(n, num(v.porcentaje), num(n.porcentaje)));
  });
  Object.keys(antes).forEach(function(id){
    if(!desp[id] && num(antes[id].porcentaje)>0.0001) out.push(linea(antes[id], num(antes[id].porcentaje), 0));
  });
  return out;
}
function setTramosLog(props, d, nuevos, motivo){
  var cam = diffTramosCambios(d, nuevos, motivo);
  props.setData(Object.assign({}, d, {tramos:nuevos, cambios:(d.cambios||[]).concat(cam)}));
}

  return (d.cambios||[]).concat([c]);
}
/* Mueve la cantidad de la incidencia de la persona (A) al sustituto (B) y deja rastro en el diario. */
/* ¿El contrato ligado a una incidencia está desfasado respecto a la incidencia?
   Devuelve: "sin-contrato" (no existe aún), "desfasado" (existe pero difiere) o "" (al día / no aplica). */
function estadoSincronizacion(d, inc){
  if(!inc || !inc.sustitutoId || !inc.aplicada) return "";
  var sust = (d.personas||[]).filter(function(p){ return p.id===inc.sustitutoId; })[0];
  if(!sust) return "";
  var linea = (sust.contratos||[]).filter(function(k){ return k.incidenciaId===inc.id; })[0];
  if(!linea) return "sin-contrato";
  var horasEsperadas = horasSustitucionDe(d, inc);
  var difHoras = Math.abs(num(linea.horas) - horasEsperadas) > 0.01;
  var difDesde = (linea.desde||"") !== (inc.desde||"");
  var difHasta = (linea.hasta||"") !== (inc.hasta||"");
  return (difHoras || difDesde || difHasta) ? "desfasado" : "";
}

/* Horas que hereda el sustituto de una incidencia = % incidencia × horas de contrato del titular.
   (Si la incidencia está en horas, usa esas horas directamente.) */
function horasSustitucionDe(d, inc){
  if(!inc) return 0;
  if(inc.unidad==="horas") return num(inc.cantidad);
  var titular = (d.personas||[]).filter(function(p){ return p.id===inc.personaId; })[0];
  if(!titular) return 0;
  var hcTitular = horasContrato(titular, periodoCurso(d));
  if(hcTitular===null || hcTitular<=0){
    /* respaldo: suma de todas sus líneas de contrato (por si no hay ninguna vigente en el curso) */
    hcTitular = (titular.contratos||[]).reduce(function(a,k){ return a + (k.computa!==false ? num(k.horas) : 0); }, 0);
  }
  return Math.round( num(inc.cantidad)/100 * hcTitular * 100 )/100;
}
/* Desglosa una SUSTITUCIÓN (incidencia) en lectivas/jornada/% usando el tipo de jornada del TITULAR.
   Así la sustituta calcula bien aunque no tenga categoría de convenio propia. */
function desgloseSustitucion(d, inc){
  var horas = horasSustitucionDe(d, inc);   /* horas de jornada total que hereda */
  var titular = (d.personas||[]).filter(function(pp){ return pp.id===inc.personaId; })[0];
  var dc = titular ? desgloseContrato(d, titular, horas) : { lectivas:null, jornadaHoras:horas, pctJornada:0, esDocente:false };
  return dc;
}
/* Borra de TODAS las personas los contratos ligados a una incidencia (por incidenciaId).
   Se usa al cambiar de sustituto/a o al eliminar la incidencia. */
function limpiarContratosDeIncidencia(personas, incId){
  return (personas||[]).map(function(pp){
    var cons=(pp.contratos||[]).filter(function(k){ return k.incidenciaId!==incId; });
    if(cons.length===(pp.contratos||[]).length) return pp;
    return Object.assign({}, pp, {contratos:cons});
  });
}
/* Crea o actualiza en la ficha del sustituto la línea de contrato ligada a ESTA incidencia.
   Devuelve el nuevo array de personas. Solo toca la línea con incidenciaId === inc.id; el resto se respeta. */
function sincronizarContratoSustituto(d, inc){
  if(!inc || !inc.sustitutoId) return d.personas;
  var horas = horasSustitucionDe(d, inc);
  var nomTit = nomPersona(d, inc.personaId);
  var tipoLinea = (inc.tipo==="Relevo") ? "Relevo" : "Sustitución";
  return (d.personas||[]).map(function(pp){
    if(pp.id !== inc.sustitutoId) return pp;
    var cons = (pp.contratos||[]).slice();
    var i = cons.findIndex(function(k){ return k.incidenciaId===inc.id; });
    var linea = {
      id: (i>=0 ? cons[i].id : uid("con")),
      desde: inc.desde||"", hasta: inc.hasta||"", tipo: tipoLinea,
      horas: horas, computa: (i>=0 ? cons[i].computa!==false : true),
      incidenciaId: inc.id,
      nota: "Cubre a "+nomTit+" ("+inc.tipo+" "+r2(inc.cantidad)+(inc.unidad==="horas"?" h":"%")+")"
    };
    if(i>=0) cons[i]=linea; else cons.push(linea);
    return Object.assign({}, pp, {contratos:cons});
  });
}

function aplicarIncidencia(d, inc){
  var catById={}; d.categorias.forEach(function(c){ catById[c.id]=c; });
  var fuenteNom = function(fid){ var f=d.fuentes.find(function(x){ return x.id===fid; }); return f?nombreDe(f):""; };
  var tramosA = d.tramos.filter(function(t){ return t.personaId===inc.personaId && (!inc.categoriaId || t.categoriaId===inc.categoriaId); });
  if(!tramosA.length) return { error:"La persona no tiene tramos" + (inc.categoriaId?" en esa categoría":"") + "." };
  // cantidad a mover, en % de jornada
  var pedidoPct = 0;
  if(inc.unidad==="horas"){
    var cRef = catById[inc.categoriaId || tramosA[0].categoriaId];
    var baseRef = cRef?horasBaseDe(d, cRef):0;
    if(baseRef<=0) return { error:"No puedo convertir horas a % (la categoría no tiene horas base)." };
    pedidoPct = num(inc.cantidad)/baseRef*100;
  } else { pedidoPct = num(inc.cantidad); }
  if(pedidoPct<=0) return { error:"Indica la cantidad de la reducción." };
  var disponible = tramosA.reduce(function(a,t){ return a+num(t.porcentaje); }, 0);
  if(pedidoPct > disponible + 0.01) return { error:"La persona solo tiene " + r2(disponible) + "% asignado" + (inc.categoriaId?" en esa categoría":"") + "." };

  var tramos = d.tramos.slice();
  var cambios = d.cambios || [];
  var resto = pedidoPct;
  var movidos = [];
  var horasMovidas = 0;
  tramosA.forEach(function(t){
    if(resto<=0.0001) return;
    var quita = Math.min(num(t.porcentaje), resto);
    resto -= quita;
    var cT = catById[t.categoriaId];
    horasMovidas += quita/100 * (cT?horasBaseDe(d, cT):0);
    var antes = num(t.porcentaje);
    var despues = Math.round((antes-quita)*10000)/10000;
    tramos = tramos.map(function(z){ return z.id===t.id ? Object.assign({}, z, {porcentaje:despues}) : z; });
    cambios = logCambio({cambios:cambios}, {fecha:inc.desde, personaId:inc.personaId, persona:nomPersona(d,inc.personaId),
      categoriaId:t.categoriaId, categoria:(catById[t.categoriaId]?nombreDe(catById[t.categoriaId]):""), fuente:fuenteNom(t.fuenteId),
      de:antes, a:despues, unidad:"pct", motivo:inc.tipo, incidenciaId:inc.id});
    movidos.push({categoriaId:t.categoriaId, fuenteId:t.fuenteId, pct:quita});
  });
  tramos = tramos.filter(function(t){ return num(t.porcentaje) > 0.0001; });

  if(inc.sustitutoId){
    movidos.forEach(function(m){
      var ex = tramos.filter(function(t){ return t.personaId===inc.sustitutoId && t.categoriaId===m.categoriaId && t.fuenteId===m.fuenteId; })[0];
      var catNom = catById[m.categoriaId]?nombreDe(catById[m.categoriaId]):"";
      if(ex){
        var antes = num(ex.porcentaje); var despues = Math.round((antes+m.pct)*10000)/10000;
        tramos = tramos.map(function(z){ return z.id===ex.id ? Object.assign({}, z, {porcentaje:despues}) : z; });
        cambios = logCambio({cambios:cambios}, {fecha:inc.desde, personaId:inc.sustitutoId, persona:nomPersona(d,inc.sustitutoId),
          categoriaId:m.categoriaId, categoria:catNom, fuente:fuenteNom(m.fuenteId), de:antes, a:despues, unidad:"pct",
          motivo:"Cubre a "+nomPersona(d,inc.personaId)+" ("+inc.tipo+")", incidenciaId:inc.id});
      } else {
        var nt = {id:uid("tr"), personaId:inc.sustitutoId, categoriaId:m.categoriaId, fuenteId:m.fuenteId,
          porcentaje:Math.round(m.pct*10000)/10000, desde:inc.desde||"", hasta:inc.hasta||"", contratoBase:"", sustituyeA:inc.personaId, notas:""};
        tramos = tramos.concat([nt]);
        cambios = logCambio({cambios:cambios}, {fecha:inc.desde, personaId:inc.sustitutoId, persona:nomPersona(d,inc.sustitutoId),
          categoriaId:m.categoriaId, categoria:catNom, fuente:fuenteNom(m.fuenteId), de:0, a:Math.round(m.pct*10000)/10000, unidad:"pct",
          motivo:"Cubre a "+nomPersona(d,inc.personaId)+" ("+inc.tipo+")", incidenciaId:inc.id});
      }
    });
  }
  var incidencias = d.incidencias.map(function(x){ return x.id===inc.id ? Object.assign({}, x, {aplicada:true}) : x; });
  return { data: Object.assign({}, d, {tramos:tramos, cambios:cambios, incidencias:incidencias}), horasMovidas: horasMovidas };
}

/* Desglosa las horas de un CONTRATO (que están en jornada total, ej. 32) en:
   total horas lectivas, total horas jornada (las propias del contrato) y % de jornada total.
   Todo desde Configuración: usa el tipo de jornada de la categoría de convenio de la persona. */
function desgloseContrato(d, persona, horasContratoLinea){
  var J = d.jornadas || {};
  var cc = persona ? persona.categoriaConvenio : null;
  var jtId = cc && J.mapaConvenio ? J.mapaConvenio[cc] : null;
  var tj = null; if(jtId){ (J.tipos||[]).forEach(function(x){ if(x.id===jtId) tj=x; }); }
  var h = num(horasContratoLinea);
  if(!tj || num(tj.jornada)<=0){ return { lectivas:null, jornadaHoras:h, pctJornada:0, esDocente:false }; }
  var frac = h/num(tj.jornada);
  var esDoc = tj.modo==="docente";
  return {
    lectivas: esDoc ? frac*num(tj.lectivas) : null,
    jornadaHoras: h,
    pctJornada: frac*100,
    esDocente: esDoc
  };
}

/* Desglosa una asignación (un tramo) en: horas lectivas, horas de jornada total y % de jornada total.
   TODO se calcula desde Configuración (tipos de jornada), así si cambia el convenio se actualiza solo.
   - Docentes: lect = %tramo/100 × lectivasCat; la fracción lect/lectivasMax arrastra su parte de comple y personal.
   - No docentes (PAS/TEJI/EAE): no hay lectivas; el %tramo va directo sobre su jornada. */
function desgloseAsignacion(d, t){
  var cats={}; (d.categorias||[]).forEach(function(c){ cats[c.id]=c; });
  var c = cats[t.categoriaId];
  if(!c) return { lectivas:0, jornadaHoras:0, pctJornada:0, comple:0, personal:0, esDocente:false };
  var J = d.jornadas || {};
  var tj = null;
  if(c.jornadaId){ (J.tipos||[]).forEach(function(x){ if(x.id===c.jornadaId) tj=x; }); }
  var esDoc = tj ? (tj.modo==="docente") : (c.tipo==="docente");
  var pct = num(t.porcentaje);
  if(esDoc && tj){
    var lectMax = num(tj.lectivas);
    var jornada = num(tj.jornada);
    var personal = num(tj.personal);
    var compleMax = jornada - lectMax - personal;
    var lect = pct/100 * lectMax;                 /* horas lectivas de esta asignación */
    var frac = lectMax>0 ? lect/lectMax : 0;      /* fracción de jornada lectiva ocupada */
    return {
      lectivas: lect,
      comple: frac*compleMax,
      personal: frac*personal,
      jornadaHoras: frac*jornada,
      pctJornada: frac*100,
      esDocente: true
    };
  }
  /* no docente: el % va directo sobre su jornada total (sin lectivas) */
  var jt = tj ? num(tj.jornada) : num(horasBaseDe(d, c));
  return {
    lectivas: 0,
    comple: 0,
    personal: pct/100*jt,
    jornadaHoras: pct/100*jt,
    pctJornada: pct,
    esDocente: false
  };
}

function repartoDe(d, tramos){
  var catById = {}; d.categorias.forEach(function(c){ catById[c.id] = c; });
  var pctP=0, pctS=0, pctN=0;
  (tramos||[]).forEach(function(t){
    var c = catById[t.categoriaId]; if(!c) return;
    if(c.etapaReparto==="primaria") pctP += num(t.porcentaje);
    else if(c.etapaReparto==="secundaria") pctS += num(t.porcentaje);
    else pctN += num(t.porcentaje);
  });
  /* Deriva lectivas/comple/personal de los TIPOS de jornada docentes (Primaria/Secundaria) */
  var J = d.jornadas || {};
  function tipoEtapa(txt){ var r=null; (J.tipos||[]).forEach(function(t){ if(t.modo==="docente" && (t.nombre||"").toLowerCase().indexOf(txt)>=0) r=t; }); return r; }
  var tP = tipoEtapa("primaria") || {jornada:32, lectivas:22, personal:5};
  var tS = tipoEtapa("secundaria") || {jornada:32, lectivas:21, personal:5};
  function comple(t){ return num(t.jornada)-num(t.lectivas); }
  return {
    lectivas: pctP/100*num(tP.lectivas) + pctS/100*num(tS.lectivas),
    comple: pctP/100*comple(tP) + pctS/100*comple(tS),
    personal: pctP/100*num(tP.personal) + pctS/100*num(tS.personal),
    pctSinReparto: pctN
  };
}

  function setCelda(pid, val){
    if(!cat) return;
    var x = num(val);
    var pct = (modo==="pct") ? x : (base>0 ? (x/base*100) : 0);
    var lst = byPersonaCat[pid] || [];
    var tramos;
    if(lst.length===0){
      if(x<=0) return;
      var nt = {id:uid("tr"), personaId:pid, categoriaId:catId, fuenteId:(cat.fuenteSugerida||""), porcentaje:Math.round(pct*10000)/10000, desde:"", hasta:"", contratoBase:"", sustituyeA:"", notas:""};
      tramos = d.tramos.concat([nt]);
    } else if(lst.length===1){
      if(x<=0){ tramos = d.tramos.filter(function(t){ return t.id!==lst[0].id; }); }
      else { tramos = d.tramos.map(function(t){ return t.id===lst[0].id ? Object.assign({}, t, {porcentaje:Math.round(pct*10000)/10000}) : t; }); }
    } else { return; }
    setTramosLog(props, d, tramos, "Cambio manual");
  }
  function setFuente(pid, fid){
    var lst = byPersonaCat[pid] || [];
    if(lst.length!==1) return;
    var tramos = d.tramos.map(function(t){ return t.id===lst[0].id ? Object.assign({}, t, {fuenteId:fid}) : t; });
    setTramosLog(props, d, tramos, "Cambio manual");
  }

  var ql = fq.trim().toLowerCase();
  var personas = d.personas.slice().filter(function(p){ return puedeEntrar(p, cat) || (byPersonaCat[p.id] && byPersonaCat[p.id].length); });
  if(ql) personas = personas.filter(function(p){ return (p.apellidos+" "+p.nombre).toLowerCase().indexOf(ql)>=0; });
  personas.sort(function(a,b){
    var ha=(byPersonaCat[a.id]?1:0), hb=(byPersonaCat[b.id]?1:0);
    if(ha!==hb) return hb-ha;
    return cmpPersona(a, b);
  });

  function celdaVal(pid){
    var lst = byPersonaCat[pid] || [];
    if(!lst.length) return "";
    var pct = lst.reduce(function(a,t){ return a+num(t.porcentaje); }, 0);
    return modo==="pct" ? String(Math.round(pct*100)/100) : String(Math.round(pct/100*base*100)/100);
  }

  return (
    <div>
      <div style={{display:"flex", flexWrap:"wrap", gap:8, alignItems:"center", marginBottom:10}}>
        <button onClick={function(){ setSoloPend(!soloPend); }}
          style={{display:"inline-flex", alignItems:"center", gap:6, border:"1px solid "+(soloPend?C.azul:C.borde), background:soloPend?C.infoBg:"#fff", color:soloPend?C.azul:C.secundario, borderRadius:8, padding:"6px 11px", cursor:"pointer", fontSize:J, fontWeight:600}}>
          {soloPend?"✓ ":""}Solo pendientes
        </button>
        <select style={Object.assign({}, S.input, {width:150})} value={fGrupo} onChange={function(e){ setFGrupo(e.target.value); }}>
          <option value="">Todos los grupos</option>
          {(function(){ var gs=[],seen={}; cats.forEach(function(c){ if(!seen[c.grupoCuadre]){seen[c.grupoCuadre]=true;gs.push(c.grupoCuadre);} }); return gs.sort().map(function(g){ return <option key={g} value={g}>{g}</option>; }); })()}
        </select>
      </div>
      <div style={{display:"flex", flexWrap:"wrap", gap:6, marginBottom:14}}>
        {cats.slice().filter(function(c){
          if(fGrupo && c.grupoCuadre!==fGrupo) return false;
          if(soloPend){ if(!c.cuadra) return false; var fin=num(c.unidades)*num(c.ratioProfAula); var asg=asgPorCat[c.id]||0; return Math.abs(fin-asg)>0.01; }
          return true;
        }).sort(function(a,b){
          var pa = a.cuadra ? Math.abs(num(a.unidades)*num(a.ratioProfAula)-(asgPorCat[a.id]||0)) : -1;
          var pb = b.cuadra ? Math.abs(num(b.unidades)*num(b.ratioProfAula)-(asgPorCat[b.id]||0)) : -1;
          var aPend = pa>0.01?1:0, bPend = pb>0.01?1:0;
          if(aPend!==bPend) return bPend-aPend;
          return 0;
        }).map(function(c){
          var on = c.id===catId;
          var dot;
          if(!c.cuadra) dot = C.secundario;
          else { var fin=num(c.unidades)*num(c.ratioProfAula); var asg=asgPorCat[c.id]||0; dot = cuadreInfo(fin, asg).col; }
          return <button key={c.id} onClick={function(){ setCatId(c.id); }} title={c.grupoCuadre}
            style={{display:"inline-flex", alignItems:"center", gap:6, border:"1px solid "+(on?C.azul:C.borde), background:on?C.infoBg:"#fff", color:on?C.azul:C.texto, borderRadius:8, padding:"6px 11px", cursor:"pointer", fontSize:13, fontWeight:on?700:500}}>
            <span style={{width:8, height:8, borderRadius:"50%", background:dot}}></span>{nombreDe(c)}
          </button>;
        })}
      </div>
      <div style={{display:"flex", flexWrap:"wrap", gap:10, alignItems:"center", marginBottom:14}}>
        <input style={Object.assign({}, S.input, {width:200})} placeholder="Buscar persona…" value={fq} onChange={function(e){ setFq(e.target.value); }} />
        <span style={{fontSize:12, color:C.secundario}}>{personas.length} persona(s) pueden entrar aquí</span>
      </div>

      {cat ? (
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(300px, 1fr))", gap:12, marginBottom:16}}>
          <CategoriaResumen cat={cat} asg={asgCat} data={d} />
          <CuadreBar label={"Grupo " + grupo + " · objetivo real"} fin={finG} asg={asgG} finH={finGH} asgH={asgGH} min={240} />
        </div>
      ) : null}

      <div style={Object.assign({}, S.card, {padding:0, overflow:"hidden"})}>
        <div style={{maxHeight:"54vh", overflowY:"auto"}}>
          <div className="tabla-scroll"><table>
            <thead><tr>
              <th>Persona</th>
              <th className="num" style={{width:92}}>{modo==="pct" ? "% lectivas" : "H. lectivas"}</th>
              <th style={{width:160}}>Fuente</th>
              <th className="num" style={{width:110}} title="Total de horas lectivas asignadas de la persona (todas sus categorías) sobre su tope de lectivas">{modo==="pct" ? "% lect. total" : "Lectivas tot."}</th>
              <th className="num" style={{width:110}} title="Jornada laboral total de la persona sobre la jornada de convenio">{modo==="pct" ? "% jorn. total" : "Jorn. total"}</th>
            </tr></thead>
            <tbody>
              {personas.map(function(p){
                var lst = byPersonaCat[p.id] || []; var n = lst.length;
                var fuente = n===1 ? lst[0].fuenteId : "";
                var jp = jornadaPersona(d, p);
                var esDoc = jp && !jp.vacio && jp.modo==="docente";
                /* Totales de la persona (todas sus categorías) */
                var lectAsigTot = (jp && !jp.vacio && esDoc) ? jp.lectivasAsignadas : 0;
                var lectMaxTot = (jp && !jp.vacio && esDoc) ? jp.lectivasMax : 0;
                var jornAsigTot = 0;
                (d.tramos||[]).filter(function(t){ return t.personaId===p.id; }).forEach(function(t){ jornAsigTot += desgloseAsignacion(d, t).jornadaHoras; });
                /* el tope es lo que suman SUS CONTRATOS (no la jornada del convenio): si se pasa, hay que ampliar contrato o quitar horas */
                var jornMax = (jp && !jp.vacio) ? num(jp.horasContrato) : 0;
                /* semáforos (opción 1: 100% = verde) */
                var colLect = lectMaxTot>0 ? semColorPersona(lectAsigTot/lectMaxTot*100) : C.secundario;
                var colJorn = jornMax>0 ? semColorPersona(jornAsigTot/jornMax*100) : C.secundario;
                var lectTxt = esDoc ? (modo==="pct" ? (lectMaxTot>0?r2(lectAsigTot/lectMaxTot*100)+"%":"—") : (r2(lectAsigTot)+" / "+r2(lectMaxTot))) : "—";
                var jornTxt = (jp && !jp.vacio) ? (modo==="pct" ? (jornMax>0?r2(jornAsigTot/jornMax*100)+"%":"—") : (r2(jornAsigTot)+" / "+r2(jornMax))) : "—";
                return (
                  <tr key={p.id}>
                    <td style={{fontWeight:600, color: n? C.titulo : C.secundario}}>{(p.apellidos+", "+p.nombre).replace(/^, |, $/,"")}{p.topeActivo?<span title="Tope activo" style={{color:C.secundario}}> ·⚑</span>:null}</td>
                    <td style={{padding:2}}>
                      <CeldaInput horas={celdaVal(p.id)} disabled={n>1} title={n>1 ? "Varios tramos" : ""} onCommit={function(v){ setCelda(p.id, v); }} />
                    </td>
                    <td>
                      <select className="cellinput" value={fuente} disabled={n!==1} onChange={function(e){ setFuente(p.id, e.target.value); }}>
                        <option value="">{n===1 ? "—" : (n>1 ? "varias" : "(al asignar)")}</option>
                        {d.fuentes.map(function(f){ return <option key={f.id} value={f.id}>{nombreDe(f)}</option>; })}
                      </select>
                    </td>
                    <td className="num" style={{fontWeight:700, color:colLect, whiteSpace:"nowrap"}}>{lectTxt}</td>
                    <td className="num" style={{fontWeight:700, color:colJorn, whiteSpace:"nowrap"}}>{jornTxt}</td>
                  </tr>
                );
              })}
            </tbody>
          </table></div>
        </div>
      </div>
      <p style={{color:C.secundario, fontSize:12, marginTop:10}}>
        Rellena la columna editable de arriba abajo (horas o % lectivas de esta categoría). Al escribir, se crea el tramo con la fuente sugerida; luego puedes cambiarla. Las dos últimas columnas se recalculan solas: muestran el total de lectivas y la jornada total de la persona, con semáforo (verde = al 100%, ámbar = falta, rojo = se pasa).
      </p>
    </div>
  );
}

function MatrizTab(props){
  var d = props.data;
  var cats = d.categorias;
  var [extra, setExtra] = useState([]);
  var [añadir, setAñadir] = useState("");
  var modo = (d.unidad==="pct")?"pct":"horas";
  var [fq, setFq] = useState("");
  var [fLab, setFLab] = useState("");
  var [fGrupo, setFGrupo] = useState("");
  var [fFuente, setFFuente] = useState("");
  var [pantalla, setPantalla] = useState(false);      /* overlay a ventana completa */
  var [verCuadre, setVerCuadre] = useState(false);    /* panel de cuadre plegado por defecto */
  var [fontMatriz, setFontMatriz] = useState(12);     /* tamaño de fuente de la matriz (px), ajustable */
  var [colsOcultas, setColsOcultas] = useState({});   /* categorías ocultas en la vista (opción A) */
  var [verCols, setVerCols] = useState(false);        /* panel de mostrar/ocultar columnas */

  var catById = {}; cats.forEach(function(c){ catById[c.id] = c; });
  var catsVis = cats.filter(function(c){ return !colsOcultas[c.id]; });   /* columnas visibles (opción A) */

  var byCell = {}, byPersonaPct = {}, byPersonaH = {}, byCatPct = {}, byCatH = {};
  d.tramos.forEach(function(t){
    var c = catById[t.categoriaId];
    var base = c ? horasBaseDe(d, c) : 0;
    var k = t.personaId + "|" + t.categoriaId;
    (byCell[k] = byCell[k] || []).push(t);
    byPersonaPct[t.personaId] = (byPersonaPct[t.personaId] || 0) + num(t.porcentaje);
    byPersonaH[t.personaId] = (byPersonaH[t.personaId] || 0) + num(t.porcentaje)/100*base;
    byCatPct[t.categoriaId] = (byCatPct[t.categoriaId] || 0) + num(t.porcentaje);
    byCatH[t.categoriaId] = (byCatH[t.categoriaId] || 0) + num(t.porcentaje)/100*base;
  });

  var gruposDe = {}, fuentesDe = {};
  d.tramos.forEach(function(t){
    var c = catById[t.categoriaId];
    if(c){ (gruposDe[t.personaId] = gruposDe[t.personaId] || {})[c.grupoCuadre] = true; }
    (fuentesDe[t.personaId] = fuentesDe[t.personaId] || {})[t.fuenteId] = true;
  });

  var conTramo = {}; d.tramos.forEach(function(t){ conTramo[t.personaId] = true; });
  var filas = d.personas.filter(function(p){ return conTramo[p.id] || extra.indexOf(p.id) >= 0; });
  var ql = fq.trim().toLowerCase();
  filas = filas.filter(function(p){
    if(ql && (p.apellidos+" "+p.nombre).toLowerCase().indexOf(ql) < 0) return false;
    if(fLab && (p.categoriasLaborales||[]).indexOf(fLab) < 0) return false;
    if(fGrupo && !((gruposDe[p.id]||{})[fGrupo])) return false;
    if(fFuente && !((fuentesDe[p.id]||{})[fFuente])) return false;
    return true;
  });
  filas.sort(function(a,b){
    return cmpPersona(a, b);
  });

  function setCelda(pid, catId, val){
    var cat = catById[catId]; var base = cat ? horasBaseDe(d, cat) : 0;
    var x = num(val);
    var pct = (modo==="pct") ? x : (base>0 ? (x/base*100) : 0);
    var lst = byCell[pid+"|"+catId] || [];
    var tramos;
    if(lst.length === 0){
      if(x <= 0) return;
      var nt = {id:uid("tr"), personaId:pid, categoriaId:catId, fuenteId:(cat.fuenteSugerida||""),
        porcentaje:Math.round(pct*10000)/10000, desde:"", hasta:"", contratoBase:"", sustituyeA:"", notas:""};
      tramos = d.tramos.concat([nt]);
    } else if(lst.length === 1){
      if(x <= 0){ tramos = d.tramos.filter(function(t){ return t.id !== lst[0].id; }); }
      else { tramos = d.tramos.map(function(t){ return t.id===lst[0].id ? Object.assign({}, t, {porcentaje:Math.round(pct*10000)/10000}) : t; }); }
    } else { return; }
    setTramosLog(props, d, tramos, "Cambio manual");
  }

  var finFTE = {}, asgFTE = {}, finH = {}, asgH = {}, grupos = {}, gruposArr = [];
  cats.forEach(function(c){
    if(!c.cuadra) return;
    if(!grupos[c.grupoCuadre]){ grupos[c.grupoCuadre] = true; gruposArr.push(c.grupoCuadre); }
    finFTE[c.grupoCuadre] = (finFTE[c.grupoCuadre]||0) + num(c.unidades)*num(c.ratioProfAula);
    finH[c.grupoCuadre] = (finH[c.grupoCuadre]||0) + num(c.unidades)*num(c.ratioProfAula)*horasBaseDe(d, c);
  });
  Object.keys(byCatPct).forEach(function(cid){
    var c = catById[cid];
    if(c && c.cuadra){
      asgFTE[c.grupoCuadre] = (asgFTE[c.grupoCuadre]||0) + byCatPct[cid]/100;
      asgH[c.grupoCuadre] = (asgH[c.grupoCuadre]||0) + (byCatH[cid]||0);
    }
  });

  var stickyL = {position:"sticky", left:0, background:C.blanco, zIndex:2, minWidth:170, boxShadow:"1px 0 0 "+C.borde};
  var stickyLh = Object.assign({}, stickyL, {zIndex:3, background:"rgba(255,255,255,.96)"});

  function celda(p, c){
    var lst = byCell[p.id+"|"+c.id] || [];
    var n = lst.length;
    var compat = puedeEntrar(p, c);
    if(!compat && n===0){
      return <td key={c.id} style={{padding:2, background:C.superficie}} title="No aplicable a su categoría laboral"></td>;
    }
    var pct = lst.reduce(function(a,t){ return a+num(t.porcentaje); }, 0);
    var base = horasBaseDe(d, c);
    var val = pct>0 ? (modo==="pct" ? String(Math.round(pct*100)/100) : String(Math.round(pct/100*base*100)/100)) : "";
    var alt = pct>0 ? (modo==="pct" ? (Math.round(pct/100*base*10)/10+" h") : (Math.round(pct*10)/10+"%")) : "";
    return (
      <td key={c.id} style={{padding:2, background: compat ? "transparent" : C.peligroBg}}>
        <CeldaInput horas={val} disabled={n>1}
          title={n>1 ? "Varios tramos (edítalo en Paneles)" : (compat ? alt : "Fuera de su categoría laboral")}
          onCommit={function(v){ setCelda(p.id, c.id, v); }} />
      </td>
    );
  }

  var grupoOpts = gruposArr.slice().sort();

  function toggleFsReal(){
    try {
      var el = document.getElementById("matriz-full");
      if(!document.fullscreenElement){ if(el && el.requestFullscreen) el.requestFullscreen(); }
      else { if(document.exitFullscreen) document.exitFullscreen(); }
    } catch(e){ /* algunos navegadores lo bloquean con file:// */ }
  }
  function imprimirMatrizHoriz(){
    /* Abre una ventana nueva solo con la tabla de la matriz: es la forma fiable de imprimir
       una tabla grande en horizontal y en varias páginas, sin que el resto de la app interfiera. */
    var cont = document.getElementById("matriz-tabla-print");
    if(!cont){ window.print(); return; }
    var w = window.open("", "_blank");
    if(!w){ alert("El navegador ha bloqueado la ventana de impresión. Permite las ventanas emergentes para este archivo."); return; }
    var titulo = "Matriz de reparto — " + (d.curso || "");
    var html = ""
      + "<html><head><title>" + titulo + "</title><meta charset=\"utf-8\">"
      + "<style>"
      + "@page{size:A4 landscape;margin:8mm;}"
      + "*{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box;}"
      + "body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:0;color:#222;}"
      + "h2{font-size:13px;margin:0 0 8px;}"
      + "table{border-collapse:collapse;width:100%;font-size:7.5px;}"
      + "th,td{border:1px solid #ccc;padding:2px 3px;text-align:right;white-space:nowrap;}"
      + "th:first-child,td:first-child{text-align:left;position:sticky;left:0;}"
      + "thead{display:table-header-group;}"
      + "tr{page-break-inside:avoid;}"
      + "thead th{background:#eef2f8;}"
      + "tfoot td{background:#f5f7fb;font-weight:700;}"
      + "input{border:none;background:transparent;font-size:7.5px;text-align:right;width:100%;padding:0;}"
      + "select{display:none;}"
      + "</style></head><body>"
      + "<h2>" + titulo + "</h2>"
      + cont.innerHTML
      + "</body></html>";
    w.document.open(); w.document.write(html); w.document.close();
    setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} }, 350);
  }
  var contStyle = pantalla
    ? {position:"fixed", top:0, left:0, right:0, bottom:0, background:C.blanco, zIndex:9000, padding:"10px 14px", overflow:"auto"}
    : {};
  return (
    <div id="matriz-full" style={contStyle}>
      {/* barra de filtros compacta + botones de pantalla completa */}
      <div style={{display:"flex", flexWrap:"wrap", gap:8, alignItems:"center", marginBottom:10}}>
        <input style={Object.assign({}, S.input, {width:140, height:32})} placeholder="Buscar persona…" value={fq} onChange={function(e){ setFq(e.target.value); }} />
        <select style={Object.assign({}, S.input, {width:150, height:32})} value={fLab} onChange={function(e){ setFLab(e.target.value); }}>
          <option value="">Categoría laboral…</option>
          {(d.categoriasLaborales||[]).map(function(o){ return <option key={o.id} value={o.id}>{nombreDe(o)}</option>; })}
        </select>
        <select style={Object.assign({}, S.input, {width:120, height:32})} value={fGrupo} onChange={function(e){ setFGrupo(e.target.value); }}>
          <option value="">Grupo…</option>
          {grupoOpts.map(function(g){ return <option key={g} value={g}>{g}</option>; })}
        </select>
        <select style={Object.assign({}, S.input, {width:140, height:32})} value={fFuente} onChange={function(e){ setFFuente(e.target.value); }}>
          <option value="">Fuente…</option>
          {d.fuentes.map(function(f){ return <option key={f.id} value={f.id}>{nombreDe(f)}</option>; })}
        </select>
        {(fq||fLab||fGrupo||fFuente) ? <button style={S.btnGhost} onClick={function(){ setFq(""); setFLab(""); setFGrupo(""); setFFuente(""); }}>Limpiar</button> : null}
        <div style={{marginLeft:"auto", display:"flex", gap:8, alignItems:"center"}}>
          <div style={{display:"flex", alignItems:"center", gap:2, border:"1px solid "+C.borde, borderRadius:8, padding:"1px 4px"}} title="Tamaño de letra de la matriz">
            <button style={{border:"none", background:"transparent", cursor:"pointer", fontSize:13, color:C.secundario, padding:"3px 6px", fontWeight:700}} onClick={function(){ setFontMatriz(Math.max(8, fontMatriz-1)); }}>A−</button>
            <span style={{fontSize:10, color:C.secundario, minWidth:26, textAlign:"center"}}>{fontMatriz}px</span>
            <button style={{border:"none", background:"transparent", cursor:"pointer", fontSize:15, color:C.secundario, padding:"3px 6px", fontWeight:700}} onClick={function(){ setFontMatriz(Math.min(20, fontMatriz+1)); }}>A+</button>
          </div>
          <button style={S.btnGhost} onClick={function(){ setVerCols(!verCols); }}>{verCols?"Cerrar columnas":"Columnas"}</button>
          <button style={S.btnGhost} onClick={function(){ setVerCuadre(!verCuadre); }}>{verCuadre?"Ocultar cuadre":"Ver cuadre"}</button>
          <button style={S.btnGhost} onClick={function(){ imprimirMatrizHoriz(); }} title="Imprimir o guardar como PDF (horizontal)">Imprimir / PDF</button>
          {pantalla ? <button style={S.btnGhost} onClick={toggleFsReal} title="Pantalla completa del navegador">⛶ Monitor</button> : null}
          <button style={S.btnPri} onClick={function(){ var np=!pantalla; setPantalla(np); if(!np && document.fullscreenElement && document.exitFullscreen){ try{ document.exitFullscreen(); }catch(e){} } }}>
            {pantalla ? "✕ Salir" : "⛶ Pantalla completa"}
          </button>
        </div>
      </div>

      {/* panel de mostrar/ocultar columnas (opción A) */}
      {verCols ? (
      <div className="no-print" style={{marginBottom:12, padding:"10px 12px", background:C.superficie, border:"1px solid "+C.borde, borderRadius:10}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
          <span style={{fontSize:12, fontWeight:700, color:C.titulo}}>Mostrar / ocultar categorías</span>
          <div style={{display:"flex", gap:8}}>
            <button style={S.btnGhost} onClick={function(){ setColsOcultas({}); }}>Mostrar todas</button>
            <button style={S.btnGhost} onClick={function(){ var o={}; cats.forEach(function(c){ o[c.id]=true; }); setColsOcultas(o); }}>Ocultar todas</button>
          </div>
        </div>
        <div style={{display:"flex", flexWrap:"wrap", gap:"4px 14px"}}>
          {cats.map(function(c){

function descargarTabla(nombreBase, hojas){
  try{
    if(window.XLSX){
      var wb = XLSX.utils.book_new();
      hojas.forEach(function(h){
        var ws = XLSX.utils.aoa_to_sheet(h.aoa);
        XLSX.utils.book_append_sheet(wb, ws, String(h.nombre || "Hoja").substring(0,31));
      });
      XLSX.writeFile(wb, nombreBase + ".xlsx");
      return "xlsx";
    }
  }catch(e){}
  var sep = ";"; var lineas = [];
  hojas.forEach(function(h){
    if(hojas.length>1) lineas.push('"=== ' + String(h.nombre||"") + ' ==="');
    h.aoa.forEach(function(r){ lineas.push(r.map(function(v){ var s=(v===null||v===undefined)?"":String(v); s=s.replace(/"/g,'""'); return '"'+s+'"'; }).join(sep)); });
    lineas.push("");
  });
  var blob = new Blob(["\ufeff"+lineas.join("\r\n")], {type:"text/csv;charset=utf-8;"});
  var url = URL.createObjectURL(blob); var a = document.createElement("a"); a.href = url; a.download = nombreBase+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  return "csv";
}
